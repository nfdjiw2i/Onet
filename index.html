<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Chat - Ultimate Edition v4</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',Courier,monospace;user-select:none;color:#fff}
        body{background:#000;color:#fff;height:100vh;overflow:hidden}
        .hidden{display:none!important}
        #auth-screen{display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;position:fixed;top:0;left:0;background:#000;z-index:3000}
        .auth-card{border:1px solid #fff;padding:40px;width:360px;background:#000}
        .auth-card h2{margin-bottom:25px;text-align:center;letter-spacing:2px;font-size:20px}
        .input-group{margin-bottom:18px}
        .input-group label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:1px;color:#ccc}
        .input-group input,.input-group select,.input-group textarea{width:100%;background:#000;border:1px solid #fff;color:#fff;padding:10px;font-size:14px;outline:none}
        .input-group input:focus,.input-group textarea:focus,.input-group select:focus{background:#0a0a0a}
        .auth-btn{width:100%;background:#000;border:1px solid #fff;color:#fff;padding:11px;cursor:pointer;font-size:14px;letter-spacing:1px;margin-top:8px;transition:background .15s,color .15s}
        .auth-btn:hover{background:#fff;color:#000}
        .switch-auth{margin-top:16px;text-align:center;font-size:12px;cursor:pointer;text-decoration:underline;color:#ccc}
        .switch-auth:hover{color:#fff}
        #app-screen{display:flex;height:100vh;width:100vw}
        .sidebar-channels{width:260px;border-right:1px solid #fff;display:flex;flex-direction:column;background:#000;flex-shrink:0}
        .server-header{padding:16px 18px;border-bottom:1px solid #fff;font-weight:bold;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;position:relative;cursor:pointer}
        .server-header:hover{background:#0a0a0a}
        .channels-list{padding:10px 8px;flex-grow:1;overflow-y:auto}
        .category-group{margin-bottom:12px}
        .category-group.dragging{opacity:.35}
        .category-header{font-size:11px;letter-spacing:1px;color:#aaa;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;cursor:pointer}
        .category-header:hover{color:#fff;background:#111}
        .category-channels{padding-left:6px;margin-top:3px;display:flex;flex-direction:column;gap:1px;min-height:8px}
        .channel-item{padding:6px 10px;cursor:pointer;font-size:13px;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid transparent;border-radius:2px}
        .channel-item.dragging{opacity:.35}
        .channel-item:hover{background:#111;border-color:#333}
        .channel-item.active{background:#1a1a1a;border-color:#fff}
        .channel-actions{display:none;gap:4px}
        .channel-item:hover .channel-actions{display:flex}
        .channel-action-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:13px;padding:0 2px}
        .user-profile{padding:12px 14px;border-top:1px solid #fff;font-size:12px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#000}
        .user-profile:hover{background:#111}
        .user-avatar-sm{width:36px;height:36px;border:1px solid #fff;object-fit:cover;background:#222;flex-shrink:0}
        .user-info-text{flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:2px}
        .logout-btn{background:none;border:1px solid #fff;color:#fff;padding:4px 8px;font-size:10px;cursor:pointer;letter-spacing:.5px}
        .logout-btn:hover{background:#fff;color:#000}
        .chat-area{flex-grow:1;display:flex;flex-direction:column;background:#000;min-width:0}
        .chat-header{padding:16px 20px;border-bottom:1px solid #fff;font-size:14px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
        .channel-settings-gear{cursor:pointer;font-size:16px;background:none;border:none;color:#fff;padding:4px 8px}
        .channel-settings-gear:hover{background:#111}
        .chat-messages{flex-grow:1;padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
        .message{font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;position:relative;padding:4px 6px;border-radius:2px}
        .message:hover{background:#0a0a0a}
        .msg-avatar{width:40px;height:40px;border:1px solid #fff;object-fit:cover;background:#222;flex-shrink:0}
        .msg-content{flex-grow:1;display:flex;flex-direction:column;min-width:0}
        .msg-header-row{display:flex;align-items:center;gap:10px;margin-bottom:2px}
        .message .msg-user{font-weight:bold;font-size:13px}
        .message .msg-time{font-size:10px;color:#888}
        .message .msg-text{word-break:break-word;white-space:pre-wrap}
        .message img,.message video{max-width:320px;max-height:260px;border:1px solid #fff;margin-top:8px;display:block;object-fit:contain}
        .msg-actions{display:none;position:absolute;right:8px;top:4px;gap:4px}
        .message:hover .msg-actions{display:flex}
        .msg-action-btn{background:#000;border:1px solid #fff;color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
        .msg-action-btn:hover{background:#fff;color:#000}
        .chat-input-area{padding:16px 20px;border-top:1px solid #fff}
        .chat-input-form{display:flex;border:1px solid #fff;align-items:stretch}
        .file-upload-label{padding:0 14px;cursor:pointer;border-right:1px solid #fff;font-size:18px;display:flex;align-items:center;color:#fff;background:#000}
        .file-upload-label:hover{background:#fff;color:#000}
        .chat-input-form input[type=text]{flex-grow:1;background:#000;border:none;color:#fff;padding:12px 14px;font-size:14px;outline:none}
        .chat-input-form button[type=submit]{background:#000;border-left:1px solid #fff;color:#fff;padding:0 22px;cursor:pointer;font-size:13px;letter-spacing:1px;transition:background .15s,color .15s}
        .chat-input-form button[type=submit]:hover{background:#fff;color:#000}
        .sidebar-members{width:240px;border-left:1px solid #fff;padding:16px 14px;background:#000;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex-shrink:0}
        .members-section h3{font-size:11px;letter-spacing:1px;margin-bottom:8px;color:#aaa}
        .member-item{font-size:13px;margin-bottom:6px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border:1px solid transparent}
        .member-item:hover{border-color:#fff;background:#111}
        .member-avatar-sm{width:28px;height:28px;border:1px solid #fff;object-fit:cover;background:#222}
        #context-menu{position:fixed;background:#000;border:1px solid #fff;padding:4px 0;z-index:5000;min-width:180px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.6)}
        #server-dropdown-menu{position:absolute;top:100%;left:0;right:0;background:#000;border:1px solid #fff;padding:4px 0;z-index:5000;display:none}
        .context-menu-item{padding:8px 14px;font-size:12px;cursor:pointer;letter-spacing:.5px}
        .context-menu-item:hover{background:#fff;color:#000}
        .context-menu-item.danger{color:#ff5555}
        .context-menu-item.danger:hover{background:#ff5555;color:#000}
        .modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:4000}
        .modal-card{background:#000;border:1px solid #fff;padding:28px;width:560px;max-height:85vh;overflow-y:auto}
        .modal-card h3{margin-bottom:18px;font-size:16px;letter-spacing:1px}
        .modal-buttons{display:flex;gap:10px;margin-top:20px}
        .admin-panel-btn{background:#000;border:1px solid #fff;color:#fff;padding:9px 14px;font-size:12px;cursor:pointer;letter-spacing:1px;flex-grow:1;text-align:center}
        .admin-panel-btn:hover{background:#fff;color:#000}
        .admin-panel-btn.danger{border-color:#ff5555;color:#ff5555}
        .admin-panel-btn.danger:hover{background:#ff5555;color:#000}
        .checkbox-group{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;cursor:pointer}
        .checkbox-group input{cursor:pointer;width:15px;height:15px;accent-color:#fff}
        .settings-modal-layout{display:flex;gap:18px;height:420px}
        .settings-sidebar{width:150px;border-right:1px solid #333;display:flex;flex-direction:column;gap:4px;padding-right:10px;flex-shrink:0}
        .settings-tab-btn{background:none;border:none;color:#fff;text-align:left;padding:8px 10px;cursor:pointer;font-size:13px;letter-spacing:.5px}
        .settings-tab-btn:hover,.settings-tab-btn.active{background:#fff;color:#000}
        .settings-content{flex-grow:1;overflow-y:auto;padding-right:4px}
        .tab-pane.hidden{display:none}
        .empty-state{padding:40px 20px;text-align:center;color:#666;font-size:13px}
        .access-denied{padding:30px 20px;text-align:center;color:#ff5555;font-size:14px;letter-spacing:1px}
        ::-webkit-scrollbar{width:8px;height:8px}
        ::-webkit-scrollbar-track{background:#000}
        ::-webkit-scrollbar-thumb{background:#333;border:1px solid #555}
        ::-webkit-scrollbar-thumb:hover{background:#555}
    </style>
</head>
<body>
    <div id="context-menu"></div>
    <div id="auth-screen">
        <div class="auth-card">
            <h2 id="auth-title">AUTHORIZATION</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="username-input" required autocomplete="off" maxlength="24">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password-input" required maxlength="64">
                </div>
                <button type="submit" class="auth-btn" id="auth-submit-btn">LOGIN</button>
            </form>
            <div class="switch-auth" id="switch-auth-mode">Need an account? Register</div>
        </div>
    </div>
    <div id="app-screen" class="hidden">
        <div class="sidebar-channels" id="sidebar-channels-panel">
            <div class="server-header" id="server-header-main">
                <span id="server-title-display">MAIN SERVER</span>
                <span style="font-size:16px;cursor:pointer" id="server-gear-btn" title="Server Settings">⚙</span>
                <div id="server-dropdown-menu">
                    <div class="context-menu-item" id="server-menu-edit-roles">Edit Roles</div>
                    <div class="context-menu-item" id="server-menu-edit-server">Edit Server Name</div>
                </div>
            </div>
            <div class="channels-list" id="channels-container"></div>
            <div class="user-profile" id="user-profile-bar">
                <img id="my-avatar-display" class="user-avatar-sm" src="" alt="">
                <div class="user-info-text">
                    <div id="current-username-display" style="font-weight:bold;font-size:13px">User</div>
                    <div id="current-user-desc" style="font-size:10px;color:#999">Edit Profile</div>
                </div>
                <button class="logout-btn" id="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <span id="active-channel-title"># general</span>
                <button class="channel-settings-gear" id="channel-gear-btn" title="Channel Settings">⚙</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area" id="chat-input-container">
                <form class="chat-input-form" id="chat-form">
                    <label class="file-upload-label" title="Upload image or video">+</label>
                    <input type="file" id="media-file-input" accept="image/*,video/*" style="display:none">
                    <input type="text" id="message-input" placeholder="Message channel..." autocomplete="off" maxlength="2000">
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>
        <div class="sidebar-members" id="sidebar-members-container"></div>
    </div>
    <div id="modal-container"></div>
    <script>
        const FIREBASE_URL = "https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
        const FIREBASE_TOKEN = "87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";
        const OWNER = "SStwendRT";
        let isRegistering = false;
        let currentUser = localStorage.getItem('chat_user') || null;
        let userIp = "unknown";
        let currentChannel = "general";
        let currentChannelCatKey = "general_cat";
        let isAdmin = false;
        let contextTarget = null;
        let lastMessagesHash = "";
        let isPolling = false;
        const userIpPromise = fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(d => { userIp = d.ip || "unknown"; return userIp; })
            .catch(() => { userIp = "unknown"; return "unknown"; });
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const switchAuthMode = document.getElementById('switch-auth-mode');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const currentUsernameDisplay = document.getElementById('current-username-display');
        const currentUserDesc = document.getElementById('current-user-desc');
        const myAvatarDisplay = document.getElementById('my-avatar-display');
        const userProfileBar = document.getElementById('user-profile-bar');
        const logoutBtn = document.getElementById('logout-btn');
        const serverGearBtn = document.getElementById('server-gear-btn');
        const serverDropdownMenu = document.getElementById('server-dropdown-menu');
        const serverMenuEditRoles = document.getElementById('server-menu-edit-roles');
        const serverMenuEditServer = document.getElementById('server-menu-edit-server');
        const channelGearBtn = document.getElementById('channel-gear-btn');
        const serverTitleDisplay = document.getElementById('server-title-display');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const channelsContainer = document.getElementById('channels-container');
        const sidebarChannelsPanel = document.getElementById('sidebar-channels-panel');
        const sidebarMembersContainer = document.getElementById('sidebar-members-container');
        const activeChannelTitle = document.getElementById('active-channel-title');
        const mediaFileInput = document.getElementById('media-file-input');
        const fileUploadLabel = document.querySelector('.file-upload-label');
        const contextMenu = document.getElementById('context-menu');
        const chatInputContainer = document.getElementById('chat-input-container');
        fileUploadLabel.addEventListener('click', () => mediaFileInput.click());
        document.addEventListener('click', () => {
            contextMenu.style.display = 'none';
            serverDropdownMenu.style.display = 'none';
        });
        sidebarChannelsPanel.addEventListener('contextmenu', e => {
            e.preventDefault();
            e.stopPropagation();
            if (!isAdmin) return;
            contextTarget = { type: 'sidebar' };
            showContextMenu(e.clientX, e.clientY, ['create-channel', 'create-category', 'edit-roles']);
        });
        serverGearBtn.addEventListener('click', e => {
            e.stopPropagation();
            if (!isAdmin) { alert("Only administrators can manage server settings."); return; }
            serverDropdownMenu.style.display = serverDropdownMenu.style.display === 'block' ? 'none' : 'block';
        });
        serverMenuEditRoles.addEventListener('click', e => {
            e.stopPropagation();
            serverDropdownMenu.style.display = 'none';
            openRolesModal();
        });
        serverMenuEditServer.addEventListener('click', e => {
            e.stopPropagation();
            serverDropdownMenu.style.display = 'none';
            handleCreateCommunityPrompt();
        });
        channelGearBtn.addEventListener('click', e => {
            e.stopPropagation();
            if (!isAdmin) { alert("Only administrators can change channel settings."); return; }
            openChannelSettingsModal(currentChannelCatKey, currentChannel);
        });
        if (currentUser) checkBanAndInitialize();
        switchAuthMode.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authTitle.textContent = isRegistering ? "REGISTRATION" : "AUTHORIZATION";
            authSubmitBtn.textContent = isRegistering ? "REGISTER" : "LOGIN";
            switchAuthMode.textContent = isRegistering ? "Already have an account? Login" : "Need an account? Register";
        });
        authForm.addEventListener('submit', async e => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) return;
            if (username.length < 2) { alert("Username must be at least 2 characters."); return; }
            try {
                await userIpPromise;
                if (username !== OWNER) {
                    const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                    if (await banRes.json()) {
                        alert("Your IP address has been banned.");
                        return;
                    }
                }
                const res = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
                const users = await res.json() || {};
                if (isRegistering) {
                    if (users[username]) { alert("Username already exists."); return; }
                    const isFirstUser = Object.keys(users).length === 0;
                    await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            password,
                            ip: userIp,
                            avatar: "",
                            bio: isFirstUser ? "Server Owner" : "Member",
                            role: isFirstUser || username === OWNER ? "admin" : "member",
                            joined: Date.now()
                        })
                    });
                    if (isFirstUser) {
                        await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`, {
                            method: 'PUT',
                            body: JSON.stringify({
                                admin: { name: "Admin", color: "#ff5555" },
                                member: { name: "Member", color: "#ffffff" }
                            })
                        });
                    }
                } else {
                    if (!users[username] || users[username].password !== password) {
                        alert("Invalid username or password.");
                        return;
                    }
                    await fetch(`${FIREBASE_URL}/users/${username}/ip.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify(userIp)
                    });
                }
                currentUser = username;
                localStorage.setItem('chat_user', currentUser);
                checkBanAndInitialize();
            } catch (err) {
                alert("Connection error. Please try again.");
            }
        });
        logoutBtn.addEventListener('click', e => {
            e.stopPropagation();
            localStorage.removeItem('chat_user');
            currentUser = null;
            isAdmin = false;
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
        });
        async function checkBanAndInitialize() {
            try {
                await userIpPromise;
                if (currentUser !== OWNER) {
                    const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                    if (await banRes.json()) {
                        localStorage.removeItem('chat_user');
                        alert("Access denied: IP banned.");
                        return;
                    }
                }
                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const userData = await userRes.json();
                if (!userData) {
                    localStorage.removeItem('chat_user');
                    currentUser = null;
                    return;
                }
                await fetch(`${FIREBASE_URL}/users/${currentUser}/ip.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify(userIp)
                });
                isAdmin = (userData.role === "admin" || currentUser === OWNER);
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                currentUsernameDisplay.textContent = currentUser;
                const sNameRes = await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`);
                const sName = await sNameRes.json();
                serverTitleDisplay.textContent = sName || "MAIN SERVER";
                const rootRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                if (!await rootRes.json()) {
                    await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            categories: {
                                general_cat: {
                                    name: "TEXT CHANNELS",
                                    order: 0,
                                    channels: {
                                        general: { name: "general", topic: "General chat", order: 0, permissions: {} }
                                    }
                                }
                            }
                        })
                    });
                }
                const rolesCheck = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
                if (!await rolesCheck.json()) {
                    await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            admin: { name: "Admin", color: "#ff5555" },
                            member: { name: "Member", color: "#ffffff" }
                        })
                    });
                }
                fetchUserDataAndAvatar();
                startPolling();
            } catch (err) {
                console.error(err);
                alert("Failed to initialize. Check connection.");
            }
        }
        async function fetchUserDataAndAvatar() {
            try {
                const res = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const data = await res.json();
                myAvatarDisplay.src = data?.avatar || generateDefaultAvatar(currentUser);
                currentUsernameDisplay.textContent = currentUser;
                currentUserDesc.textContent = data?.bio || "No description";
            } catch (e) {}
        }
        userProfileBar.addEventListener('click', async () => {
            try {
                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const userData = await userRes.json() || {};
                let currentAvatar = userData.avatar || "";
                let currentName = currentUser;
                let currentBio = userData.bio || "";
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-card" style="width:460px">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                            <h3>MY PROFILE</h3>
                            <button id="close-profile-modal" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px">✕</button>
                        </div>
                        <div style="display:flex;gap:20px;align-items:flex-start;margin-bottom:18px">
                            <div style="text-align:center">
                                <img id="profile-modal-avatar" src="${currentAvatar || generateDefaultAvatar(currentName)}" style="width:72px;height:72px;border:1px solid #fff;object-fit:cover;cursor:pointer">
                                <div style="font-size:10px;color:#888;margin-top:5px">Change Avatar</div>
                            </div>
                            <div style="flex-grow:1" class="input-group">
                                <label>USERNAME</label>
                                <input type="text" id="profile-modal-name" value="${escapeHtml(currentName)}" maxlength="24">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>PROFILE BIO</label>
                            <textarea id="profile-modal-bio" rows="4" maxlength="200">${escapeHtml(currentBio)}</textarea>
                        </div>
                        <div class="modal-buttons" id="profile-save-container" style="display:none">
                            <button class="admin-panel-btn" id="save-profile-btn">SAVE CHANGES</button>
                        </div>
                    </div>`;
                document.getElementById('modal-container').appendChild(modal);
                const avatarImg = modal.querySelector('#profile-modal-avatar');
                const nameInput = modal.querySelector('#profile-modal-name');
                const bioInput = modal.querySelector('#profile-modal-bio');
                const saveContainer = modal.querySelector('#profile-save-container');
                let newAvatarVal = currentAvatar;
                function checkForChanges() {
                    const hasChanged = nameInput.value.trim() !== currentName || bioInput.value !== currentBio || newAvatarVal !== currentAvatar;
                    saveContainer.style.display = hasChanged ? 'flex' : 'none';
                }
                nameInput.addEventListener('input', checkForChanges);
                bioInput.addEventListener('input', checkForChanges);
                avatarImg.onclick = () => {
                    const url = prompt("Enter new avatar URL (or leave blank to reset):", newAvatarVal);
                    if (url !== null) {
                        newAvatarVal = url.trim();

        async function checkPermission(channelKey, action) {
            if (isAdmin) return true;
            try {
                const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                const struct = await structRes.json();
                let chanObj = null;
                for (let catKey in struct.categories) {
                    if (struct.categories[catKey].channels && struct.categories[catKey].channels[channelKey]) {
                        chanObj = struct.categories[catKey].channels[channelKey];
                        break;
                    }
                }
                if (!chanObj) return true;
                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const uData = await userRes.json();
                const uRole = uData?.role || 'member';
                const perms = chanObj.permissions || {};
                if (perms.users && perms.users[currentUser] && perms.users[currentUser][action] !== undefined) {
                    return perms.users[currentUser][action];
                }
                const rolePerm = perms[uRole];
                if (rolePerm && rolePerm[action] === false) return false;
                return true;
            } catch (e) { return true; }

                    const messages = await msgRes.json() || {};
                    const msgEntries = Object.entries(messages).sort((a, b) => a[1].time - b[1].time);
                    const newHash = JSON.stringify(msgEntries.map(e => e[0] + e[1].time));
                    if (newHash !== lastMessagesHash) {

                const userRes = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);

        async function reorderCategories(draggedKey, targetKey, sortedKeys) {
            const dragIdx = sortedKeys.indexOf(draggedKey);
            const targetIdx = sortedKeys.indexOf(targetKey);
            sortedKeys.splice(dragIdx, 1);
            sortedKeys.splice(targetIdx, 0, draggedKey);
            const updates = {};
            sortedKeys.forEach((key, idx) => { updates[`${key}/order`] = idx; });
            await fetch(`${FIREBASE_URL}/structure/categories.json?auth=${FIREBASE_TOKEN}`, { method: 'PATCH', body: JSON.stringify(updates) });
            fetchData();
        }
        async function reorderChannels(draggedKey, sourceCatKey, targetKey, targetCatKey, sortedChans) {
            if (sourceCatKey !== targetCatKey) {
                const structRes = await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`);
                const chanData = await structRes.json();
                await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`, { method: 'PUT', body: JSON.stringify(chanData) });
                await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
            } else if (targetKey) {
                const dragIdx = sortedChans.indexOf(draggedKey);
                const targetIdx = sortedChans.indexOf(targetKey);
                sortedChans.splice(dragIdx, 1);
                sortedChans.splice(targetIdx, 0, draggedKey);
                const updates = {};
                sortedChans.forEach((key, idx) => { updates[`${key}/order`] = idx; });
                await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels.json?auth=${FIREBASE_TOKEN}`, { method: 'PATCH', body: JSON.stringify(updates) });
            }
            fetchData();
        }

                                </div>
                            </div>
                            <div id="tab-permissions" class="tab-pane hidden">
                                <div style="display:flex;gap:14px;height:100%">
                                    <div style="width:180px;border-right:1px solid #333;padding-right:10px;overflow-y:auto">
                                        <div style="font-size:11px;margin-bottom:8px;color:#888">ROLES</div>
                                        <div id="settings-roles-list"></div>
                                    </div>
                                    <div style="flex-grow:1;padding-left:4px" id="settings-role-perms-panel">
                                        <div style="color:#555;font-size:12px;text-align:center;margin-top:60px">Select a role to configure permissions</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="save-all-settings" style="display:none">SAVE CHANGES</button>
                    </div>
                </div>`;
            document.getElementById('modal-container').appendChild(modal);
            const nameInput = modal.querySelector('#setting-chan-name');
            const topicInput = modal.querySelector('#setting-chan-topic');
            const saveBtn = modal.querySelector('#save-all-settings');
            let initialName = chanData.name || chKey;
            let initialTopic = chanData.topic || '';
            let currentPermsJSON = JSON.stringify(perms);
            let editingPerms = JSON.parse(currentPermsJSON);
            function checkSettingsChanged() {
                const changed = nameInput.value.trim() !== initialName || topicInput.value !== initialTopic || JSON.stringify(editingPerms) !== currentPermsJSON;
                saveBtn.style.display = changed ? 'block' : 'none';
            }
            nameInput.addEventListener('input', checkSettingsChanged);
            topicInput.addEventListener('input', checkSettingsChanged);
            const rolesListContainer = modal.querySelector('#settings-roles-list');
            const rolePermsPanel = modal.querySelector('#settings-role-perms-panel');
            let selectedRoleKey = Object.keys(roles)[0] || 'member';
            function renderRolesList() {
                let html = '';
                Object.keys(roles).forEach(rKey => {
                    const r = roles[rKey];
                    const isSelected = rKey === selectedRoleKey;
                    html += `<div class="role-select-item" data-rkey="${rKey}" style="padding:7px 8px;font-size:12px;cursor:pointer;margin-bottom:3px;background:${isSelected ? '#fff' : 'transparent'};color:${isSelected ? '#000' : (r.color || '#fff')};border:1px solid ${isSelected ? '#fff' : '#333'}">${escapeHtml(r.name)}</div>`;
                });
                rolesListContainer.innerHTML = html;
                rolesListContainer.querySelectorAll('.role-select-item').forEach(item => {
                    item.onclick = () => {
                        selectedRoleKey = item.dataset.rkey;
                        renderRolesList();
                        renderRolePermsForm();
                    };
                });
            }
            function renderRolePermsForm() {
                const r = roles[selectedRoleKey];
                if (!r) return;
                if (!editingPerms[selectedRoleKey]) editingPerms[selectedRoleKey] = { read: true, send: true };
                const rPerm = editingPerms[selectedRoleKey];
                const canRead = rPerm.read !== false;
                const canSend = rPerm.send !== false;
                rolePermsPanel.innerHTML = `
                    <div style="font-size:13px;font-weight:bold;color:${r.color || '#fff'};margin-bottom:14px">Permissions for: ${escapeHtml(r.name)}</div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="chk-perm-read" ${canRead ? 'checked' : ''}>
                        <label for="chk-perm-read">View Channel</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="chk-perm-send" ${canSend ? 'checked' : ''}>
                        <label for="chk-perm-send">Send Messages</label>
                    </div>`;
                const chkRead = rolePermsPanel.querySelector('#chk-perm-read');
                const chkSend = rolePermsPanel.querySelector('#chk-perm-send');
                chkRead.onchange = () => {
                    if (!editingPerms[selectedRoleKey]) editingPerms[selectedRoleKey] = {};
                    editingPerms[selectedRoleKey].read = chkRead.checked;
                    checkSettingsChanged();
                };
                chkSend.onchange = () => {
                    if (!editingPerms[selectedRoleKey]) editingPerms[selectedRoleKey] = {};
                    editingPerms[selectedRoleKey].send = chkSend.checked;
                    checkSettingsChanged();
                };
            }
            renderRolesList();
            renderRolePermsForm();
            modal.querySelectorAll('.settings-tab-btn').forEach(btn => {
                btn.onclick = () => {
                    modal.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active'));
                    modal.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
                    btn.classList.add('active');
                    modal.querySelector(`#${btn.dataset.tab}`).classList.remove('hidden');
                };
            });
            modal.querySelector('#close-settings-modal').onclick = () => modal.remove();
            saveBtn.onclick = async () => {
                const finalName = nameInput.value.trim();
                const finalTopic = topicInput.value;
                if (!finalName) { alert("Channel name cannot be empty."); return; }
                try {
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/name.json?auth=${FIREBASE_TOKEN}`, { method: 'PUT', body: JSON.stringify(finalName) });
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/topic.json?auth=${FIREBASE_TOKEN}`, { method: 'PUT', body: JSON.stringify(finalTopic) });
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/permissions.json?auth=${FIREBASE_TOKEN}`, { method: 'PUT', body: JSON.stringify(editingPerms) });
                    modal.remove();
                    fetchData();
                } catch (err) { alert("Error saving settings."); }
            };
        }
        async function handlePermissionsTarget() {
            if (!isAdmin || contextTarget.type !== 'channel') return;
            openChannelSettingsModal(contextTarget.catId, contextTarget.id);
        }
        async function openRolesModal() {
            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || { member: { name: "Member", color: "#ffffff" } };
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="width:780px;height:480px;display:flex;flex-direction:column">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
                        <h3>EDIT ROLES</h3>
                        <button id="close-roles-modal" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px">✕</button>
                    </div>
                    <div style="display:flex;flex-grow:1;gap:14px;overflow:hidden">
                        <div id="roles-sidebar-col" style="width:200px;border-right:1px solid #333;padding-right:10px;overflow-y:auto">
                            <div style="font-size:11px;color:#888;margin-bottom:8px">ROLES (RIGHT CLICK TO CREATE)</div>
                            <div id="roles-list-items"></div>
                        </div>
                        <div style="flex-grow:1;overflow-y:auto;padding-left:4px" id="role-details-panel">
                            <div style="color:#555;font-size:12px;text-align:center;margin-top:100px">Select a role on the left</div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('modal-container').appendChild(modal);
            const rolesListItems = modal.querySelector('#roles-list-items');
            const roleDetailsPanel = modal.querySelector('#role-details-panel');
            let selectedRoleKey = Object.keys(roles)[0] || 'member';
            function renderRolesListUI() {
                let html = '';
                Object.keys(roles).forEach(rKey => {
                    const r = roles[rKey];
                    const isSelected = rKey === selectedRoleKey;
                    html += `<div class="role-item-row" data-rkey="${rKey}" style="padding:7px 8px;font-size:13px;cursor:pointer;margin-bottom:3px;background:${isSelected ? '#fff' : 'transparent'};color:${isSelected ? '#000' : (r.color || '#fff')};border:1px solid ${isSelected ? '#fff' : '#333'}">${escapeHtml(r.name)}</div>`;
                });
                rolesListItems.innerHTML = html;
                rolesListItems.querySelectorAll('.role-item-row').forEach(item => {
                    item.onclick = () => {
                        selectedRoleKey = item.dataset.rkey;
                        renderRolesListUI();
                        renderRoleDetailsForm();
                    };
                });
            }
            function renderRoleDetailsForm() {
                const r = roles[selectedRoleKey];
                if (!r) return;
                roleDetailsPanel.innerHTML = `
                    <div style="border:1px solid #fff;padding:14px;margin-bottom:16px;background:#0a0a0a">
                        <div style="display:flex;gap:14px;align-items:flex-end">
                            <div style="flex-grow:1" class="input-group">
                                <label>ROLE NAME</label>
                                <input type="text" id="edit-role-name-input" value="${escapeHtml(r.name)}">
                            </div>
                            <div style="width:130px" class="input-group">
                                <label>ROLE COLOR</label>
                                <input type="text" id="edit-role-color-input" value="${escapeHtml(r.color || '#ffffff')}" placeholder="#ffffff">
                            </div>
                        </div>
                        <button class="admin-panel-btn" id="save-role-info-btn" style="margin-top:12px">UPDATE ROLE</button>
                        ${selectedRoleKey !== 'admin' && selectedRoleKey !== 'member' ? `<button class="admin-panel-btn danger" id="delete-role-btn" style="margin-top:8px">DELETE ROLE</button>` : ''}
                    </div>
                    <div style="font-size:12px;color:#888">
                        Role colors appear next to member names in the members list.<br>
                        Channel-specific permissions are configured in Channel Settings → Permissions.
                    </div>`;
                modal.querySelector('#save-role-info-btn').onclick = async () => {
                    const newName = modal.querySelector('#edit-role-name-input').value.trim();
                    const newColor = modal.querySelector('#edit-role-color-input').value.trim() || '#ffffff';
                    if (!newName) return;
                    roles[selectedRoleKey].name = newName;
                    roles[selectedRoleKey].color = newColor;
                    await fetch(`${FIREBASE_URL}/roles/${selectedRoleKey}.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({ name: newName, color: newColor })
                    });
                    renderRolesListUI();
                    renderRoleDetailsForm();
                    fetchData();
                };
                const delBtn = modal.querySelector('#delete-role-btn');
                if (delBtn) {
                    delBtn.onclick = async () => {
                        if (!confirm(`Delete role "${r.name}"? Users with this role will become Members.`)) return;
                        await fetch(`${FIREBASE_URL}/roles/${selectedRoleKey}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
                        modal.remove();
                        openRolesModal();
                        fetchData();
                    };
                }
            }
            renderRolesListUI();
            renderRoleDetailsForm();
            modal.querySelector('#roles-sidebar-col').oncontextmenu = async e => {
                e.preventDefault();
                e.stopPropagation();
                const rName = prompt("New Role Name:");
                if (!rName || !rName.trim()) return;
                const rColor = prompt("Role Color (hex, e.g. #55ff55):", "#ffffff") || "#ffffff";
                const rKey = rName.toLowerCase().replace(/[^a-z0-9]/g, "") || ("role_" + Date.now());
                await fetch(`${FIREBASE_URL}/roles/${rKey}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name: rName.trim(), color: rColor })
                });
                modal.remove();
                openRolesModal();
                fetchData();
            };
            modal.querySelector('#close-roles-modal').onclick = () => modal.remove();
        }
        function generateDefaultAvatar(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 40;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 40, 40);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(0.5, 0.5, 39, 39);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText((name || 'U').charAt(0).toUpperCase(), 20, 21);
            return canvas.toDataURL();
        }
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        window.openChannelSettingsModal = openChannelSettingsModal;
    </script>
</body>
</html>
