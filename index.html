<style>

.sidebar-channels{width:260px;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;background:#050505;flex-shrink:0}
.server-header{padding:16px 18px;border-bottom:1px solid #1a1a1a;font-weight:700;letter-spacing:3px;display:flex;justify-content:space-between;align-items:center;cursor:default;font-size:14px;color:#fff}

.user-avatar-sm{width:34px;height:34px;border-radius:0;border:1px solid #333;object-fit:cover;background:#111;flex-shrink:0}
.user-info-text{flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.user-info-text .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.user-info-text .status{font-size:10px;color:#555;letter-spacing:1px}
.logout-btn{background:none;border:1px solid #333;color:#666;padding:5px 9px;font-size:10px;cursor:pointer;border-radius:0;letter-spacing:1px}
.logout-btn:hover{border-color:#888;color:#ccc}
.chat-area{flex-grow:1;display:flex;flex-direction:column;background:#000;min-width:0}
.chat-header{padding:14px 22px;border-bottom:1px solid #1a1a1a;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:52px;letter-spacing:1px}

.chat-messages{flex-grow:1;padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}

.message:hover{background:#080808}
.msg-avatar{width:40px;height:40px;border-radius:0;border:1px solid #2a2a2a;object-fit:cover;background:#111;flex-shrink:0;cursor:pointer}
.msg-content{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.msg-header-row{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.message .msg-user{font-weight:700;font-size:13px;cursor:pointer;color:#eee}
.message .msg-user:hover{text-decoration:underline}
.message .msg-time{font-size:10px;color:#444;letter-spacing:1px}
.message .msg-text{word-break:break-word;white-space:pre-wrap;color:#bbb}
.message img,.message video{max-width:340px;max-height:260px;border:1px solid #2a2a2a;margin-top:8px;display:block;object-fit:contain;border-radius:0}
.msg-actions{display:none;position:absolute;right:12px;top:6px;gap:2px;background:#0a0a0a;border:1px solid #222;padding:2px}
.message:hover .msg-actions{display:flex}
.msg-action-btn{background:none;border:none;color:#555;font-size:12px;padding:4px 7px;cursor:pointer}
.msg-action-btn:hover{background:#1a1a1a;color:#ccc}
.chat-input-area{padding:14px 22px 20px;border-top:1px solid #111}
.chat-input-form{display:flex;border:1px solid #222;align-items:stretch;background:#080808;overflow:hidden}
.file-upload-label{padding:0 16px;cursor:pointer;border-right:1px solid #222;font-size:18px;display:flex;align-items:center;color:#555;background:transparent}
.file-upload-label:hover{color:#aaa;background:#0f0f0f}
.chat-input-form input[type=text]{flex-grow:1;background:transparent;border:none;color:#ddd;padding:14px 16px;font-size:14px;outline:none;font-family:'Courier New',Courier,monospace}
.chat-input-form button[type=submit]{background:transparent;border-left:1px solid #222;color:#666;padding:0 22px;cursor:pointer;font-size:12px;letter-spacing:2px;font-weight:700;transition:all .12s}
.chat-input-form button[type=submit]:hover{background:#fff;color:#000}
.sidebar-members{width:240px;border-left:1px solid #1a1a1a;padding:16px 12px;background:#050505;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex-shrink:0}
.members-section h3{font-size:10px;letter-spacing:2px;margin-bottom:8px;color:#444;text-transform:uppercase;font-weight:700}
.member-item{font-size:13px;margin-bottom:3px;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 8px;border-radius:0;transition:background .12s;border:1px solid transparent}
.member-item:hover{background:#0c0c0c;border-color:#1a1a1a}
.member-avatar-sm{width:28px;height:28px;border-radius:0;border:1px solid #2a2a2a;object-fit:cover;background:#111}
.status-dot{width:9px;height:9px;border-radius:0;border:1px solid #000;position:absolute;bottom:-1px;right:-1px}
.status-online{background:#fff}
.status-idle{background:#888}
.status-dnd{background:#555}
.status-offline{background:#222}
#context-menu{position:fixed;background:#0a0a0a;border:1px solid #333;padding:4px 0;z-index:5000;min-width:200px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.8)}
.context-menu-item{padding:9px 16px;font-size:12px;cursor:pointer;letter-spacing:1px;color:#aaa}
.context-menu-item:hover{background:#fff;color:#000}
.context-menu-item.danger{color:#c44}
.context-menu-item.danger:hover{background:#c44;color:#000}
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.92);display:flex;justify-content:center;align-items:center;z-index:4000}
.modal-card{background:#080808;border:1px solid #333;padding:28px;width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 0 80px rgba(0,0,0,.9)}
.modal-card h3{margin-bottom:20px;font-size:15px;letter-spacing:3px;font-weight:700;color:#fff;text-transform:uppercase}
.modal-buttons{display:flex;gap:10px;margin-top:24px}
.admin-panel-btn{background:#000;border:1px solid #333;color:#aaa;padding:11px 16px;font-size:12px;cursor:pointer;letter-spacing:2px;flex-grow:1;text-align:center;border-radius:0;font-weight:700;transition:all .12s}
.admin-panel-btn:hover{background:#fff;color:#000;border-color:#fff}
.admin-panel-btn.danger{border-color:#622;color:#c44}
.admin-panel-btn.danger:hover{background:#c44;color:#000}
.empty-state{padding:60px 20px;text-align:center;color:#333;font-size:13px;letter-spacing:2px}
.access-denied{padding:50px 20px;text-align:center;color:#c44;font-size:14px;letter-spacing:3px;text-transform:uppercase}
.forum-container{flex-grow:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.forum-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid #222;background:#080808;margin-bottom:8px}
.forum-post-card{border:1px solid #222;padding:16px;background:#080808;cursor:pointer;transition:all .12s}
.forum-post-card:hover{background:#0c0c0c;border-color:#444}
.forum-post-title{font-size:15px;font-weight:700;margin-bottom:6px;color:#ddd}
.forum-post-snippet{font-size:12px;color:#666;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.forum-post-footer{font-size:10px;color:#444;display:flex;gap:16px;letter-spacing:1px}
.reaction-bar{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.reaction{background:#0c0c0c;border:1px solid #222;padding:2px 8px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.reaction:hover{border-color:#555}
.reaction.active{background:#151515;border-color:#666}
.typing-indicator{font-size:11px;color:#333;padding:4px 22px;height:18px;letter-spacing:1px}
.mention{background:#1a1a1a;padding:1px 5px;font-weight:700;color:#fff}
.markdown-code{background:#111;padding:1px 6px;font-family:monospace;font-size:12px;border:1px solid #222}
.markdown-bold{font-weight:700;color:#eee}
.markdown-italic{font-style:italic}
.markdown-spoiler{background:#222;color:#222;padding:0 4px;cursor:pointer}
.markdown-spoiler:hover{color:#ccc}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#222}
::-webkit-scrollbar-thumb:hover{background:#333}
.role-badge{display:inline-block;padding:1px 6px;font-size:9px;margin-left:6px;font-weight:700;letter-spacing:1px;border:1px solid #333}
</style>
</head>
<body>
<div id="context-menu"></div>
<div id="auth-screen">
<div class="auth-card">
<h1>F.R.I.E.N.D.S</h1>
<div class="subtitle">// single node terminal</div>
<h2 id="auth-title">AUTHORIZATION</h2>
<form id="auth-form">
<div class="input-group"><label>USERNAME</label><input type="text" id="username-input" required autocomplete="off" maxlength="24"></div>
<div class="input-group"><label>PASSWORD</label><input type="password" id="password-input" required maxlength="64"></div>
<button type="submit" class="auth-btn" id="auth-submit-btn">LOGIN</button>
</form>
<div class="switch-auth" id="switch-auth-mode">Need an account? Register</div>
</div>
</div>
<div id="app-screen" class="hidden">
<div class="sidebar-channels" id="sidebar-channels-panel">
<div class="server-header" id="server-header-main">
<span id="server-title-display">F.R.I.E.N.D.S</span>
<span style="font-size:14px;cursor:pointer;color:#444" id="server-gear-btn" title="Server Settings">⚙</span>
</div>
<div class="channels-list" id="channels-container"></div>
<div class="user-profile" id="user-profile-bar">
<div style="position:relative">
<img id="my-avatar-display" class="user-avatar-sm" src="" alt="">
<div class="status-dot status-online" id="my-status-dot"></div>
</div>
<div class="user-info-text">
<div class="name" id="current-username-display">User</div>
<div class="status" id="current-user-desc">ONLINE</div>
</div>
<button class="logout-btn" id="logout-btn">LOGOUT</button>
</div>
</div>
<div class="chat-area" id="main-display-area">
<div class="chat-header">
<div style="display:flex;align-items:center">
<span id="active-channel-title"># general</span>
<span class="topic" id="channel-topic"></span>
</div>
<button class="channel-settings-gear" id="channel-gear-btn" title="Channel Settings">⚙</button>
</div>
<div class="chat-messages" id="chat-messages"></div>
<div class="typing-indicator" id="typing-indicator"></div>
<div class="chat-input-area" id="chat-input-container">
<form class="chat-input-form" id="chat-form">
<label class="file-upload-label" title="Upload image or video">+</label>
<input type="file" id="media-file-input" accept="image/*,video/*" style="display:none">
<input type="text" id="message-input" placeholder="Message #general" autocomplete="off" maxlength="2000">
<button type="submit">SEND</button>
</form>
</div>
</div>
<div class="sidebar-members" id="sidebar-members-container"></div>
</div>
<div id="modal-container"></div>
<script>
const FIREBASE_URL="https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
const FIREBASE_TOKEN="87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";
const OWNER="SStwendRT";
let isRegistering=false,currentUser=localStorage.getItem('chat_user')||null,userIp="unknown",currentChannel="general",currentChannelCatKey="general_cat",currentChannelType="text",isAdmin=false,contextTarget=null,lastMessagesHash="",isPolling=false;
let cachedAvatar="",cachedBio="",lastMessageTime=0,activeForumPostId=null,userStatus="online",replyToMsg=null,editingMsgId=null;
const userIpPromise=fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{userIp=d.ip||"unknown";return userIp}).catch(()=>{userIp="unknown";return"unknown"});
const authScreen=document.getElementById('auth-screen'),appScreen=document.getElementById('app-screen'),authTitle=document.getElementById('auth-title'),authSubmitBtn=document.getElementById('auth-submit-btn'),switchAuthMode=document.getElementById('switch-auth-mode'),authForm=document.getElementById('auth-form'),usernameInput=document.getElementById('username-input'),passwordInput=document.getElementById('password-input'),currentUsernameDisplay=document.getElementById('current-username-display'),currentUserDesc=document.getElementById('current-user-desc'),myAvatarDisplay=document.getElementById('my-avatar-display'),userProfileBar=document.getElementById('user-profile-bar'),logoutBtn=document.getElementById('logout-btn'),serverGearBtn=document.getElementById('server-gear-btn'),channelGearBtn=document.getElementById('channel-gear-btn'),serverTitleDisplay=document.getElementById('server-title-display'),chatForm=document.getElementById('chat-form'),messageInput=document.getElementById('message-input'),chatMessages=document.getElementById('chat-messages'),channelsContainer=document.getElementById('channels-container'),sidebarChannelsPanel=document.getElementById('sidebar-channels-panel'),sidebarMembersContainer=document.getElementById('sidebar-members-container'),activeChannelTitle=document.getElementById('active-channel-title'),mediaFileInput=document.getElementById('media-file-input'),fileUploadLabel=document.querySelector('.file-upload-label'),contextMenu=document.getElementById('context-menu'),chatInputContainer=document.getElementById('chat-input-container'),mainDisplayArea=document.getElementById('main-display-area'),channelTopic=document.getElementById('channel-topic');

fileUploadLabel.addEventListener('click',()=>mediaFileInput.click());
document.addEventListener('click',()=>{contextMenu.style.display='none'});
sidebarChannelsPanel.addEventListener('contextmenu',e=>{
e.preventDefault();e.stopPropagation();
if(!isAdmin)return;
contextTarget={type:'sidebar'};
showContextMenu(e.clientX,e.clientY,['create-channel','create-forum','create-category','edit-roles']);
});
serverGearBtn.addEventListener('click',e=>{
e.stopPropagation();
if(!isAdmin){alert("ACCESS DENIED // ADMIN ONLY");return}
openServerSettingsModal();
});
channelGearBtn.addEventListener('click',e=>{
e.stopPropagation();
if(!isAdmin){alert("ACCESS DENIED // ADMIN ONLY");return}
openChannelSettingsModal(currentChannelCatKey,currentChannel);
});
if(currentUser)checkBanAndInitialize();

switchAuthMode.addEventListener('click',()=>{
isRegistering=!isRegistering;
authTitle.textContent=isRegistering?"REGISTRATION":"AUTHORIZATION";
authSubmitBtn.textContent=isRegistering?"REGISTER":"LOGIN";
switchAuthMode.textContent=isRegistering?"Already have an account? Login":"Need an account? Register";
});

authForm.addEventListener('submit',async e=>{
e.preventDefault();
const username=usernameInput.value.trim(),password=passwordInput.value.trim();
if(!username||!password)return false;
if(username.length<2){alert("Username must be at least 2 characters.");return false;}
try{
await userIpPromise;
if(isRegistering&&userIp&&userIp!=="unknown"){
try{
const banRes=await fetch(`${FIREBASE_URL}/bans/${userIp.replace(/[.#$\/\[\]]/g,'_')}.json?auth=${FIREBASE_TOKEN}`);
const banData=await banRes.json();
if(banData===true||(banData&&banData.banned)){alert("ACCESS DENIED // IP BANNED");return false;}
}catch(err){}
}
const res=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await res.json()||{};
if(isRegistering){
if(users[username]){alert("Username already exists.");return false;}
const isFirstUser=Object.keys(users).length===0;
const role=isFirstUser||username===OWNER?"admin":"member";
await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({password,ip:userIp,avatar:"",bio:isFirstUser?"Server Owner":"Member",role,joined:Date.now(),status:"online"})});
if(isFirstUser){
await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({admin:{name:"Admin",color:"#fff",permissions:["ADMINISTRATOR"]},member:{name:"Member",color:"#888",permissions:[]}})});
await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("F.R.I.E.N.D.S")});
}
}else{
if(!users[username]||users[username].password!==password){alert("Invalid username or password.");return false;}
await fetch(`${FIREBASE_URL}/users/${username}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
await fetch(`${FIREBASE_URL}/users/${username}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("online")});
}
currentUser=username;localStorage.setItem('chat_user',currentUser);checkBanAndInitialize();
}catch(err){alert("Connection error. Please try again.");console.error(err);}
return false;
});

logoutBtn.addEventListener('click',async e=>{
e.stopPropagation();
try{await fetch(`${FIREBASE_URL}/users/${currentUser}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("offline")});}catch(e){}
localStorage.removeItem('chat_user');currentUser=null;isAdmin=false;appScreen.classList.add('hidden');authScreen.classList.remove('hidden');usernameInput.value='';passwordInput.value='';
});

async function checkBanAndInitialize(){
try{
await userIpPromise;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const userData=await userRes.json();
if(!userData){localStorage.removeItem('chat_user');currentUser=null;return}
await fetch(`${FIREBASE_URL}/users/${currentUser}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
await fetch(`${FIREBASE_URL}/users/${currentUser}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("online")});
isAdmin=(userData.role==="admin"||currentUser===OWNER);
authScreen.classList.add('hidden');appScreen.classList.remove('hidden');currentUsernameDisplay.textContent=currentUser;
const sNameRes=await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`);
serverTitleDisplay.textContent=(await sNameRes.json())||"F.R.I.E.N.D.S";
const rootRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
if(!await rootRes.json()){
await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({categories:{general_cat:{name:"TEXT CHANNELS",order:0,channels:{general:{name:"general",topic:"Welcome to F.R.I.E.N.D.S terminal",type:"text",order:0,permissions:{}},announcements:{name:"announcements",topic:"Official announcements",type:"text",order:1,permissions:{}}}}}})});
}
const rolesCheck=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
if(!await rolesCheck.json()){
await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({admin:{name:"Admin",color:"#fff",permissions:["ADMINISTRATOR"]},member:{name:"Member",color:"#888",permissions:[]}})});
}
fetchUserDataAndAvatar();startPolling();
}catch(err){console.error(err);alert("Failed to initialize. Check connection.")}
}

async function fetchUserDataAndAvatar(){
try{
const res=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const data=await res.json();
cachedAvatar=data?.avatar||"";
cachedBio=data?.bio||"No description";
userStatus=data?.status||"online";
myAvatarDisplay.src=cachedAvatar||generateDefaultAvatar(currentUser);
currentUsernameDisplay.textContent=currentUser;
currentUserDesc.textContent=(cachedBio||userStatus).toUpperCase();
document.getElementById('my-status-dot').className=`status-dot status-${userStatus}`;
}catch(e){}
}

userProfileBar.addEventListener('click',async()=>{
try{
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const userData=await userRes.json()||{};
let currentAvatar=userData.avatar||"",currentName=currentUser,currentBio=userData.bio||"",currentStatus=userData.status||"online";
const modal=document.createElement('div');modal.className='modal-overlay';

function executeOptimisticSend(text,mediaUrl){

const tempId='temp_'+time+'_'+Math.random().toString(36).substring(2,7);
const date=new Date(time);
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div=document.createElement('div');div.className='message';div.dataset.msgid=tempId;
let mediaHtml='';
if(mediaUrl)mediaHtml=(mediaUrl.startsWith('data:video')||mediaUrl.includes('video'))?`<video src="${mediaUrl}" controls></video>`:`<img src="${mediaUrl}" alt="media">`;
let replyHtml='';
if(replyToMsg)replyHtml=`<div style="font-size:11px;color:#444;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">REPLY TO ${escapeHtml(replyToMsg.user)}: ${escapeHtml((replyToMsg.text||'').substring(0,50))}</div>`;

const emptyState=chatMessages.querySelector('.empty-state');if(emptyState)emptyState.remove();
chatMessages.appendChild(div);chatMessages.scrollTop=chatMessages.scrollHeight;
lastMessageTime=time;
const payload={user:currentUser,avatar,text,media:mediaUrl,time,reactions:{}};
if(replyToMsg){payload.replyTo={id:replyToMsg.id,user:replyToMsg.user,text:replyToMsg.text};replyToMsg=null;}
fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify(payload)}).then(()=>{lastMessagesHash="";}).catch(err=>console.error("Send failed:",err));
}

async function checkPermission(channelKey,action){
if(isAdmin)return true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const struct=await structRes.json();
let chanObj=null;
for(let catKey in struct.categories){if(struct.categories[catKey].channels&&struct.categories[catKey].channels[channelKey]){chanObj=struct.categories[catKey].channels[channelKey];break}}
if(!chanObj)return true;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const uData=await userRes.json();
const uRole=uData?.role||'member';
const perms=chanObj.permissions||{};
if(perms.users&&perms.users[currentUser]&&perms.users[currentUser][action]!==undefined)return perms.users[currentUser][action];
const rolePerm=perms[uRole];
if(rolePerm&&rolePerm[action]===false)return false;
return true;
}catch(e){return true}
}

function showContextMenu(x,y,options){

options.forEach(opt=>{
const div=document.createElement('div');div.className='context-menu-item';
if(opt==='delete'){div.classList.add('danger');div.textContent='DELETE';div.onclick=()=>handleDeleteTarget()}
else if(opt==='edit'){div.textContent='EDIT SETTINGS';div.onclick=()=>handleEditTarget()}
else if(opt==='permissions'){div.textContent='PERMISSIONS';div.onclick=()=>handlePermissionsTarget()}
else if(opt==='create-channel'){div.textContent='CREATE TEXT CHANNEL';div.onclick=()=>handleCreateChannelPrompt(contextTarget&&contextTarget.type==='category'?contextTarget.id:null)}
else if(opt==='create-forum'){div.textContent='CREATE FORUM CHANNEL';div.onclick=()=>handleCreateForumPrompt(contextTarget&&contextTarget.type==='category'?contextTarget.id:null)}
else if(opt==='create-category'){div.textContent='CREATE CATEGORY';div.onclick=()=>handleCreateCategoryPrompt()}
else if(opt==='edit-roles'){div.textContent='EDIT ROLES';div.onclick=()=>openRolesModal()}
else if(opt==='reply'){div.textContent='REPLY';div.onclick=()=>{if(contextTarget&&contextTarget.msg){replyToMsg=contextTarget.msg;messageInput.placeholder=`Replying to ${contextTarget.msg.user}...`;messageInput.focus();}}}
else if(opt==='edit-msg'){div.textContent='EDIT MESSAGE';div.onclick=()=>{if(contextTarget&&contextTarget.msg){editingMsgId=contextTarget.msg.id;messageInput.value=contextTarget.msg.text||'';messageInput.placeholder='Editing message...';messageInput.focus();}}}
else if(opt==='react'){div.textContent='ADD REACTION';div.onclick=()=>{const emoji=prompt("Enter emoji:");if(emoji&&contextTarget&&contextTarget.msg)addReaction(contextTarget.msg.id,emoji.trim());}}
contextMenu.appendChild(div);
});
contextMenu.style.left=`${Math.min(x,window.innerWidth-220)}px`;contextMenu.style.top=`${Math.min(y,window.innerHeight-200)}px`;contextMenu.style.display='block';
}

async function addReaction(msgId,emoji){

const res=await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}/reactions.json?auth=${FIREBASE_TOKEN}`);
const reactions=await res.json()||{};
if(!reactions[emoji])reactions[emoji]=[];
if(!reactions[emoji].includes(currentUser))reactions[emoji].push(currentUser);
else reactions[emoji]=reactions[emoji].filter(u=>u!==currentUser);
if(reactions[emoji].length===0)delete reactions[emoji];
await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}/reactions.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(reactions)});
lastMessagesHash="";fetchData();
}catch(e){}
}

function handleDeleteTarget(){
if(!isAdmin||!contextTarget)return;
if(contextTarget.type==='channel'){
if(!confirm(`DELETE CHANNEL #${contextTarget.name}?`))return;
fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.catId}/channels/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'}).then(()=>fetchData());
}else if(contextTarget.type==='category'){
if(!confirm(`DELETE CATEGORY ${contextTarget.name}?`))return;
fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'}).then(()=>fetchData());
}
}

function handleEditTarget(){
if(!isAdmin)return;
if(contextTarget&&contextTarget.type==='channel')openChannelSettingsModal(contextTarget.catId,contextTarget.id);
}

function handlePermissionsTarget(){
if(!isAdmin)return;
if(contextTarget&&contextTarget.type==='channel')openChannelSettingsModal(contextTarget.catId,contextTarget.id);
}

function startPolling(){fetchData();setInterval(fetchData,2500)}

async function fetchData(){
if(isPolling)return;isPolling=true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
channelsContainer.innerHTML='';
let channelExists=false;
const sortedCategories=Object.keys(structure.categories||{}).sort((a,b)=>(structure.categories[a].order||0)-(structure.categories[b].order||0));
sortedCategories.forEach(catKey=>{
const cat=structure.categories[catKey];
const catDiv=document.createElement('div');catDiv.className='category-group';
const catHeader=document.createElement('div');catHeader.className='category-header';
catHeader.innerHTML=`<span>▼ ${escapeHtml(cat.name)}</span>`;
if(isAdmin){
catHeader.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'category',id:catKey,name:cat.name};showContextMenu(e.clientX,e.clientY,['create-channel','create-forum','edit','delete']);};
}
catDiv.appendChild(catHeader);
const chansContainer=document.createElement('div');chansContainer.className='category-channels';
if(cat.channels){
const sortedChans=Object.keys(cat.channels).sort((a,b)=>(cat.channels[a].order||0)-(cat.channels[b].order||0));
sortedChans.forEach(chKey=>{
const ch=cat.channels[chKey];
if(chKey===currentChannel){channelExists=true;currentChannelCatKey=catKey;currentChannelType=ch.type||'text'}
const symbol=ch.type==='forum'?'💬':'#';
const chDiv=document.createElement('div');chDiv.className=`channel-item ${currentChannel===chKey?'active':''}`;
chDiv.innerHTML=`<span><span class="symbol">${symbol}</span>${escapeHtml(ch.name)}</span>${isAdmin?`<button style="background:none;border:none;color:#444;cursor:pointer;font-size:11px" title="Settings" onclick="event.stopPropagation();openChannelSettingsModal('${catKey}','${chKey}')">⚙</button>`:''}`;
chDiv.onclick=async()=>{
const canRead=await checkPermission(chKey,'read');
if(!canRead){alert("ACCESS DENIED // NO READ PERMISSION");return}
currentChannel=chKey;currentChannelCatKey=catKey;currentChannelType=ch.type||'text';
activeForumPostId=null;replyToMsg=null;editingMsgId=null;
activeChannelTitle.textContent=`${symbol} ${ch.name}`;
channelTopic.textContent=ch.topic||'';
messageInput.placeholder=`Message ${symbol}${ch.name}`;
lastMessagesHash="";fetchData();
};
if(isAdmin){
chDiv.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'channel',id:chKey,catId:catKey,name:ch.name};showContextMenu(e.clientX,e.clientY,['edit','permissions','delete']);};
}
chansContainer.appendChild(chDiv);
});
}
catDiv.appendChild(chansContainer);channelsContainer.appendChild(catDiv);
});
if(!channelExists&&sortedCategories.length>0)currentChannel="general";
const canReadActive=await checkPermission(currentChannel,'read');
if(!canReadActive){
mainDisplayArea.innerHTML=`<div class="chat-header"><span># restricted</span></div><div class="chat-messages"><div class="access-denied">ACCESS DENIED<br>NO READ PERMISSION</div></div>`;
}else{
if(currentChannelType==='forum')renderForumView();
else renderTextView();
}
const userRes=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await userRes.json()||{};
const rolesRes=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles=await rolesRes.json()||{member:{name:"Member",color:"#888"}};
sidebarMembersContainer.innerHTML='';
const grouped={};Object.keys(roles).forEach(rKey=>grouped[rKey]=[]);if(!grouped.member)grouped.member=[];
Object.keys(users).forEach(uname=>{const uData=users[uname];const uRole=uData.role&&roles[uData.role]?uData.role:'member';if(!grouped[uRole])grouped[uRole]=[];grouped[uRole].push({name:uname,...uData})});
Object.keys(roles).forEach(rKey=>{
const rList=grouped[rKey]||[];if(rList.length===0)return;
const sec=document.createElement('div');sec.className='members-section';
const rColor=roles[rKey].color||'#888';
sec.innerHTML=`<h3 style="color:${rColor}">${roles[rKey].name.toUpperCase()} — ${rList.length}</h3>`;
rList.forEach(user=>{
const status=user.status||'offline';
const mDiv=document.createElement('div');mDiv.className='member-item';
mDiv.innerHTML=`<div style="position:relative"><img class="member-avatar-sm" src="${user.avatar||generateDefaultAvatar(user.name)}" alt=""><div class="status-dot status-${status}"></div></div><span style="color:${rColor}">${escapeHtml(user.name)}</span>`;
mDiv.onclick=()=>openMemberProfileModal(user.name,user);sec.appendChild(mDiv);
});
sidebarMembersContainer.appendChild(sec);
});
}catch(err){console.error(err)}finally{isPolling=false}
}

async function renderTextView(){
if(!document.getElementById('chat-messages')){
mainDisplayArea.innerHTML=`<div class="chat-header"><div style="display:flex;align-items:center"><span id="active-channel-title"># general</span><span class="topic" id="channel-topic"></span></div><button class="channel-settings-gear" id="channel-gear-btn" title="Channel Settings">⚙</button></div><div class="chat-messages" id="chat-messages"></div><div class="typing-indicator" id="typing-indicator"></div><div class="chat-input-area" id="chat-input-container"><form class="chat-input-form" id="chat-form"><label class="file-upload-label" title="Upload">+</label><input type="file" id="media-file-input" accept="image/*,video/*" style="display:none"><input type="text" id="message-input" placeholder="Message channel..." autocomplete="off" maxlength="2000"><button type="submit">SEND</button></form></div>`;
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED // ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
document.getElementById('chat-form').onsubmit=chatForm.onsubmit;
document.querySelector('.file-upload-label').onclick=()=>document.getElementById('media-file-input').click();
}
const canWrite=await checkPermission(currentChannel,'write');
const inputContainer=document.getElementById('chat-input-container');
if(!canWrite){inputContainer.style.display='none';}else{inputContainer.style.display='block';}
const msgRes=await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
const messages=await msgRes.json()||{};
const msgEntries=Object.entries(messages).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
const newHash=JSON.stringify(msgEntries.map(e=>e[0]+JSON.stringify(e[1].reactions||{})));
if(newHash!==lastMessagesHash){
lastMessagesHash=newHash;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const isScrolledToBottom=chatMsgs.scrollHeight-chatMsgs.scrollTop<=chatMsgs.clientHeight+80;
chatMsgs.innerHTML='';
if(msgEntries.length===0){
chatMsgs.innerHTML='<div class="empty-state">NO MESSAGES // START THE CONVERSATION</div>';
}else{
msgEntries.forEach(([msgId,msg])=>{
const date=new Date(msg.time||Date.now());
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div=document.createElement('div');div.className='message';div.dataset.msgid=msgId;
let mediaHtml='';
if(msg.media)mediaHtml=(msg.media.startsWith('data:video')||msg.media.includes('video'))?`<video src="${msg.media}" controls></video>`:`<img src="${msg.media}" alt="media">`;
let replyHtml='';
if(msg.replyTo)replyHtml=`<div style="font-size:11px;color:#444;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">REPLY TO ${escapeHtml(msg.replyTo.user)}: ${escapeHtml((msg.replyTo.text||'').substring(0,50))}</div>`;
let reactionsHtml='';
if(msg.reactions&&Object.keys(msg.reactions).length){
reactionsHtml='<div class="reaction-bar">';
Object.entries(msg.reactions).forEach(([emoji,users])=>{
const active=users.includes(currentUser)?'active':'';
reactionsHtml+=`<div class="reaction ${active}" data-emoji="${escapeHtml(emoji)}" data-msgid="${msgId}">${emoji} ${users.length}</div>`;
});
reactionsHtml+='</div>';
}
const canDelete=isAdmin||msg.user===currentUser;
const canEdit=msg.user===currentUser;
div.innerHTML=`<img class="msg-avatar" src="${msg.avatar||generateDefaultAvatar(msg.user)}" alt="" data-user="${escapeHtml(msg.user)}"><div class="msg-content"><div class="msg-header-row"><span class="msg-user" data-user="${escapeHtml(msg.user)}">${escapeHtml(msg.user)}</span><span class="msg-time">${timeStr}</span></div>${replyHtml}<div class="msg-text">${parseMarkdown(escapeHtml(msg.text||''))}</div>${mediaHtml}${reactionsHtml}</div><div class="msg-actions">${canEdit?`<button class="msg-action-btn" data-edit="${msgId}">✎</button>`:''}${canDelete?`<button class="msg-action-btn" data-del="${msgId}">✕</button>`:''}<button class="msg-action-btn" data-reply="${msgId}">↩</button><button class="msg-action-btn" data-react="${msgId}">☺</button></div>`;
if(canDelete)div.querySelector('[data-del]').onclick=async ev=>{ev.stopPropagation();if(!confirm("Delete this message?"))return;await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});lastMessagesHash="";fetchData();};
if(canEdit)div.querySelector('[data-edit]').onclick=ev=>{ev.stopPropagation();editingMsgId=msgId;messageInput.value=msg.text||'';messageInput.placeholder='Editing message...';messageInput.focus();};
div.querySelector('[data-reply]').onclick=ev=>{ev.stopPropagation();replyToMsg={id:msgId,user:msg.user,text:msg.text};messageInput.placeholder=`Replying to ${msg.user}...`;messageInput.focus();};
div.querySelector('[data-react]').onclick=ev=>{ev.stopPropagation();const emoji=prompt("Enter emoji:");if(emoji)addReaction(msgId,emoji.trim());};
div.querySelectorAll('.reaction').forEach(r=>{r.onclick=()=>addReaction(r.dataset.msgid,r.dataset.emoji);});
div.querySelectorAll('[data-user]').forEach(el=>{el.onclick=async()=>{const uname=el.dataset.user;const uRes=await fetch(`${FIREBASE_URL}/users/${uname}.json?auth=${FIREBASE_TOKEN}`);const uData=await uRes.json();if(uData)openMemberProfileModal(uname,uData);};});
div.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'message',msg:{id:msgId,...msg}};const opts=['reply','react'];if(msg.user===currentUser)opts.push('edit-msg');if(isAdmin||msg.user===currentUser)opts.push('delete');showContextMenu(e.clientX,e.clientY,opts);};
chatMsgs.appendChild(div);
});
if(isScrolledToBottom)chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
}
}

async function renderForumView(){
const canCreatePost=await checkPermission(currentChannel,'create_post');
const canWrite=await checkPermission(currentChannel,'write');
if(!activeForumPostId){
const postsRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
const posts=await postsRes.json()||{};
const postEntries=Object.entries(posts).sort((a,b)=>(b[1].time||0)-(a[1].time||0));
let postsHtml='';
postEntries.forEach(([postId,post])=>{
const dateStr=new Date(post.time||Date.now()).toLocaleDateString();
postsHtml+=`<div class="forum-post-card" data-postid="${postId}"><div class="forum-post-title">${escapeHtml(post.title)}</div><div class="forum-post-snippet">${escapeHtml(post.text)}</div><div class="forum-post-footer"><span>BY: ${escapeHtml(post.user)}</span><span>DATE: ${dateStr}</span></div></div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><span>💬 FORUM</span><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="forum-container"><div class="forum-toolbar"><span style="font-size:12px;letter-spacing:2px;font-weight:700">PUBLICATIONS</span>${canCreatePost?`<button class="admin-panel-btn" id="create-forum-post-btn" style="flex-grow:0;padding:8px 14px">+ CREATE</button>`:''}</div>${postEntries.length===0?'<div class="empty-state">NO PUBLICATIONS</div>':postsHtml}</div>`;
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED // ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
if(canCreatePost)document.getElementById('create-forum-post-btn').onclick=()=>openCreateForumPostModal();
mainDisplayArea.querySelectorAll('.forum-post-card').forEach(card=>{
card.onclick=()=>{activeForumPostId=card.dataset.postid;renderForumPostDetail();};
});
}else{
const postRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
const post=await postRes.json();
if(!post){activeForumPostId=null;renderForumView();return;}
const commentsRes=await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
const comments=await commentsRes.json()||{};
const commentEntries=Object.entries(comments).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
let commentsHtml='';
commentEntries.forEach(([cId,c])=>{
const timeStr=new Date(c.time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let mediaHtml='';
if(c.media)mediaHtml=(c.media.startsWith('data:video')||c.media.includes('video'))?`<video src="${c.media}" controls></video>`:`<img src="${c.media}" alt="media">`;
const canDel=isAdmin||c.user===currentUser;
commentsHtml+=`<div class="message"><img class="msg-avatar" src="${c.avatar||generateDefaultAvatar(c.user)}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(c.user)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${parseMarkdown(escapeHtml(c.text||''))}</div>${mediaHtml}</div>${canDel?`<div class="msg-actions"><button class="msg-action-btn" onclick="deleteForumComment('${activeForumPostId}','${cId}')">✕</button></div>`:''}</div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><div style="display:flex;align-items:center;gap:12px"><button id="back-to-forum-list" style="background:none;border:none;color:#888;cursor:pointer;font-size:13px">← BACK</button><span>💬 ${escapeHtml(post.title)}</span></div><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="chat-messages" id="chat-messages"><div class="message" style="border-bottom:1px solid #1a1a1a;padding-bottom:14px;margin-bottom:10px"><img class="msg-avatar" src="${post.avatar||generateDefaultAvatar(post.user)}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(post.user)}</span><span class="msg-time">${new Date(post.time).toLocaleDateString()}</span></div><div style="font-weight:700;margin-bottom:4px;color:#ddd">${escapeHtml(post.title)}</div><div class="msg-text">${parseMarkdown(escapeHtml(post.text))}</div></div></div>${commentsHtml}</div><div class="chat-input-area" id="chat-input-container" style="${canWrite?'':'display:none'}"><form class="chat-input-form" id="chat-form"><label class="file-upload-label" title="Upload">+</label><input type="file" id="media-file-input" accept="image/*,video/*" style="display:none"><input type="text" id="message-input" placeholder="Reply..." autocomplete="off" maxlength="2000"><button type="submit">SEND</button></form></div>`;
document.getElementById('back-to-forum-list').onclick=()=>{activeForumPostId=null;renderForumView();};
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED // ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
document.getElementById('chat-form').onsubmit=chatForm.onsubmit;
document.querySelector('.file-upload-label').onclick=()=>document.getElementById('media-file-input').click();
const msgContainer=document.getElementById('chat-messages');msgContainer.scrollTop=msgContainer.scrollHeight;
}
}

function openCreateForumPostModal(){
const modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML=`<div class="modal-card" style="width:480px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3>CREATE PUBLICATION</h3><button id="close-forum-modal" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px">✕</button></div><div class="input-group"><label>TITLE</label><input type="text" id="forum-post-title-input" placeholder="Title..." maxlength="100"></div><div class="input-group"><label>CONTENT</label><textarea id="forum-post-content-input" rows="5" placeholder="Content..." maxlength="2000"></textarea></div><div class="modal-buttons"><button class="admin-panel-btn" id="submit-forum-post-btn">PUBLISH</button></div></div>`;
document.getElementById('modal-container').appendChild(modal);
modal.querySelector('#close-forum-modal').onclick=()=>modal.remove();
modal.querySelector('#submit-forum-post-btn').onclick=async()=>{
const title=modal.querySelector('#forum-post-title-input').value.trim();
const text=modal.querySelector('#forum-post-content-input').value.trim();
if(!title||!text){alert("Fill title and content.");return;}
try{
await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify({title,text,user:currentUser,avatar:cachedAvatar||generateDefaultAvatar(currentUser),time:Date.now()})});
modal.remove();renderForumView();
}catch(e){alert("Failed to create publication.")}
};
}

async function deleteForumComment(postId,commentId){
if(!confirm("Delete this comment?"))return;
await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${postId}/${commentId}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});
renderForumView();
}

async function openDM(targetUser){
currentChannel='dm_'+[currentUser,targetUser].sort().join('_');
currentChannelType='text';
activeChannelTitle.textContent=`@ ${targetUser}`;
channelTopic.textContent='Direct Message';
messageInput.placeholder=`Message @${targetUser}`;
lastMessagesHash="";
renderTextView();
}

function parseMarkdown(text){
return text
.replace(/\*\*(.+?)\*\*/g,'<span class="markdown-bold">$1</span>')
.replace(/\*(.+?)\*/g,'<span class="markdown-italic">$1</span>')
.replace(/`(.+?)`/g,'<span class="markdown-code">$1</span>')
.replace(/\|\|(.+?)\|\|/g,'<span class="markdown-spoiler">$1</span>')
.replace(/@(\w+)/g,'<span class="mention">@$1</span>');
}

function escapeHtml(str){return(str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function generateDefaultAvatar(name){const canvas=document.createElement('canvas');canvas.width=40;canvas.height=40;const ctx=canvas.getContext('2d');ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,40,40);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(0.5,0.5,39,39);ctx.fillStyle='#ccc';ctx.font='bold 16px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((name||'U').charAt(0).toUpperCase(),20,22);return canvas.toDataURL()}
</script>
