<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Chat - Ultimate Edition v3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            color: #ffffff;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Auth Screen */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000000;
            z-index: 3000;
        }

        .auth-card {
            border: 1px solid #ffffff;
            padding: 40px;
            width: 350px;
            background-color: #000000;
        }

        .auth-card h2 {
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
            font-size: 20px;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .auth-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .switch-auth {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            color: #ffffff;
        }

        /* Main App Layout */
        #app-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Sidebar: Channels & Categories */
        .sidebar-channels {
            width: 260px;
            border-right: 1px solid #ffffff;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        .server-header {
            padding: 20px;
            border-bottom: 1px solid #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .channels-list {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .category-group {
            margin-bottom: 15px;
            cursor: grab;
        }

        .category-group.dragging {
            opacity: 0.4;
        }

        .category-header {
            font-size: 11px;
            letter-spacing: 1px;
            color: #ffffff;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        .category-header:hover {
            background: #111111;
        }

        .category-channels {
            padding-left: 10px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 10px;
        }

        .channel-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            color: #ffffff;
        }

        .channel-item.dragging {
            opacity: 0.4;
        }

        .channel-item:hover, .channel-item.active {
            background: #111111;
            border: 1px solid #ffffff;
        }

        .channel-actions {
            display: none;
            gap: 4px;
        }

        .channel-item:hover .channel-actions {
            display: flex;
        }

        .channel-action-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        /* Profile Panel Styles */
        .user-profile {
            padding: 15px;
            border-top: 1px solid #ffffff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #000;
        }

        .user-profile:hover {
            background: #111111;
        }

        .user-avatar-sm {
            width: 36px;
            height: 36px;
            border: 1px solid #ffffff;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .user-info-text {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logout-btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Center Chat Area */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ffffff;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .channel-settings-gear {
            cursor: pointer;
            font-size: 16px;
            background: none;
            border: none;
            color: #fff;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            color: #ffffff;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border: 1px solid #ffffff;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .msg-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .msg-header-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3px;
        }

        .message .msg-user {
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
        }

        .message .msg-time {
            font-size: 10px;
            color: #ffffff;
        }

        .message .msg-text {
            word-break: break-all;
            color: #ffffff;
        }

        .message img, .message video {
            max-width: 300px;
            max-height: 250px;
            border: 1px solid #ffffff;
            margin-top: 8px;
            display: block;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #ffffff;
        }

        .chat-input-form {
            display: flex;
            border: 1px solid #ffffff;
            align-items: center;
        }

        .file-upload-label {
            padding: 0 15px;
            cursor: pointer;
            border-right: 1px solid #ffffff;
            font-size: 14px;
            height: 100%;
            display: flex;
            align-items: center;
            color: #ffffff;
        }

        .file-upload-label:hover {
            background: #ffffff;
            color: #000000;
        }

        .chat-input-form input[type="text"] {
            flex-grow: 1;
            background: #000000;
            border: none;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .chat-input-form button[type="submit"] {
            background: #000000;
            border-left: 1px solid #ffffff;
            color: #ffffff;
            padding: 0 20px;
            height: 100%;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }

        .chat-input-form button[type="submit"]:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Right Sidebar: Members & Roles */
        .sidebar-members {
            width: 260px;
            border-left: 1px solid #ffffff;
            padding: 20px;
            background-color: #000000;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .members-section h3 {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .member-item {
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px;
            border: 1px solid transparent;
            color: #ffffff;
        }

        .member-item:hover {
            border: 1px solid #ffffff;
            background: #111;
        }

        .member-avatar-sm {
            width: 24px;
            height: 24px;
            border: 1px solid #ffffff;
            object-fit: cover;
        }

        /* Context Menu */
        #context-menu {
            position: fixed;
            background: #000000;
            border: 1px solid #ffffff;
            padding: 5px 0;
            z-index: 5000;
            min-width: 180px;
            display: none;
        }

        .context-menu-item {
            padding: 8px 15px;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .context-menu-item:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .modal-card {
            background: #000000;
            border: 1px solid #ffffff;
            padding: 30px;
            width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            color: #ffffff;
        }

        .modal-card h3 {
            margin-bottom: 20px;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .admin-panel-btn {
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px 14px;
            font-size: 11px;
            cursor: pointer;
            letter-spacing: 1px;
            flex-grow: 1;
            text-align: center;
        }

        .admin-panel-btn:hover {
            background: #fff;
            color: #000;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            cursor: pointer;
            color: #ffffff;
        }

        .checkbox-group input {
            cursor: pointer;
            accent-color: #000;
            width: 16px;
            height: 16px;
        }

        /* Modal Tabs */
        .settings-modal-layout {
            display: flex;
            gap: 20px;
            height: 400px;
        }

        .settings-sidebar {
            width: 160px;
            border-right: 1px solid #fff;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 10px;
        }

        .settings-tab-btn {
            background: none;
            border: none;
            color: #fff;
            text-align: left;
            padding: 8px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .settings-tab-btn:hover, .settings-tab-btn.active {
            background: #fff;
            color: #000;
        }

        .settings-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
    </style>
</head>
<body>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-menu-item" id="ctx-create-channel">Create Channel</div>
        <div class="context-menu-item" id="ctx-create-category">Create Category</div>
        <div class="context-menu-item" id="ctx-create-community">Create Community</div>
        <div class="context-menu-item" id="ctx-edit">Edit Settings</div>
        <div class="context-menu-item" id="ctx-permissions">Permissions</div>
        <div class="context-menu-item" id="ctx-delete" style="color: red;">Delete</div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2 id="auth-title">AUTHORIZATION</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="username-input" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password-input" required>
                </div>
                <button type="submit" class="auth-btn" id="auth-submit-btn">LOGIN</button>
            </form>
            <div class="switch-auth" id="switch-auth-mode">Need an account? Register</div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden">
        <!-- Left Sidebar -->
        <div class="sidebar-channels" id="sidebar-channels-panel">
            <div class="server-header" id="server-header-main">
                <span id="server-title-display">MAIN SERVER</span>
                <span style="font-size: 16px; cursor: pointer;" id="server-gear-btn">⚙</span>
            </div>
            <div class="channels-list" id="channels-container"></div>
            <div class="user-profile" id="user-profile-bar">
                <img id="my-avatar-display" class="user-avatar-sm" src="" alt="" title="Profile settings">
                <div class="user-info-text">
                    <div id="current-username-display" style="font-weight: bold; font-size: 13px;">User</div>
                    <div id="current-user-desc" style="font-size: 10px; color: #ccc;">Edit Profile</div>
                </div>
                <button class="logout-btn" id="logout-btn">LOGOUT</button>
            </div>
        </div>

        <!-- Center Chat -->
        <div class="chat-area">
            <div class="chat-header">
                <span id="active-channel-title"># general</span>
                <button class="channel-settings-gear" id="channel-gear-btn" title="Настройки канала">⚙</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area" id="chat-input-container">
                <form class="chat-input-form" id="chat-form">
                    <label class="file-upload-label" title="Upload Media">+</label>
                    <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
                    <input type="text" id="message-input" placeholder="Message channel" required autocomplete="off">
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar-members" id="sidebar-members-container"></div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        const FIREBASE_URL = "https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
        const FIREBASE_TOKEN = "87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";

        let isRegistering = false;
        let currentUser = localStorage.getItem('chat_user') || null;
        let userIp = "unknown";
        let currentChannel = "general";
        let currentChannelCatKey = "general_cat";
        let isAdmin = false;
        let contextTarget = null; 

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; })
            .catch(() => {});

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const switchAuthMode = document.getElementById('switch-auth-mode');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        
        const currentUsernameDisplay = document.getElementById('current-username-display');
        const currentUserDesc = document.getElementById('current-user-desc');
        const myAvatarDisplay = document.getElementById('my-avatar-display');
        const userProfileBar = document.getElementById('user-profile-bar');
        const logoutBtn = document.getElementById('logout-btn');
        const serverGearBtn = document.getElementById('server-gear-btn');
        const channelGearBtn = document.getElementById('channel-gear-btn');
        const serverTitleDisplay = document.getElementById('server-title-display');
        
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const channelsContainer = document.getElementById('channels-container');
        const sidebarChannelsPanel = document.getElementById('sidebar-channels-panel');
        const sidebarMembersContainer = document.getElementById('sidebar-members-container');
        const activeChannelTitle = document.getElementById('active-channel-title');
        const mediaFileInput = document.getElementById('media-file-input');
        const fileUploadLabel = document.querySelector('.file-upload-label');
        const contextMenu = document.getElementById('context-menu');
        const chatInputContainer = document.getElementById('chat-input-container');

        fileUploadLabel.addEventListener('click', () => mediaFileInput.click());
        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

        sidebarChannelsPanel.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            contextTarget = { type: 'sidebar' };
            showContextMenu(e.clientX, e.clientY, ['create-channel', 'create-category', 'create-community', 'roles']);
        });

        serverGearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isAdmin) {
                alert("Only admin can manage server settings.");
                return;
            }
            openRolesModal();
        });

        channelGearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isAdmin) {
                alert("Только администратор может изменять настройки канала.");
                return;
            }
            openChannelSettingsModal(currentChannelCatKey, currentChannel);
        });

        if (currentUser) {
            checkBanAndInitialize();
        }

        switchAuthMode.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authTitle.textContent = isRegistering ? "REGISTRATION" : "AUTHORIZATION";
            authSubmitBtn.textContent = isRegistering ? "REGISTER" : "LOGIN";
            switchAuthMode.textContent = isRegistering ? "Already have an account? Login" : "Need an account? Register";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) return;

            try {
                const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                if (await banRes.json()) {
                    alert("Your IP address has been banned.");
                    return;
                }

                const res = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
                const users = await res.json() || {};

                if (isRegistering) {
                    if (users[username]) {
                        alert("Username already exists.");
                        return;
                    }
                    await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({ password, ip: userIp, avatar: "", bio: "Member", role: "member", joined: Date.now() })
                    });
                } else {
                    if (!users[username] || users[username].password !== password) {
                        alert("Invalid username or password.");
                        return;
                    }
                }

                currentUser = username;
                localStorage.setItem('chat_user', currentUser);
                checkBanAndInitialize();
            } catch (err) {
                alert("Connection error.");
            }
        });

        logoutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            localStorage.removeItem('chat_user');
            currentUser = null;
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
        });

        async function checkBanAndInitialize() {
            try {
                const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                if (await banRes.json()) {
                    localStorage.removeItem('chat_user');
                    alert("Access denied: IP banned.");
                    return;
                }

                isAdmin = (currentUser === "SStwendRT");
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                currentUsernameDisplay.textContent = currentUser;

                const sNameRes = await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`);
                const sName = await sNameRes.json();
                serverTitleDisplay.textContent = sName || "MAIN SERVER";

                const rootRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                if (!await rootRes.json()) {
                    await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            categories: {
                                "general_cat": {
                                    name: "TEXT CHANNELS",
                                    order: 0,
                                    channels: {
                                        "general": { name: "general", topic: "General chat", order: 0, permissions: {} }
                                    }
                                }
                            }
                        })
                    });
                }

                fetchUserDataAndAvatar();
                startPolling();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchUserDataAndAvatar() {
            try {
                const res = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const data = await res.json();
                myAvatarDisplay.src = data?.avatar || generateDefaultAvatar(currentUser);
                currentUsernameDisplay.textContent = currentUser;
                currentUserDesc.textContent = data?.bio || "No description provided";
            } catch (e) {}
        }

        userProfileBar.addEventListener('click', async () => {
            try {
                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const userData = await userRes.json() || {};

                let currentAvatar = userData.avatar || "";
                let currentName = currentUser;
                let currentBio = userData.bio || "";

                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                
                modal.innerHTML = `
                    <div class="modal-card" style="width: 450px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3>МОЙ ПРОФИЛЬ</h3>
                            <button id="close-profile-modal" style="background:none; border:none; color:#fff; cursor:pointer; font-size:16px;">✕</button>
                        </div>
                        
                        <div style="display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px;">
                            <div style="text-align: center;">
                                <img id="profile-modal-avatar" src="${currentAvatar || generateDefaultAvatar(currentName)}" style="width: 70px; height: 70px; border: 1px solid #fff; object-fit: cover; cursor: pointer;" title="Нажмите, чтобы изменить аватар">
                                <div style="font-size: 10px; color: #aaa; margin-top: 4px;">Изменить аватар</div>
                            </div>
                            <div style="flex-grow: 1;" class="input-group">
                                <label>НИКНЕЙМ</label>
                                <input type="text" id="profile-modal-name" value="${escapeHtml(currentName)}">
                            </div>
                        </div>

                        <div class="input-group">
                            <label>ОПИСАНИЕ ПРОФИЛЯ (БИО)</label>
                            <textarea id="profile-modal-bio" rows="4">${escapeHtml(currentBio)}</textarea>
                        </div>

                        <div class="modal-buttons" id="profile-save-container" style="display: none;">
                            <button class="admin-panel-btn" id="save-profile-btn">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
                        </div>
                    </div>
                `;
                document.getElementById('modal-container').appendChild(modal);

                const avatarImg = modal.querySelector('#profile-modal-avatar');
                const nameInput = modal.querySelector('#profile-modal-name');
                const bioInput = modal.querySelector('#profile-modal-bio');
                const saveContainer = modal.querySelector('#profile-save-container');

                let newAvatarVal = currentAvatar;

                function checkForChanges() {
                    const hasChanged = (
                        nameInput.value.trim() !== currentName ||
                        bioInput.value !== currentBio ||
                        newAvatarVal !== currentAvatar
                    );
                    if (hasChanged) {
                        saveContainer.style.display = 'flex';
                    } else {
                        saveContainer.style.display = 'none';
                    }
                }

                nameInput.addEventListener('input', checkForChanges);
                bioInput.addEventListener('input', checkForChanges);

                avatarImg.onclick = () => {
                    const url = prompt("Введите ссылку на новый аватар (или оставьте пустым):", newAvatarVal);
                    if (url !== null) {
                        newAvatarVal = url;
                        avatarImg.src = newAvatarVal || generateDefaultAvatar(nameInput.value || currentUser);
                        checkForChanges();
                    }
                };

                modal.querySelector('#close-profile-modal').onclick = () => modal.remove();

                modal.querySelector('#save-profile-btn').onclick = async () => {
                    const targetNewName = nameInput.value.trim();
                    const targetNewBio = bioInput.value;

                    if (!targetNewName) {
                        alert("Никнейм не может быть пустым.");
                        return;
                    }

                    try {
                        if (targetNewName !== currentUser) {
                            const checkRes = await fetch(`${FIREBASE_URL}/users/${targetNewName}.json?auth=${FIREBASE_TOKEN}`);
                            if (await checkRes.json()) {
                                alert("Этот никнейм уже занят!");
                                return;
                            }
                            await fetch(`${FIREBASE_URL}/users/${targetNewName}.json?auth=${FIREBASE_TOKEN}`, {
                                method: 'PUT',
                                body: JSON.stringify({ ...userData, name: targetNewName, bio: targetNewBio, avatar: newAvatarVal })
                            });
                            await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`, {
                                method: 'DELETE'
                            });
                            currentUser = targetNewName;
                            localStorage.setItem('chat_user', currentUser);
                        } else {
                            await fetch(`${FIREBASE_URL}/users/${currentUser}/bio.json?auth=${FIREBASE_TOKEN}`, {
                                method: 'PUT', body: JSON.stringify(targetNewBio)
                            });
                            await fetch(`${FIREBASE_URL}/users/${currentUser}/avatar.json?auth=${FIREBASE_TOKEN}`, {
                                method: 'PUT', body: JSON.stringify(newAvatarVal)
                            });
                        }

                        modal.remove();
                        fetchUserDataAndAvatar();
                        fetchData();
                    } catch (err) {
                        alert("Не удалось сохранить профиль.");
                    }
                };

            } catch (e) {
                alert("Ошибка открытия профиля.");
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let text = messageInput.value.trim();
            if (!text && !mediaFileInput.files[0]) return;

            if (mediaFileInput.files && mediaFileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    sendMsgToFirebase(text, ev.target.result);
                };
                reader.readAsDataURL(mediaFileInput.files[0]);
                mediaFileInput.value = "";
                return;
            }

            sendMsgToFirebase(text, "");
        });

        async function sendMsgToFirebase(text, mediaUrl) {
            try {
                const allowed = await checkPermission(currentChannel, 'send');
                if (!allowed) {
                    alert("You do not have permission to send messages in this channel.");
                    return;
                }

                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const uData = await userRes.json();
                const avatar = uData?.avatar || generateDefaultAvatar(currentUser);

                await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'POST',
                    body: JSON.stringify({ user: currentUser, avatar, text, media: mediaUrl, time: Date.now() })
                });
                messageInput.value = '';
            } catch (err) {
                console.error(err);
            }
        }

        async function checkPermission(channelKey, action) {
            if (currentUser === "SStwendRT") return true;
            try {
                const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                const struct = await structRes.json();
                
                let chanObj = null;
                for (let catKey in struct.categories) {
                    if (struct.categories[catKey].channels && struct.categories[catKey].channels[channelKey]) {
                        chanObj = struct.categories[catKey].channels[channelKey];
                        break;
                    }
                }
                if (!chanObj) return true;

                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const uData = await userRes.json();
                const uRole = uData?.role || 'member';

                const perms = chanObj.permissions || {};
                
                if (perms.users && perms.users[currentUser] && perms.users[currentUser][action] !== undefined) {
                    return perms.users[currentUser][action];
                }

                const rolePerm = perms[uRole];
                if (rolePerm && rolePerm[action] === false) return false;
                return true;
            } catch (e) {
                return true;
            }
        }

        function showContextMenu(x, y, options) {
            contextMenu.innerHTML = '';
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'context-menu-item';
                if (opt === 'delete') {
                    div.style.color = 'red';
                    div.textContent = 'Delete';
                    div.onclick = () => handleDeleteTarget();
                } else if (opt === 'edit') {
                    div.textContent = 'Edit Settings';
                    div.onclick = () => handleEditTarget();
                } else if (opt === 'permissions') {
                    div.textContent = 'Permissions';
                    div.onclick = () => handlePermissionsTarget();
                } else if (opt === 'create-channel') {
                    div.textContent = 'Create Channel';
                    div.onclick = () => handleCreateChannelPrompt(contextTarget && contextTarget.type === 'category' ? contextTarget.id : null);
                } else if (opt === 'create-category') {
                    div.textContent = 'Create Category';
                    div.onclick = () => handleCreateCategoryPrompt();
                } else if (opt === 'create-community') {
                    div.textContent = 'Create Community';
                    div.onclick = () => handleCreateCommunityPrompt();
                } else if (opt === 'roles') {
                    div.textContent = 'Manage Roles';
                    div.onclick = () => openRolesModal();
                }
                contextMenu.appendChild(div);
            });
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.style.display = 'block';
        }

        let isPolling = false;
        function startPolling() {
            fetchData();
            setInterval(fetchData, 3000);
        }

        async function fetchData() {
            if (isPolling) return;
            isPolling = true;
            try {
                const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                const structure = await structRes.json() || { categories: {} };

                channelsContainer.innerHTML = '';
                let channelExists = false;

                const sortedCategories = Object.keys(structure.categories).sort((a, b) => {
                    return (structure.categories[a].order || 0) - (structure.categories[b].order || 0);
                });

                sortedCategories.forEach(catKey => {
                    const cat = structure.categories[catKey];
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category-group';
                    catDiv.draggable = isAdmin;
                    catDiv.dataset.catKey = catKey;

                    catDiv.addEventListener('dragstart', (e) => {
                        e.stopPropagation();
                        e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'category', key: catKey }));
                        catDiv.classList.add('dragging');
                    });
                    catDiv.addEventListener('dragend', () => catDiv.classList.remove('dragging'));
                    catDiv.addEventListener('dragover', (e) => e.preventDefault());
                    catDiv.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const data = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                        if (data.type === 'category' && data.key !== catKey) {
                            await reorderCategories(data.key, catKey, sortedCategories);
                        }
                    });

                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-header';
                    catHeader.innerHTML = `<span>▼ ${cat.name}</span>`;
                    
                    catHeader.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (!isAdmin) return;
                        contextTarget = { type: 'category', id: catKey, name: cat.name };
                        showContextMenu(e.clientX, e.clientY, ['create-channel', 'edit', 'delete']);
                    };
                    catDiv.appendChild(catHeader);

                    const chansContainer = document.createElement('div');
                    chansContainer.className = 'category-channels';

                    // Перетаскивание канала прямо в пустую или другую категорию
                    chansContainer.addEventListener('dragover', (e) => e.preventDefault());
                    chansContainer.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const data = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                        if (data.type === 'channel' && data.catKey !== catKey) {
                            await reorderChannels(data.key, data.catKey, null, catKey, []);
                        }
                    });

                    if (cat.channels) {
                        const sortedChans = Object.keys(cat.channels).sort((a, b) => {
                            return (cat.channels[a].order || 0) - (cat.channels[b].order || 0);
                        });

                        sortedChans.forEach(chKey => {
                            const ch = cat.channels[chKey];
                            if (chKey === currentChannel) {
                                channelExists = true;
                                currentChannelCatKey = catKey;
                            }

                            const chDiv = document.createElement('div');
                            chDiv.className = `channel-item ${currentChannel === chKey ? 'active' : ''}`;
                            chDiv.draggable = isAdmin;
                            
                            chDiv.innerHTML = `
                                <span># ${ch.name}</span>
                                <div class="channel-actions">
                                    ${isAdmin ? `<button class="channel-action-btn" title="Edit Settings" onclick="event.stopPropagation(); openChannelSettingsModal('${catKey}', '${chKey}')">⚙</button>` : ''}
                                </div>
                            `;

                            chDiv.addEventListener('dragstart', (e) => {
                                e.stopPropagation();
                                e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'channel', key: chKey, catKey: catKey }));
                                chDiv.classList.add('dragging');
                            });
                            chDiv.addEventListener('dragend', () => chDiv.classList.remove('dragging'));
                            chDiv.addEventListener('dragover', (e) => e.preventDefault());
                            chDiv.addEventListener('drop', async (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                const data = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
                                if (data.type === 'channel') {
                                    await reorderChannels(data.key, data.catKey, chKey, catKey, sortedChans);
                                }
                            });

                            chDiv.onclick = async () => {
                                const canRead = await checkPermission(chKey, 'read');
                                if (!canRead) {
                                    alert("You do not have permission to view this channel.");
                                    return;
                                }
                                currentChannel = chKey;
                                currentChannelCatKey = catKey;
                                activeChannelTitle.textContent = `# ${ch.name}`;
                                fetchData();
                            };

                            chDiv.oncontextmenu = (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                if (!isAdmin) return;
                                contextTarget = { type: 'channel', id: chKey, catId: catKey, name: ch.name };
                                showContextMenu(e.clientX, e.clientY, ['edit', 'permissions', 'delete']);
                            };

                            chansContainer.appendChild(chDiv);
                        });
                    }
                    catDiv.appendChild(chansContainer);
                    channelsContainer.appendChild(catDiv);
                });

                if (!channelExists) currentChannel = 'general';

                const canReadActive = await checkPermission(currentChannel, 'read');
                if (!canReadActive) {
                    chatMessages.innerHTML = '<div style="padding:20px; color:#fff;">[ACCESS DENIED] You do not have permission to read this channel.</div>';
                    chatInputContainer.style.display = 'none';
                } else {
                    chatInputContainer.style.display = 'block';
                    const msgRes = await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
                    const messages = await msgRes.json() || {};
                    chatMessages.innerHTML = '';
                    Object.values(messages).sort((a, b) => a.time - b.time).forEach(msg => {
                        const date = new Date(msg.time);
                        const timeStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                        const div = document.createElement('div');
                        div.className = 'message';
                        let mediaHtml = msg.media ? (msg.media.includes('video') ? `<video src="${msg.media}" controls></video>` : `<img src="${msg.media}">`) : '';
                        
                        div.innerHTML = `
                            <img class="msg-avatar" src="${msg.avatar || generateDefaultAvatar(msg.user)}" alt="">
                            <div class="msg-content">
                                <div class="msg-header-row">
                                    <span class="msg-user">${escapeHtml(msg.user)}</span>
                                    <span class="msg-time">${timeStr}</span>
                                </div>
                                <div class="msg-text">${escapeHtml(msg.text)}</div>
                                ${mediaHtml}
                            </div>
                        `;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                // Members & Roles
                const userRes = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
                const users = await userRes.json() || {};
                const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
                const roles = await rolesRes.json() || { member: { name: "member", color: "#ffffff" } };

                sidebarMembersContainer.innerHTML = '';
                const grouped = {};
                Object.keys(roles).forEach(rKey => { grouped[rKey] = []; });
                if (!grouped['member']) grouped['member'] = [];

                Object.keys(users).forEach(uname => {
                    const uData = users[uname];
                    const uRole = uData.role && roles[uData.role] ? uData.role : 'member';
                    if (!grouped[uRole]) grouped[uRole] = [];
                    grouped[uRole].push({ name: uname, ...uData });
                });

                Object.keys(roles).forEach(rKey => {
                    const rList = grouped[rKey] || [];
                    if (rList.length === 0 && rKey === 'member') return;

                    const sec = document.createElement('div');
                    sec.className = 'members-section';
                    const rColor = roles[rKey].color || '#ffffff';
                    sec.innerHTML = `<h3 style="color: ${rColor}">${roles[rKey].name.toUpperCase()} — ${rList.length}</h3>`;

                    rList.forEach(user => {
                        const mDiv = document.createElement('div');
                        mDiv.className = 'member-item';
                        mDiv.innerHTML = `
                            <img class="member-avatar-sm" src="${user.avatar || generateDefaultAvatar(user.name)}" alt="">
                            <span style="color: ${rColor}">${escapeHtml(user.name)}</span>
                        `;
                        // Клик по пользователю в правом списке открывает модальное окно профиля/прав
                        mDiv.onclick = () => openMemberProfileModal(user.name, user);
                        sec.appendChild(mDiv);
                    });
                    sidebarMembersContainer.appendChild(sec);
                });

            } catch (err) {
                console.error(err);
            } finally {
                isPolling = false;
            }
        }

        async function reorderCategories(draggedKey, targetKey, sortedKeys) {
            const dragIdx = sortedKeys.indexOf(draggedKey);
            const targetIdx = sortedKeys.indexOf(targetKey);
            sortedKeys.splice(dragIdx, 1);
            sortedKeys.splice(targetIdx, 0, draggedKey);

            const updates = {};
            sortedKeys.forEach((key, idx) => {
                updates[`${key}/order`] = idx;
            });

            await fetch(`${FIREBASE_URL}/structure/categories.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PATCH',
                body: JSON.stringify(updates)
            });
            fetchData();
        }

        async function reorderChannels(draggedKey, sourceCatKey, targetKey, targetCatKey, sortedChans) {
            if (sourceCatKey !== targetCatKey) {
                // Перетаскиваем в другую категорию
                const structRes = await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`);
                const chanData = await structRes.json();
                
                await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify(chanData)
                });
                await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'DELETE'
                });
            } else if (targetKey) {
                // Перетаскиваем внутри одной категории
                const dragIdx = sortedChans.indexOf(draggedKey);
                const targetIdx = sortedChans.indexOf(targetKey);
                sortedChans.splice(dragIdx, 1);
                sortedChans.splice(targetIdx, 0, draggedKey);

                const updates = {};
                sortedChans.forEach((key, idx) => {
                    updates[`${key}/order`] = idx;
                });
                await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PATCH',
                    body: JSON.stringify(updates)
                });
            }
            fetchData();
        }

        async function handleCreateCategoryPrompt() {
            if (!isAdmin) { alert("Admin only."); return; }
            const name = prompt("Category Name:");
            if (!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, "_") + "_" + Date.now();
            await fetch(`${FIREBASE_URL}/structure/categories/${key}.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify({ name, order: Date.now(), channels: {} })
            });
            fetchData();
        }

        async function handleCreateChannelPrompt(specificCatId = null) {
            if (!isAdmin) { alert("Admin only."); return; }
            const structRes = await fetch(`${FIREBASE_URL}/structure/categories.json?auth=${FIREBASE_TOKEN}`);
            const cats = await structRes.json() || {};
            const catKeys = Object.keys(cats);
            if (catKeys.length === 0) {
                alert("Create a category first!");
                return;
            }

            const catId = specificCatId || catKeys[0];
            const name = prompt("Channel Name:");
            if (!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9-_]/g, "");
            if (!key) return;

            await fetch(`${FIREBASE_URL}/structure/categories/${catId}/channels/${key}.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify({ name: key, topic: "", order: Date.now(), permissions: {} })
            });
            fetchData();
        }

        async function handleCreateCommunityPrompt() {
            if (!isAdmin) { alert("Admin only."); return; }
            const commName = prompt("Community / Server Name:");
            if (!commName) return;
            await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify(commName)
            });
            serverTitleDisplay.textContent = commName;
            alert("Community created / renamed successfully!");
        }

        async function handleEditTarget() {
            if (!isAdmin) return;
            if (contextTarget.type === 'category') {
                const newName = prompt("Edit Category Name:", contextTarget.name);
                if (newName) {
                    await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}/name.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(newName)
                    });
                    fetchData();
                }
            } else if (contextTarget.type === 'channel') {
                openChannelSettingsModal(contextTarget.catId, contextTarget.id);
            }
        }

        async function handleDeleteTarget() {
            if (!isAdmin) return;
            if (!confirm(`Delete ${contextTarget.type} ${contextTarget.name || ''}?`)) return;
            if (contextTarget.type === 'category') {
                await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
            } else if (contextTarget.type === 'channel') {
                await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.catId}/channels/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
            }
            fetchData();
        }

        async function openChannelSettingsModal(catKey, chKey) {
            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || { member: { name: "member", color: "#ffffff" } };
            const chanRes = await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}.json?auth=${FIREBASE_TOKEN}`);
            const chanData = await chanRes.json() || {};
            const perms = chanData.permissions || {};

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            
            modal.innerHTML = `
                <div class="modal-card" style="width: 750px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3>Настройки канала: #${escapeHtml(chanData.name || chKey)}</h3>
                        <button id="close-settings-modal" style="background:none; border:none; color:#fff; cursor:pointer; font-size:16px;">✕</button>
                    </div>
                    <div class="settings-modal-layout">
                        <div class="settings-sidebar">
                            <button class="settings-tab-btn active" data-tab="tab-overview">Обзор</button>
                            <button class="settings-tab-btn" data-tab="tab-permissions">Права канала</button>
                        </div>
                        <div class="settings-content">
                            <!-- TAB 1: OVERVIEW -->
                            <div id="tab-overview" class="tab-pane">
                                <div class="input-group">
                                    <label>НАЗВАНИЕ КАНАЛА</label>
                                    <input type="text" id="setting-chan-name" value="${escapeHtml(chanData.name || chKey)}">
                                </div>
                                <div class="input-group">
                                    <label>ТЕМА КАНАЛА (ОПИСАНИЕ)</label>
                                    <textarea id="setting-chan-topic" rows="5" placeholder="Расскажите участникам, как пользоваться этим каналом!">${escapeHtml(chanData.topic || '')}</textarea>
                                </div>
                            </div>
                            <!-- TAB 2: PERMISSIONS -->
                            <div id="tab-permissions" class="tab-pane hidden">
                                <div style="display: flex; gap: 15px; height: 100%;">
                                    <div style="width: 200px; border-right: 1px solid #333; padding-right: 10px; overflow-y: auto;">
                                        <div style="font-size: 11px; margin-bottom: 10px; color: #aaa;">РОЛИ / ЛЮДИ</div>
                                        <div id="settings-roles-list"></div>
                                    </div>
                                    <div style="flex-grow: 1; padding-left: 5px;" id="settings-role-perms-panel">
                                        <div style="color: #666; font-size: 12px; text-align: center; margin-top: 50px;">Выберите роль слева, чтобы настроить её права</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="save-all-settings" style="display: none;">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);

            const nameInput = modal.querySelector('#setting-chan-name');
            const topicInput = modal.querySelector('#setting-chan-topic');
            const saveBtn = modal.querySelector('#save-all-settings');

            let initialName = chanData.name || chKey;
            let initialTopic = chanData.topic || '';
            let currentPermsJSON = JSON.stringify(perms);
            let editingPerms = JSON.parse(currentPermsJSON);

            function checkSettingsChanged() {
                const changed = (
                    nameInput.value.trim() !== initialName ||
                    topicInput.value !== initialTopic ||
                    JSON.stringify(editingPerms) !== currentPermsJSON
                );
                if (changed) {
                    saveBtn.style.display = 'block';
                } else {
                    saveBtn.style.display = 'none';
                }
            }

            nameInput.addEventListener('input', checkSettingsChanged);
            topicInput.addEventListener('input', checkSettingsChanged);

            const rolesListContainer = modal.querySelector('#settings-roles-list');
            const rolePermsPanel = modal.querySelector('#settings-role-perms-panel');

            let selectedRoleKey = Object.keys(roles)[0];

            function renderRolesList() {
                let html = '';
                Object.keys(roles).forEach(rKey => {
                    const r = roles[rKey];
                    const isSelected = (rKey === selectedRoleKey);
                    html += `
                        <div class="role-select-item" data-rkey="${rKey}" style="padding: 8px; font-size: 12px; cursor: pointer; margin-bottom: 4px; background: ${isSelected ? '#fff' : 'transparent'}; color: ${isSelected ? '#000' : r.color || '#fff'}; border: 1px solid ${isSelected ? '#fff' : '#333'}">
                            ${r.name}
                        </div>
                    `;
                });
                rolesListContainer.innerHTML = html;

                rolesListContainer.querySelectorAll('.role-select-item').forEach(item => {
                    item.onclick = () => {
                        selectedRoleKey = item.dataset.rkey;
                        renderRolesList();
                        renderRolePermsForm();
                    };
                });
            }

            function renderRolePermsForm() {
                const r = roles[selectedRoleKey];
                if (!r) return;

                if (!editingPerms[selectedRoleKey]) {
                    editingPerms[selectedRoleKey] = { read: true, send: true };
                }
                const rPerm = editingPerms[selectedRoleKey];
                const canRead = rPerm.read !== false;
                const canSend = rPerm.send !== false;

                rolePermsPanel.innerHTML = `
                    <div style="font-size: 13px; font-weight: bold; color: ${r.color || '#fff'}; margin-bottom: 15px;">
                        Права для роли: ${r.name}
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="chk-perm-read" ${canRead ? 'checked' : ''}> Просмотр текстового канала
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="chk-perm-send" ${canSend ? 'checked' : ''}> Отправка сообщений
                    </div>
                `;

                const chkRead = rolePermsPanel.querySelector('#chk-perm-read');
                const chkSend = rolePermsPanel.querySelector('#chk-perm-send');

                chkRead.onchange = () => {
                    if (!editingPerms[selectedRoleKey]) editingPerms[selectedRoleKey] = {};
                    editingPerms[selectedRoleKey].read = chkRead.checked;
                    checkSettingsChanged();
                };

                chkSend.onchange = () => {
                    if (!editingPerms[selectedRoleKey]) editingPerms[selectedRoleKey] = {};
                    editingPerms[selectedRoleKey].send = chkSend.checked;
                    checkSettingsChanged();
                };
            }

            renderRolesList();
            renderRolePermsForm();

            modal.querySelectorAll('.settings-tab-btn').forEach(btn => {
                btn.onclick = () => {
                    modal.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active'));
                    modal.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
                    btn.classList.add('active');
                    modal.querySelector(`#${btn.dataset.tab}`).classList.remove('hidden');
                };
            });

            modal.querySelector('#close-settings-modal').onclick = () => modal.remove();

            saveBtn.onclick = async () => {
                const finalName = nameInput.value.trim();
                const finalTopic = topicInput.value;

                if (!finalName) {
                    alert("Название канала не может быть пустым.");
                    return;
                }

                try {
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/name.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(finalName)
                    });
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/topic.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(finalTopic)
                    });
                    await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/permissions.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(editingPerms)
                    });

                    modal.remove();
                    alert("Настройки канала успешно сохранены!");
                    fetchData();
                } catch (err) {
                    alert("Ошибка при сохранении настроек.");
                }
            };
        }

        async function handlePermissionsTarget() {
            if (!isAdmin || contextTarget.type !== 'channel') return;
            openChannelSettingsModal(contextTarget.catId, contextTarget.id);
        }

        async function openRolesModal() {
            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || {};

            let rolesHtml = '';
            Object.keys(roles).forEach(key => {
                rolesHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><b style="color:${roles[key].color}">${roles[key].name}</b> <span>${roles[key].color}</span></div>`;
            });

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>SERVER SETTINGS & ROLES</h3>
                    <div style="margin-bottom: 15px; max-height: 150px; overflow-y:auto;">${rolesHtml}</div>
                    <button class="admin-panel-btn" id="create-role-btn" style="width:100%; margin-bottom:10px;">CREATE NEW ROLE</button>
                    <button class="admin-panel-btn" id="rename-server-btn" style="width:100%; margin-bottom:10px;">RENAME COMMUNITY</button>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="close-modal">CLOSE</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);

            document.getElementById('close-modal').onclick = () => modal.remove();
            document.getElementById('rename-server-btn').onclick = () => {
                modal.remove();
                handleCreateCommunityPrompt();
            };
            document.getElementById('create-role-btn').onclick = async () => {
                const rName = prompt("Role Name:");
                if (!rName) return;
                const rColor = prompt("Role Color (Hex like #ffffff):", "#ffffff");
                const rKey = rName.toLowerCase().replace(/[^a-z0-9]/g, "");

                await fetch(`${FIREBASE_URL}/roles/${rKey}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name: rName, color: rColor || "#ffffff" })
                });
                modal.remove();
                fetchData();
            };
        }

        function generateDefaultAvatar(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 40;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 40, 40);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(0, 0, 40, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText((name || 'U').charAt(0).toUpperCase(), 20, 20);
            return canvas.toDataURL();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
