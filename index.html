<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Chat - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Auth Screen */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000000;
            z-index: 3000;
        }

        .auth-card {
            border: 1px solid #ffffff;
            padding: 40px;
            width: 350px;
            background-color: #000000;
        }

        .auth-card h2 {
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .auth-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .switch-auth {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Main App Layout */
        #app-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Sidebar: Channels & Categories */
        .sidebar-channels {
            width: 260px;
            border-right: 1px solid #ffffff;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        .server-header {
            padding: 20px;
            border-bottom: 1px solid #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .server-header:hover {
            background: #111111;
        }

        .channels-list {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .category-group {
            margin-bottom: 15px;
        }

        .category-header {
            font-size: 11px;
            letter-spacing: 1px;
            color: #888888;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-transform: uppercase;
        }

        .category-header:hover {
            color: #ffffff;
            background: #111111;
        }

        .category-channels {
            padding-left: 10px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .channel-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-item:hover, .channel-item.active {
            background: #111111;
            border: 1px solid #ffffff;
        }

        .user-profile {
            padding: 15px;
            border-top: 1px solid #ffffff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-sm {
            width: 32px;
            height: 32px;
            border: 1px solid #ffffff;
            object-fit: cover;
            background: #222;
        }

        .user-info-text {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logout-btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Center Chat Area */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ffffff;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            gap: 12px;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border: 1px solid #ffffff;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .msg-content {
            flex-grow: 1;
        }

        .message .msg-user {
            font-weight: bold;
            margin-right: 10px;
        }

        .message .msg-time {
            font-size: 10px;
            color: #888888;
            margin-left: 10px;
        }

        .message .msg-text {
            margin-top: 4px;
            word-break: break-all;
        }

        .message img, .message video {
            max-width: 300px;
            max-height: 250px;
            border: 1px solid #ffffff;
            margin-top: 8px;
            display: block;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #ffffff;
        }

        .chat-input-form {
            display: flex;
            border: 1px solid #ffffff;
            align-items: center;
        }

        .file-upload-label {
            padding: 0 15px;
            cursor: pointer;
            border-right: 1px solid #ffffff;
            font-size: 14px;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .file-upload-label:hover {
            background: #ffffff;
            color: #000000;
        }

        .chat-input-form input[type="text"] {
            flex-grow: 1;
            background: #000000;
            border: none;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .chat-input-form button[type="submit"] {
            background: #000000;
            border-left: 1px solid #ffffff;
            color: #ffffff;
            padding: 0 20px;
            height: 100%;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }

        .chat-input-form button[type="submit"]:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Right Sidebar: Members & Roles */
        .sidebar-members {
            width: 260px;
            border-left: 1px solid #ffffff;
            padding: 20px;
            background-color: #000000;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .members-section h3 {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #888888;
        }

        .member-item {
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px;
            border: 1px solid transparent;
        }

        .member-item:hover {
            border: 1px solid #ffffff;
        }

        .member-avatar-sm {
            width: 24px;
            height: 24px;
            border: 1px solid #ffffff;
            object-fit: cover;
        }

        /* Context Menu (Right Click) */
        #context-menu {
            position: fixed;
            background: #000000;
            border: 1px solid #ffffff;
            padding: 5px 0;
            z-index: 5000;
            min-width: 160px;
            display: none;
        }

        .context-menu-item {
            padding: 8px 15px;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .context-menu-item:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .modal-card {
            background: #000000;
            border: 1px solid #ffffff;
            padding: 30px;
            width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            margin-bottom: 20px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .admin-panel-btn {
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px 14px;
            font-size: 11px;
            cursor: pointer;
            letter-spacing: 1px;
            flex-grow: 1;
            text-align: center;
        }

        .admin-panel-btn:hover {
            background: #fff;
            color: #000;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            accent-color: #000;
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-menu-item" id="ctx-create-channel">Create Channel</div>
        <div class="context-menu-item" id="ctx-create-category">Create Category</div>
        <div class="context-menu-item" id="ctx-edit">Edit Settings</div>
        <div class="context-menu-item" id="ctx-permissions" style="color: yellow;">Permissions</div>
        <div class="context-menu-item" id="ctx-delete" style="color: red;">Delete</div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2 id="auth-title">AUTHORIZATION</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="username-input" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password-input" required>
                </div>
                <button type="submit" class="auth-btn" id="auth-submit-btn">LOGIN</button>
            </form>
            <div class="switch-auth" id="switch-auth-mode">Need an account? Register</div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden">
        <!-- Left Sidebar -->
        <div class="sidebar-channels" id="sidebar-channels-panel">
            <div class="server-header" id="server-header-main">
                <span>MAIN SERVER</span>
                <span style="font-size: 16px;">⚙</span>
            </div>
            <div class="channels-list" id="channels-container"></div>
            <div class="user-profile">
                <img id="my-avatar-display" class="user-avatar-sm" src="" alt="">
                <div class="user-info-text">
                    <div id="current-username-display" style="font-weight: bold;">User</div>
                    <div style="font-size: 9px; cursor: pointer; text-decoration: underline;" id="edit-avatar-btn">Set Avatar</div>
                </div>
                <button class="logout-btn" id="logout-btn">LOGOUT</button>
            </div>
        </div>

        <!-- Center Chat -->
        <div class="chat-area">
            <div class="chat-header">
                <span id="active-channel-title"># general</span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area" id="chat-input-container">
                <form class="chat-input-form" id="chat-form">
                    <label class="file-upload-label" title="Upload Media">+</label>
                    <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
                    <input type="text" id="message-input" placeholder="Message channel" required autocomplete="off">
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar-members" id="sidebar-members-container"></div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        const FIREBASE_URL = "https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
        const FIREBASE_TOKEN = "87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";

        let isRegistering = false;
        let currentUser = localStorage.getItem('chat_user') || null;
        let userIp = "unknown";
        let currentChannel = "general";
        let isAdmin = false;
        let contextTarget = null; // { type: 'channel'|'category'|'server', id, name }

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; })
            .catch(() => {});

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const switchAuthMode = document.getElementById('switch-auth-mode');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        
        const currentUsernameDisplay = document.getElementById('current-username-display');
        const myAvatarDisplay = document.getElementById('my-avatar-display');
        const editAvatarBtn = document.getElementById('edit-avatar-btn');
        const logoutBtn = document.getElementById('logout-btn');
        
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const channelsContainer = document.getElementById('channels-container');
        const sidebarMembersContainer = document.getElementById('sidebar-members-container');
        const activeChannelTitle = document.getElementById('active-channel-title');
        const mediaFileInput = document.getElementById('media-file-input');
        const fileUploadLabel = document.querySelector('.file-upload-label');
        const contextMenu = document.getElementById('context-menu');
        const serverHeaderMain = document.getElementById('server-header-main');
        const chatInputContainer = document.getElementById('chat-input-container');

        fileUploadLabel.addEventListener('click', () => mediaFileInput.click());

        // Global context menu hide
        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

        serverHeaderMain.addEventListener('contextmenu', (e) => {
            if (!isAdmin) return;
            e.preventDefault();
            contextTarget = { type: 'server' };
            showContextMenu(e.clientX, e.clientY, ['create-category', 'roles']);
        });

        if (currentUser) {
            checkBanAndInitialize();
        }

        switchAuthMode.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authTitle.textContent = isRegistering ? "REGISTRATION" : "AUTHORIZATION";
            authSubmitBtn.textContent = isRegistering ? "REGISTER" : "LOGIN";
            switchAuthMode.textContent = isRegistering ? "Already have an account? Login" : "Need an account? Register";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) return;

            try {
                const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                if (await banRes.json()) {
                    alert("Your IP address has been banned.");
                    return;
                }

                const res = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
                const users = await res.json() || {};

                if (isRegistering) {
                    if (users[username]) {
                        alert("Username already exists.");
                        return;
                    }
                    await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({ password, ip: userIp, avatar: "", role: "member", joined: Date.now() })
                    });
                } else {
                    if (!users[username] || users[username].password !== password) {
                        alert("Invalid username or password.");
                        return;
                    }
                }

                currentUser = username;
                localStorage.setItem('chat_user', currentUser);
                checkBanAndInitialize();
            } catch (err) {
                alert("Connection error.");
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_user');
            currentUser = null;
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
        });

        async function checkBanAndInitialize() {
            try {
                const banRes = await fetch(`${FIREBASE_URL}/bans/${userIp}.json?auth=${FIREBASE_TOKEN}`);
                if (await banRes.json()) {
                    localStorage.removeItem('chat_user');
                    alert("Access denied: IP banned.");
                    return;
                }

                isAdmin = (currentUser === "SStwendRT");
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                currentUsernameDisplay.textContent = currentUser;

                // Default structure if empty
                const rootRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                if (!await rootRes.json()) {
                    await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            categories: {
                                "general_cat": {
                                    name: "TEXT CHANNELS",
                                    channels: {
                                        "general": { name: "general", permissions: {} }
                                    }
                                }
                            }
                        })
                    });
                }

                fetchUserDataAndAvatar();
                startPolling();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchUserDataAndAvatar() {
            try {
                const res = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const data = await res.json();
                myAvatarDisplay.src = data?.avatar || generateDefaultAvatar(currentUser);
            } catch (e) {}
        }

        editAvatarBtn.addEventListener('click', async () => {
            const url = prompt("Enter image/GIF URL for your avatar:");
            if (!url) return;
            await fetch(`${FIREBASE_URL}/users/${currentUser}/avatar.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify(url)
            });
            myAvatarDisplay.src = url;
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let text = messageInput.value.trim();
            if (!text && !mediaFileInput.files[0]) return;

            if (mediaFileInput.files && mediaFileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    sendMsgToFirebase(text, ev.target.result);
                };
                reader.readAsDataURL(mediaFileInput.files[0]);
                mediaFileInput.value = "";
                return;
            }

            sendMsgToFirebase(text, "");
        });

        async function sendMsgToFirebase(text, mediaUrl) {
            try {
                // Check send permission
                const allowed = await checkPermission(currentChannel, 'send');
                if (!allowed) {
                    alert("You do not have permission to send messages in this channel.");
                    return;
                }

                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const uData = await userRes.json();
                const avatar = uData?.avatar || generateDefaultAvatar(currentUser);

                await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'POST',
                    body: JSON.stringify({ user: currentUser, avatar, text, media: mediaUrl, time: Date.now() })
                });
                messageInput.value = '';
            } catch (err) {
                console.error(err);
            }
        }

        async function checkPermission(channelKey, action) {
            if (currentUser === "SStwendRT") return true;
            try {
                const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                const struct = await structRes.json();
                
                let chanObj = null;
                for (let catKey in struct.categories) {
                    if (struct.categories[catKey].channels && struct.categories[catKey].channels[channelKey]) {
                        chanObj = struct.categories[catKey].channels[channelKey];
                        break;
                    }
                }
                if (!chanObj) return true;

                const userRes = await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
                const uData = await userRes.json();
                const uRole = uData?.role || 'member';

                const perms = chanObj.permissions || {};
                const rolePerm = perms[uRole];

                if (rolePerm && rolePerm[action] === false) return false;
                return true;
            } catch (e) {
                return true;
            }
        }

        function showContextMenu(x, y, options) {
            contextMenu.innerHTML = '';
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'context-menu-item';
                if (opt === 'delete') {
                    div.style.color = 'red';
                    div.textContent = 'Delete';
                    div.onclick = () => handleDeleteTarget();
                } else if (opt === 'edit') {
                    div.textContent = 'Edit Name';
                    div.onclick = () => handleEditTarget();
                } else if (opt === 'permissions') {
                    div.style.color = 'yellow';
                    div.textContent = 'Permissions';
                    div.onclick = () => handlePermissionsTarget();
                } else if (opt === 'create-channel') {
                    div.textContent = 'Create Channel';
                    div.onclick = () => handleCreateChannelPrompt();
                } else if (opt === 'create-category') {
                    div.textContent = 'Create Category';
                    div.onclick = () => handleCreateCategoryPrompt();
                } else if (opt === 'roles') {
                    div.textContent = 'Manage Roles';
                    div.onclick = () => openRolesModal();
                }
                contextMenu.appendChild(div);
            });
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.style.display = 'block';
        }

        function startPolling() {
            fetchData();
            setInterval(fetchData, 3000);
        }

        async function fetchData() {
            try {
                const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
                const structure = await structRes.json() || { categories: {} };

                channelsContainer.innerHTML = '';
                let channelExists = false;

                Object.keys(structure.categories).forEach(catKey => {
                    const cat = structure.categories[catKey];
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category-group';

                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-header';
                    catHeader.innerHTML = `<span>▼ ${cat.name}</span>`;
                    
                    if (isAdmin) {
                        catHeader.oncontextmenu = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            contextTarget = { type: 'category', id: catKey, name: cat.name };
                            showContextMenu(e.clientX, e.clientY, ['create-channel', 'edit', 'delete']);
                        };
                    }
                    catDiv.appendChild(catHeader);

                    const chansContainer = document.createElement('div');
                    chansContainer.className = 'category-channels';

                    if (cat.channels) {
                        Object.keys(cat.channels).forEach(chKey => {
                            const ch = cat.channels[chKey];
                            if (chKey === currentChannel) channelExists = true;

                            const chDiv = document.createElement('div');
                            chDiv.className = `channel-item ${currentChannel === chKey ? 'active' : ''}`;
                            chDiv.innerHTML = `<span># ${ch.name}</span>`;
                            chDiv.onclick = async () => {
                                const canRead = await checkPermission(chKey, 'read');
                                if (!canRead) {
                                    alert("You do not have permission to view this channel.");
                                    return;
                                }
                                currentChannel = chKey;
                                activeChannelTitle.textContent = `# ${ch.name}`;
                                fetchData();
                            };

                            if (isAdmin) {
                                chDiv.oncontextmenu = (e) => {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    contextTarget = { type: 'channel', id: chKey, catId: catKey, name: ch.name };
                                    showContextMenu(e.clientX, e.clientY, ['edit', 'permissions', 'delete']);
                                };
                            }

                            chansContainer.appendChild(chDiv);
                        });
                    }
                    catDiv.appendChild(chansContainer);
                    channelsContainer.appendChild(catDiv);
                });

                if (!channelExists) currentChannel = 'general';

                // Check read permission for active channel
                const canReadActive = await checkPermission(currentChannel, 'read');
                if (!canReadActive) {
                    chatMessages.innerHTML = '<div style="padding:20px; color:red;">[ACCESS DENIED] You do not have permission to read this channel.</div>';
                    chatInputContainer.style.display = 'none';
                } else {
                    chatInputContainer.style.display = 'block';
                    const msgRes = await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
                    const messages = await msgRes.json() || {};
                    chatMessages.innerHTML = '';
                    Object.values(messages).sort((a, b) => a.time - b.time).forEach(msg => {
                        const date = new Date(msg.time);
                        const timeStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                        const div = document.createElement('div');
                        div.className = 'message';
                        let mediaHtml = msg.media ? (msg.media.includes('video') ? `<video src="${msg.media}" controls></video>` : `<img src="${msg.media}">`) : '';
                        div.innerHTML = `
                            <img class="msg-avatar" src="${msg.avatar || generateDefaultAvatar(msg.user)}" alt="">
                            <div class="msg-content">
                                <div><span class="msg-user">${escapeHtml(msg.user)}</span><span class="msg-time">${timeStr}</span></div>
                                <div class="msg-text">${escapeHtml(msg.text)}</div>
                                ${mediaHtml}
                            </div>
                        `;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                // Members & Roles
                const userRes = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
                const users = await userRes.json() || {};
                const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
                const roles = await rolesRes.json() || { member: { name: "member", color: "#ffffff" } };

                sidebarMembersContainer.innerHTML = '';
                const grouped = {};
                Object.keys(roles).forEach(rKey => { grouped[rKey] = []; });
                if (!grouped['member']) grouped['member'] = [];

                Object.keys(users).forEach(uname => {
                    const uData = users[uname];
                    const uRole = uData.role && roles[uData.role] ? uData.role : 'member';
                    if (!grouped[uRole]) grouped[uRole] = [];
                    grouped[uRole].push({ name: uname, ...uData });
                });

                Object.keys(roles).forEach(rKey => {
                    const rList = grouped[rKey] || [];
                    if (rList.length === 0 && rKey === 'member') return;

                    const sec = document.createElement('div');
                    sec.className = 'members-section';
                    const rColor = roles[rKey].color || '#ffffff';
                    sec.innerHTML = `<h3 style="color: ${rColor}">${roles[rKey].name.toUpperCase()} — ${rList.length}</h3>`;

                    rList.forEach(user => {
                        const mDiv = document.createElement('div');
                        mDiv.className = 'member-item';
                        mDiv.innerHTML = `
                            <img class="member-avatar-sm" src="${user.avatar || generateDefaultAvatar(user.name)}" alt="">
                            <span style="color: ${rColor}">${escapeHtml(user.name)}</span>
                        `;
                        if (isAdmin && user.name !== currentUser) {
                            mDiv.onclick = () => openAdminUserModal(user.name, user.ip);
                        }
                        sec.appendChild(mDiv);
                    });
                    sidebarMembersContainer.appendChild(sec);
                });

            } catch (err) {
                console.error(err);
            }
        }

        async function handleCreateCategoryPrompt() {
            const name = prompt("Category Name:");
            if (!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, "_") + "_" + Date.now();
            await fetch(`${FIREBASE_URL}/structure/categories/${key}.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify({ name, channels: {} })
            });
            fetchData();
        }

        async function handleCreateChannelPrompt() {
            if (!contextTarget || contextTarget.type !== 'category') return;
            const name = prompt("Channel Name:");
            if (!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9-_]/g, "");
            if (!key) return;

            await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}/channels/${key}.json?auth=${FIREBASE_TOKEN}`, {
                method: 'PUT',
                body: JSON.stringify({ name: key, permissions: {} })
            });
            fetchData();
        }

        async function handleEditTarget() {
            if (contextTarget.type === 'category') {
                const newName = prompt("Edit Category Name:", contextTarget.name);
                if (newName) {
                    await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}/name.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(newName)
                    });
                    fetchData();
                }
            } else if (contextTarget.type === 'channel') {
                const newName = prompt("Edit Channel Name:", contextTarget.name);
                if (newName) {
                    await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.catId}/channels/${contextTarget.id}/name.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(newName)
                    });
                    fetchData();
                }
            }
        }

        async function handleDeleteTarget() {
            if (!confirm(`Delete ${contextTarget.type} ${contextTarget.name || ''}?`)) return;
            if (contextTarget.type === 'category') {
                await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
            } else if (contextTarget.type === 'channel') {
                await fetch(`${FIREBASE_URL}/structure/categories/${contextTarget.catId}/channels/${contextTarget.id}.json?auth=${FIREBASE_TOKEN}`, { method: 'DELETE' });
            }
            fetchData();
        }

        async function handlePermissionsTarget() {
            if (contextTarget.type !== 'channel') return;
            const chKey = contextTarget.id;
            const catKey = contextTarget.catId;

            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || {};

            const chanRes = await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}.json?auth=${FIREBASE_TOKEN}`);
            const chanData = await chanRes.json() || {};
            const perms = chanData.permissions || {};

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            
            let rolesPermHtml = '';
            Object.keys(roles).forEach(rKey => {
                const rPerm = perms[rKey] || {};
                const canRead = rPerm.read !== false;
                const canSend = rPerm.send !== false;
                rolesPermHtml += `
                    <div style="border:1px solid #fff; padding:10px; margin-bottom:10px;">
                        <b>Role: ${roles[rKey].name}</b>
                        <div class="checkbox-group" style="margin-top:8px;">
                            <input type="checkbox" id="perm-read-${rKey}" ${canRead ? 'checked' : ''}> Can Read Channel
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="perm-send-${rKey}" ${canSend ? 'checked' : ''}> Can Send Messages
                        </div>
                    </div>
                `;
            });

            modal.innerHTML = `
                <div class="modal-card">
                    <h3>PERMISSIONS: #${contextTarget.name}</h3>
                    <div style="max-height: 250px; overflow-y:auto;">${rolesPermHtml}</div>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="save-perms">SAVE</button>
                        <button class="admin-panel-btn" id="close-perms">CANCEL</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);

            document.getElementById('close-perms').onclick = () => modal.remove();
            document.getElementById('save-perms').onclick = async () => {
                const newPerms = {};
                Object.keys(roles).forEach(rKey => {
                    newPerms[rKey] = {
                        read: document.getElementById(`perm-read-${rKey}`).checked,
                        send: document.getElementById(`perm-send-${rKey}`).checked
                    };
                });
                await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/permissions.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify(newPerms)
                });
                modal.remove();
                alert("Permissions updated!");
            };
        }

        async function openRolesModal() {
            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || {};

            let rolesHtml = '';
            Object.keys(roles).forEach(key => {
                rolesHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><b>${roles[key].name}</b> <span style="color:${roles[key].color}">${roles[key].color}</span></div>`;
            });

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>SERVER ROLES</h3>
                    <div style="margin-bottom: 15px; max-height: 150px; overflow-y:auto;">${rolesHtml}</div>
                    <button class="admin-panel-btn" id="create-role-btn" style="width:100%; margin-bottom:10px;">CREATE NEW ROLE</button>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="close-modal">CLOSE</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);

            document.getElementById('close-modal').onclick = () => modal.remove();
            document.getElementById('create-role-btn').onclick = async () => {
                const rName = prompt("Role Name:");
                if (!rName) return;
                const rColor = prompt("Role Color (Hex like #ffffff):", "#ffffff");
                const rKey = rName.toLowerCase().replace(/[^a-z0-9]/g, "");

                await fetch(`${FIREBASE_URL}/roles/${rKey}.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name: rName, color: rColor || "#ffffff" })
                });
                modal.remove();
                fetchData();
            };
        }

        async function openAdminUserModal(targetUser, targetIp) {
            const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
            const roles = await rolesRes.json() || {};

            let roleOpts = '';
            Object.keys(roles).forEach(r => {
                roleOpts += `<option value="${r}">${roles[r].name}</option>`;
            });

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>MANAGE USER: ${targetUser}</h3>
                    <div style="font-size: 12px; margin-bottom: 15px; color: #aaa;">IP Address: ${targetIp || 'Unknown'}</div>
                    <div class="input-group">
                        <label>ASSIGN ROLE</label>
                        <select id="assign-role-select">${roleOpts}</select>
                    </div>
                    <div class="modal-buttons">
                        <button class="admin-panel-btn" id="save-user-role">SAVE</button>
                        <button class="admin-panel-btn" id="ban-user-btn" style="border-color: red; color: red;">BAN IP</button>
                        <button class="admin-panel-btn" id="close-user-modal">CANCEL</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);

            document.getElementById('close-user-modal').onclick = () => modal.remove();
            document.getElementById('save-user-role').onclick = async () => {
                const selectedRole = document.getElementById('assign-role-select').value;
                await fetch(`${FIREBASE_URL}/users/${targetUser}/role.json?auth=${FIREBASE_TOKEN}`, {
                    method: 'PUT', body: JSON.stringify(selectedRole)
                });
                modal.remove();
                fetchData();
            };
            document.getElementById('ban-user-btn').onclick = async () => {
                if (confirm(`Ban IP ${targetIp}?`)) {
                    await fetch(`${FIREBASE_URL}/bans/${targetIp}.json?auth=${FIREBASE_TOKEN}`, {
                        method: 'PUT', body: JSON.stringify(true)
                    });
                    modal.remove();
                    fetchData();
                }
            };
        }

        function generateDefaultAvatar(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 40;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 40, 40);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(0, 0, 40, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name.charAt(0).toUpperCase(), 20, 20);
            return canvas.toDataURL();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
