<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paste</title>
<style>
:root{--bg:#0b0b0d;--panel:#121216;--panel2:#17171c;--line:#23232a;--text:#e6e6ea;--mute:#8a8a96;--acc:#ff3b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.5px;color:var(--text);text-decoration:none;font-size:18px}
.logo b{color:var(--acc)}
main{max-width:1000px;margin:28px auto;padding:0 20px}
input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font:inherit;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
textarea{height:380px;resize:vertical;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;margin-top:12px}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-block;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.primary:hover{background:#ff5555;border-color:#ff5555;color:#fff}
.danger:hover{background:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:none;padding:10px 16px}
.tabs button.on{background:var(--acc);color:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .15s}
.it:last-child{border-bottom:0}
.it:hover{background:var(--panel2)}
.it .info{flex:1;min-width:0;text-decoration:none;color:var(--text)}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .s{color:var(--mute);font-size:12px;margin-top:2px}
.it .act{display:flex;gap:6px;flex-shrink:0}
.mine{color:var(--acc);font-size:11px;border:1px solid var(--acc);border-radius:6px;padding:0 6px;margin-left:8px;vertical-align:middle}
.empty{padding:36px;text-align:center;color:var(--mute)}
.meta{color:var(--mute);font-size:13px;margin:6px 0 16px;word-break:break-word}
h1{margin:0;font-size:24px;word-break:break-word}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh;margin-top:18px}
.code pre{margin:0;padding:14px;font:13px/1.55 ui-monospace,Consolas,monospace}
.gut{color:var(--mute);text-align:right;border-right:1px solid var(--line);user-select:none;position:sticky;left:0;background:var(--panel)}
.err{color:var(--acc);margin-top:12px;word-break:break-word}
.key{font:12px ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--text)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:820px}
.modal h2{margin:0 0 14px;font-size:18px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);cursor:pointer;user-select:none}
label.chk input{accent-color:var(--acc);width:16px;height:16px}
@media(max-width:640px){.it{flex-wrap:wrap}.it .act{width:100%}}
</style>
</head>
<body>
<header>
<a class="logo" href="./">PASTE<b>.</b></a>
<button class="primary" id="newbtn">+ Новая запись</button>
</header>
<main id="app"></main>
<script>
var API="https://square-violet-0ff0.lvlyvcbcla.workers.dev";
var app=document.getElementById("app");
var id=new URLSearchParams(location.search).get("id")||"";

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function fmt(ts){return new Date(ts).toLocaleString()}
function key(i){return localStorage.getItem("k:"+i)}
function rawUrl(i){return API+"/raw/"+i}
function ls(i){return 'loadstring(game:HttpGet("'+rawUrl(i)+'"))()'}

function api(path,opt){
return fetch(API+path,opt).then(function(r){
return r.text().then(function(t){
var j;try{j=JSON.parse(t)}catch(e){j={error:t.slice(0,120)}}
if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
return j
})
},function(){throw new Error("нет связи с воркером")})
}

function copy(t,b){
navigator.clipboard.writeText(t).then(function(){
var o=b.textContent;b.textContent="Готово";
setTimeout(function(){b.textContent=o},1000)
})
}

function modal(p){
var ov=el("div","ov");
var m=el("div","modal");
m.appendChild(el("h2","",p?"Редактирование":"Новая запись"));
var t=el("input");t.type="text";t.placeholder="Название";t.maxLength=100;
var c=el("textarea");c.placeholder="Вставь код сюда";c.spellcheck=false;
if(p){t.value=p.title||"";c.value=p.content}
c.addEventListener("keydown",function(e){
if(e.key==="Tab"){
e.preventDefault();
var s=c.selectionStart;
c.value=c.value.slice(0,s)+"\t"+c.value.slice(c.selectionEnd);
c.selectionStart=c.selectionEnd=s+1
}
});
var er=el("div","err");
var r=el("div","row");r.style.marginTop="14px";
var b=el("button","primary",p?"Сохранить":"Опубликовать");
var x=el("button","","Отмена");
r.append(b,x);
var chk;
if(!p){
var l=el("label","chk");
chk=document.createElement("input");chk.type="checkbox";chk.checked=true;
l.append(chk,document.createTextNode("Показывать в списке"));
r.appendChild(l)
}
function close(){document.removeEventListener("keydown",esc);ov.remove()}
function esc(e){if(e.key==="Escape")close()}
document.addEventListener("keydown",esc);
x.onclick=close;
ov.addEventListener("mousedown",function(e){if(e.target===ov)close()});
b.onclick=function(){
if(!c.value.trim()){er.textContent="Пусто";return}
b.disabled=true;er.textContent="";
var req;
if(p){
req=api("/api/paste/"+p.id,{method:"PUT",headers:{"content-type":"application/json","x-key":key(p.id)||""},body:JSON.stringify({title:t.value,content:c.value})}).then(function(){return p.id})
}else{
req=api("/api/paste",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:t.value,content:c.value,listed:chk.checked})}).then(function(j){localStorage.setItem("k:"+j.id,j.key);return j.id})
}
req.then(function(i){location.href="?id="+i}).catch(function(e){b.disabled=false;er.textContent=e.message})
};
m.append(t,c,r,er);
ov.appendChild(m);
document.body.appendChild(ov);
t.focus()
}

function editById(i){
api("/api/paste/"+i).then(function(p){p.id=i;modal(p)}).catch(function(e){alert(e.message)})
}

function home(){
var data=[],tab="all";
var bar=el("div","bar");
var s=el("input");s.type="text";s.placeholder="Поиск по названию или ID";
var tabs=el("div","tabs");
var t1=el("button","on","Все"),t2=el("button","","Мои");
tabs.append(t1,t2);
bar.append(s,tabs);
var box=el("div","list");
app.append(bar,box);
box.appendChild(el("div","empty","Загрузка"));

function draw(){
var f=s.value.toLowerCase();
var a=data.filter(function(p){
if(tab==="mine"&&!key(p.id))return false;
return !f||(p.title||"").toLowerCase().indexOf(f)>-1||p.id.toLowerCase().indexOf(f)>-1
});
box.textContent="";
if(!a.length){box.appendChild(el("div","empty",tab==="mine"?"У тебя пока нет записей":"Ничего не найдено"));return}
a.forEach(function(p){
var it=el("div","it");
var info=el("a","info");info.href="?id="+p.id;
var tt=el("div","t",p.title||"Без названия");
if(key(p.id))tt.appendChild(el("span","mine","моя"));
info.append(tt,el("div","s",fmt(p.created)+" · "+p.lines+" строк · "+p.id));
var act=el("div","act");
var raw=el("a","btn sm","Raw");raw.href=rawUrl(p.id);raw.target="_blank";
var lb=el("button","sm","loadstring");lb.onclick=function(){copy(ls(p.id),lb)};
act.append(raw,lb);
if(key(p.id)){
var eb=el("button","sm","Изменить");eb.onclick=function(){editById(p.id)};
act.appendChild(eb)
}
it.append(info,act);
box.appendChild(it)
})
}

s.oninput=draw;
t1.onclick=function(){tab="all";t1.className="on";t2.className="";draw()};
t2.onclick=function(){tab="mine";t2.className="on";t1.className="";draw()};
api("/api/list").then(function(a){data=a;draw()}).catch(function(e){box.textContent="";box.appendChild(el("div","err",e.message))})
}

function view(){
api("/api/paste/"+id).then(function(p){
document.title=p.title||id;
var k=key(id);
var ln=p.content.split("\n");
var n=[];for(var i=1;i<=ln.length;i++)n.push(i);
var back=el("a","btn sm","← К списку");back.href="./";
app.appendChild(back);
var h=el("h1","",p.title||"Без названия");h.style.marginTop="16px";
app.appendChild(h);
var meta=fmt(p.created)+" · "+ln.length+" строк · "+p.content.length+" символов";
if(p.edited)meta+=" · изменено "+fmt(p.edited);
if(!p.listed)meta+=" · скрыто из списка";
app.appendChild(el("div","meta",meta));
var r=el("div","row");
var b1=el("button","","Копировать код");b1.onclick=function(){copy(p.content,b1)};
var b2=el("a","btn","Raw");b2.href=rawUrl(id);b2.target="_blank";
var b3=el("button","","Копировать loadstring");b3.onclick=function(){copy(ls(id),b3)};
r.append(b1,b2,b3);
if(k){
var e=el("button","","Изменить");e.onclick=function(){p.id=id;modal(p)};
var d=el("button","danger","Удалить");
d.onclick=function(){
if(!confirm("Удалить запись?"))return;
api("/api/paste/"+id,{method:"DELETE",headers:{"x-key":k}}).then(function(){
localStorage.removeItem("k:"+id);location.href="./"
}).catch(function(x){alert(x.message)})
};
r.append(e,d)
}else{
var kb=el("button","","Ввести ключ");
kb.onclick=function(){
var v=prompt("Ключ редактирования");
if(v){localStorage.setItem("k:"+id,v.trim());location.reload()}
};
r.appendChild(kb)
}
app.appendChild(r);
if(k){
var kl=el("div","meta","Ключ редактирования: ");kl.style.marginTop="14px";
kl.appendChild(el("span","key",k));
app.appendChild(kl)
}
var box=el("div","code");
box.append(el("pre","gut",n.join("\n")),el("pre","",p.content));
app.appendChild(box)
}).catch(function(e){
app.appendChild(el("h1","","Не найдено"));
app.appendChild(el("div","err",e.message))
})
}

document.getElementById("newbtn").onclick=function(){modal()};
if(/^[A-Za-z0-9]{8}$/.test(id))view();else home();
</script>
</body>
</html>
