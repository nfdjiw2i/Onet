<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Chat - Ultimate Edition v8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',Courier,monospace;user-select:none;color:#fff}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
.hidden{display:none!important}
#auth-screen{display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;position:fixed;top:0;left:0;background:#000;z-index:3000}
.auth-card{border:1px solid #fff;padding:40px;width:360px;background:#000}
.auth-card h2{margin-bottom:25px;text-align:center;letter-spacing:2px;font-size:20px}
.input-group{margin-bottom:18px}
.input-group label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:1px;color:#ccc}
.input-group input,.input-group select,.input-group textarea{width:100%;background:#000;border:1px solid #fff;color:#fff;padding:10px;font-size:14px;outline:none}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{background:#0a0a0a}
.auth-btn{width:100%;background:#000;border:1px solid #fff;color:#fff;padding:11px;cursor:pointer;font-size:14px;letter-spacing:1px;margin-top:8px;transition:background .15s,color .15s}
.auth-btn:hover{background:#fff;color:#000}
.switch-auth{margin-top:16px;text-align:center;font-size:12px;cursor:pointer;text-decoration:underline;color:#ccc}
.switch-auth:hover{color:#fff}
#app-screen{display:flex;height:100vh;width:100vw}
.sidebar-channels{width:260px;border-right:1px solid #fff;display:flex;flex-direction:column;background:#000;flex-shrink:0}
.server-header{padding:16px 18px;border-bottom:1px solid #fff;font-weight:bold;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;position:relative;cursor:pointer}
.server-header:hover{background:#0a0a0a}
.channels-list{padding:10px 8px;flex-grow:1;overflow-y:auto}
.category-group{margin-bottom:12px}
.category-group.dragging{opacity:.35}
.category-header{font-size:11px;letter-spacing:1px;color:#aaa;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;cursor:pointer}
.category-header:hover{color:#fff;background:#111}
.category-channels{padding-left:6px;margin-top:3px;display:flex;flex-direction:column;gap:1px;min-height:8px}
.channel-item{padding:6px 10px;cursor:pointer;font-size:13px;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid transparent;border-radius:2px}
.channel-item.dragging{opacity:.35}
.channel-item:hover{background:#111;border-color:#333}
.channel-item.active{background:#1a1a1a;border-color:#fff}
.channel-actions{display:none;gap:4px}
.channel-item:hover .channel-actions{display:flex}
.channel-action-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:13px;padding:0 2px}
.user-profile{padding:12px 14px;border-top:1px solid #fff;font-size:12px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#000}
.user-profile:hover{background:#111}
.user-avatar-sm{width:36px;height:36px;border:1px solid #fff;object-fit:cover;background:#222;flex-shrink:0}
.user-info-text{flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.logout-btn{background:none;border:1px solid #fff;color:#fff;padding:4px 8px;font-size:10px;cursor:pointer;letter-spacing:.5px}
.logout-btn:hover{background:#fff;color:#000}
.chat-area{flex-grow:1;display:flex;flex-direction:column;background:#000;min-width:0}
.chat-header{padding:16px 20px;border-bottom:1px solid #fff;font-size:14px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.channel-settings-gear{cursor:pointer;font-size:16px;background:none;border:none;color:#fff;padding:4px 8px}
.channel-settings-gear:hover{background:#111}
.chat-messages{flex-grow:1;padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.message{font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;position:relative;padding:4px 6px;border-radius:2px}
.message:hover{background:#0a0a0a}
.msg-avatar{width:40px;height:40px;border:1px solid #fff;object-fit:cover;background:#222;flex-shrink:0}
.msg-content{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.msg-header-row{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.message .msg-user{font-weight:bold;font-size:13px}
.message .msg-time{font-size:10px;color:#888}
.message .msg-text{word-break:break-word;white-space:pre-wrap}
.message img,.message video{max-width:320px;max-height:260px;border:1px solid #fff;margin-top:8px;display:block;object-fit:contain}
.msg-actions{display:none;position:absolute;right:8px;top:4px;gap:4px}
.message:hover .msg-actions{display:flex}
.msg-action-btn{background:#000;border:1px solid #fff;color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
.msg-action-btn:hover{background:#fff;color:#000}
.chat-input-area{padding:16px 20px;border-top:1px solid #fff}
.chat-input-form{display:flex;border:1px solid #fff;align-items:stretch}
.file-upload-label{padding:0 14px;cursor:pointer;border-right:1px solid #fff;font-size:18px;display:flex;align-items:center;color:#fff;background:#000}
.file-upload-label:hover{background:#fff;color:#000}
.chat-input-form input[type=text]{flex-grow:1;background:#000;border:none;color:#fff;padding:12px 14px;font-size:14px;outline:none}
.chat-input-form button[type=submit]{background:#000;border-left:1px solid #fff;color:#fff;padding:0 22px;cursor:pointer;font-size:13px;letter-spacing:1px;transition:background .15s,color .15s}
.chat-input-form button[type=submit]:hover{background:#fff;color:#000}
.sidebar-members{width:240px;border-left:1px solid #fff;padding:16px 14px;background:#000;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex-shrink:0}
.members-section h3{font-size:11px;letter-spacing:1px;margin-bottom:8px;color:#aaa}
.member-item{font-size:13px;margin-bottom:6px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border:1px solid transparent}
.member-item:hover{border-color:#fff;background:#111}
.member-avatar-sm{width:28px;height:28px;border:1px solid #fff;object-fit:cover;background:#222}
#context-menu{position:fixed;background:#000;border:1px solid #fff;padding:4px 0;z-index:5000;min-width:180px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.6)}
#server-dropdown-menu{position:absolute;top:100%;left:0;right:0;background:#000;border:1px solid #fff;padding:4px 0;z-index:5000;display:none}
.context-menu-item{padding:8px 14px;font-size:12px;cursor:pointer;letter-spacing:.5px}
.context-menu-item:hover{background:#fff;color:#000}
.context-menu-item.danger{color:#ff5555}
.context-menu-item.danger:hover{background:#ff5555;color:#000}
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:4000}
.modal-card{background:#000;border:1px solid #fff;padding:28px;width:560px;max-height:85vh;overflow-y:auto}
.modal-card h3{margin-bottom:18px;font-size:16px;letter-spacing:1px}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.admin-panel-btn{background:#000;border:1px solid #fff;color:#fff;padding:9px 14px;font-size:12px;cursor:pointer;letter-spacing:1px;flex-grow:1;text-align:center}
.admin-panel-btn:hover{background:#fff;color:#000}
.admin-panel-btn.danger{border-color:#ff5555;color:#ff5555}
.admin-panel-btn.danger:hover{background:#ff5555;color:#000}
.empty-state{padding:40px 20px;text-align:center;color:#666;font-size:13px}
.access-denied{padding:30px 20px;text-align:center;color:#ff5555;font-size:14px;letter-spacing:1px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#333;border:1px solid #555}
::-webkit-scrollbar-thumb:hover{background:#555}
</style>
</head>
<body>
<div id="context-menu"></div>
<div id="auth-screen">
<div class="auth-card">
<h2 id="auth-title">AUTHORIZATION</h2>

</div>

<input type="file" id="media-file-input" accept="image/*,video/*" style="display:none">

</div>
<div class="sidebar-members" id="sidebar-members-container"></div>
</div>
<div id="modal-container"></div>
<script>
const FIREBASE_URL="https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
const FIREBASE_TOKEN="87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";
const OWNER="SStwendRT";
let isRegistering=false,currentUser=localStorage.getItem('chat_user')||null,userIp="unknown",currentChannel="general",currentChannelCatKey="general_cat",isAdmin=false,contextTarget=null,lastMessagesHash="",isPolling=false;
let cachedAvatar="", cachedBio="", lastMessageTime=0;
const userIpPromise=fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{userIp=d.ip||"unknown";return userIp}).catch(()=>{userIp="unknown";return"unknown"});
const authScreen=document.getElementById('auth-screen'),appScreen=document.getElementById('app-screen'),authTitle=document.getElementById('auth-title'),authSubmitBtn=document.getElementById('auth-submit-btn'),switchAuthMode=document.getElementById('switch-auth-mode'),authForm=document.getElementById('auth-form'),usernameInput=document.getElementById('username-input'),passwordInput=document.getElementById('password-input'),currentUsernameDisplay=document.getElementById('current-username-display'),currentUserDesc=document.getElementById('current-user-desc'),myAvatarDisplay=document.getElementById('my-avatar-display'),userProfileBar=document.getElementById('user-profile-bar'),logoutBtn=document.getElementById('logout-btn'),serverGearBtn=document.getElementById('server-gear-btn'),serverDropdownMenu=document.getElementById('server-dropdown-menu'),serverMenuEditRoles=document.getElementById('server-menu-edit-roles'),serverMenuEditServer=document.getElementById('server-menu-edit-server'),channelGearBtn=document.getElementById('channel-gear-btn'),serverTitleDisplay=document.getElementById('server-title-display'),chatForm=document.getElementById('chat-form'),messageInput=document.getElementById('message-input'),chatMessages=document.getElementById('chat-messages'),channelsContainer=document.getElementById('channels-container'),sidebarChannelsPanel=document.getElementById('sidebar-channels-panel'),sidebarMembersContainer=document.getElementById('sidebar-members-container'),activeChannelTitle=document.getElementById('active-channel-title'),mediaFileInput=document.getElementById('media-file-input'),fileUploadLabel=document.querySelector('.file-upload-label'),contextMenu=document.getElementById('context-menu'),chatInputContainer=document.getElementById('chat-input-container');

fileUploadLabel.addEventListener('click',()=>mediaFileInput.click());
document.addEventListener('click',()=>{contextMenu.style.display='none';serverDropdownMenu.style.display='none'});
sidebarChannelsPanel.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();if(!isAdmin)return;contextTarget={type:'sidebar'};showContextMenu(e.clientX,e.clientY,['create-channel','create-category','edit-roles'])});
serverGearBtn.addEventListener('click',e=>{e.stopPropagation();if(!isAdmin){alert("Only administrators can manage server settings.");return}serverDropdownMenu.style.display=serverDropdownMenu.style.display==='block'?'none':'block'});
serverMenuEditRoles.addEventListener('click',e=>{e.stopPropagation();serverDropdownMenu.style.display='none';openRolesModal()});
serverMenuEditServer.addEventListener('click',e=>{e.stopPropagation();serverDropdownMenu.style.display='none';handleCreateCommunityPrompt()});
channelGearBtn.addEventListener('click',e=>{e.stopPropagation();if(!isAdmin){alert("Only administrators can change channel settings.");return}openChannelSettingsModal(currentChannelCatKey,currentChannel)});
if(currentUser)checkBanAndInitialize();

switchAuthMode.addEventListener('click',()=>{isRegistering=!isRegistering;authTitle.textContent=isRegistering?"REGISTRATION":"AUTHORIZATION";authSubmitBtn.textContent=isRegistering?"REGISTER":"LOGIN";switchAuthMode.textContent=isRegistering?"Already have an account? Login":"Need an account? Register"});

authForm.addEventListener('submit',async e=>{
e.preventDefault();
e.stopPropagation();
const username=usernameInput.value.trim(),password=passwordInput.value.trim();
if(!username||!password)return false;
if(username.length<2){alert("Username must be at least 2 characters.");return false;}
try{
await userIpPromise;
if(isRegistering && userIp && userIp !== "unknown"){
try {
const banRes=await fetch(`${FIREBASE_URL}/bans/${userIp.replace(/[.#$\/\[\]]/g, '_')}.json?auth=${FIREBASE_TOKEN}`);
const banData=await banRes.json();
if(banData === true || (banData && typeof banData === 'object' && banData.banned)){
alert("Access denied: IP banned.");
return false;
}
} catch(err) {}
}

const res=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await res.json()||{};
if(isRegistering){
if(users[username]){alert("Username already exists.");return false;}
const isFirstUser=Object.keys(users).length===0;
await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({password,ip:userIp,avatar:"",bio:isFirstUser?"Server Owner":"Member",role:isFirstUser||username===OWNER?"admin":"member",joined:Date.now()})});
if(isFirstUser)await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({admin:{name:"Admin",color:"#ff5555"},member:{name:"Member",color:"#ffffff"}})});
}else{
if(!users[username]||users[username].password!==password){alert("Invalid username or password.");return false;}
await fetch(`${FIREBASE_URL}/users/${username}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
}
currentUser=username;localStorage.setItem('chat_user',currentUser);checkBanAndInitialize();
}catch(err){alert("Connection error. Please try again.");console.error(err);}
return false;
});

logoutBtn.addEventListener('click',e=>{e.stopPropagation();localStorage.removeItem('chat_user');currentUser=null;isAdmin=false;appScreen.classList.add('hidden');authScreen.classList.remove('hidden');usernameInput.value='';passwordInput.value=''});

async function checkBanAndInitialize(){
try{
await userIpPromise;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const userData=await userRes.json();
if(!userData){localStorage.removeItem('chat_user');currentUser=null;return}
await fetch(`${FIREBASE_URL}/users/${currentUser}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
isAdmin=(userData.role==="admin"||currentUser===OWNER);
authScreen.classList.add('hidden');appScreen.classList.remove('hidden');currentUsernameDisplay.textContent=currentUser;
const sNameRes=await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`);serverTitleDisplay.textContent=(await sNameRes.json())||"MAIN SERVER";
const rootRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
if(!await rootRes.json())await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({categories:{general_cat:{name:"TEXT CHANNELS",order:0,channels:{general:{name:"general",topic:"General chat",order:0,permissions:{}}}}}})});
const rolesCheck=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
if(!await rolesCheck.json())await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({admin:{name:"Admin",color:"#ff5555"},member:{name:"Member",color:"#ffffff"}})});
fetchUserDataAndAvatar();startPolling();
}catch(err){console.error(err);alert("Failed to initialize. Check connection.")}
}

async function fetchUserDataAndAvatar(){
try{
const res=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const data=await res.json();
cachedAvatar=data?.avatar||"";
cachedBio=data?.bio||"No description";
myAvatarDisplay.src=cachedAvatar||generateDefaultAvatar(currentUser);
currentUsernameDisplay.textContent=currentUser;
currentUserDesc.textContent=cachedBio;
}catch(e){}
}

userProfileBar.addEventListener('click',async()=>{
try{
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const userData=await userRes.json()||{};
let currentAvatar=userData.avatar||"",currentName=currentUser,currentBio=userData.bio||"";
const modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML=`<div class="modal-card" style="width:460px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3>MY PROFILE</h3><button id="close-profile-modal" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px">✕</button></div><div style="display:flex;gap:20px;align-items:flex-start;margin-bottom:18px"><div style="text-align:center"><img id="profile-modal-avatar" src="${currentAvatar||generateDefaultAvatar(currentName)}" style="width:72px;height:72px;border:1px solid #fff;object-fit:cover;cursor:pointer"><div style="font-size:10px;color:#888;margin-top:5px">Change Avatar</div></div><div style="flex-grow:1" class="input-group"><label>USERNAME</label><input type="text" id="profile-modal-name" value="${escapeHtml(currentName)}" maxlength="24"></div></div><div class="input-group"><label>PROFILE BIO</label><textarea id="profile-modal-bio" rows="4" maxlength="200">${escapeHtml(currentBio)}</textarea></div><div class="modal-buttons" id="profile-save-container" style="display:none"><button class="admin-panel-btn" id="save-profile-btn">SAVE CHANGES</button></div></div>`;
document.getElementById('modal-container').appendChild(modal);
const avatarImg=modal.querySelector('#profile-modal-avatar'),nameInput=modal.querySelector('#profile-modal-name'),bioInput=modal.querySelector('#profile-modal-bio'),saveContainer=modal.querySelector('#profile-save-container');
let newAvatarVal=currentAvatar;
function checkForChanges(){saveContainer.style.display=(nameInput.value.trim()!==currentName||bioInput.value!==currentBio||newAvatarVal!==currentAvatar)?'flex':'none'}
nameInput.addEventListener('input',checkForChanges);bioInput.addEventListener('input',checkForChanges);
avatarImg.onclick=()=>{const url=prompt("Enter new avatar URL (or leave blank to reset):",newAvatarVal);if(url!==null){newAvatarVal=url.trim();avatarImg.src=newAvatarVal||generateDefaultAvatar(nameInput.value||currentUser);checkForChanges()}};
modal.querySelector('#close-profile-modal').onclick=()=>modal.remove();
modal.querySelector('#save-profile-btn').onclick=async()=>{
const targetNewName=nameInput.value.trim(),targetNewBio=bioInput.value;
if(!targetNewName||targetNewName.length<2){alert("Username must be at least 2 characters.");return}
try{
if(targetNewName!==currentUser){
const checkRes=await fetch(`${FIREBASE_URL}/users/${targetNewName}.json?auth=${FIREBASE_TOKEN}`);
if(await checkRes.json()){alert("This username is already taken.");return}
await fetch(`${FIREBASE_URL}/users/${targetNewName}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({...userData,bio:targetNewBio,avatar:newAvatarVal})});
await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});
currentUser=targetNewName;localStorage.setItem('chat_user',currentUser);
}else{
await fetch(`${FIREBASE_URL}/users/${currentUser}/bio.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(targetNewBio)});
await fetch(`${FIREBASE_URL}/users/${currentUser}/avatar.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(newAvatarVal)});
}
modal.remove();fetchUserDataAndAvatar();fetchData();
}catch(err){alert("Failed to save profile.")}
};
}catch(e){alert("Error opening profile.")}
});

async function openMemberProfileModal(username, userData) {
try {
const modal = document.createElement('div');
modal.className = 'modal-overlay';
const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles = await rolesRes.json()||{};
let roleOptions = '';
Object.keys(roles).forEach(rKey => {
roleOptions += `<option value="${rKey}" ${userData.role === rKey ? 'selected' : ''}>${roles[rKey].name}</option>`;
});

modal.innerHTML = `
<div class="modal-card" style="width:420px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3>USER PROFILE</h3>

  </div>
  <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">
    <img src="${userData.avatar || generateDefaultAvatar(username)}" style="width:60px;height:60px;border:1px solid #fff;object-fit:cover">
    <div>
      <div style="font-weight:bold;font-size:15px">${escapeHtml(username)}</div>
      <div style="font-size:11px;color:#888;margin-top:4px">Joined: ${new Date(userData.joined || Date.now()).toLocaleDateString()}</div>
    </div>
  </div>
  <div class="input-group">
    <label>BIO</label>
    <div style="padding:8px;border:1px solid #333;font-size:13px;background:#0a0a0a;min-height:40px">${escapeHtml(userData.bio || 'No description')}</div>
  </div>
  ${isAdmin && username !== currentUser ? `
  <div class="input-group">
    <label>CHANGE ROLE</label>
    <select id="member-role-select">${roleOptions}</select>
  </div>
  <div class="modal-buttons" style="flex-direction:column;gap:8px">
    <button class="admin-panel-btn" id="save-member-role-btn">UPDATE ROLE</button>
    <button class="admin-panel-btn danger" id="ban-member-btn">BAN USER (IP)</button>
  </div>` : ''}
</div>`;

document.getElementById('modal-container').appendChild(modal);
modal.querySelector('#close-member-modal').onclick = () => modal.remove();

if (isAdmin && username !== currentUser) {
modal.querySelector('#save-member-role-btn').onclick = async () => {
const newRole = modal.querySelector('#member-role-select').value;
await fetch(`${FIREBASE_URL}/users/${username}/role.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(newRole)});
modal.remove();
fetchData();
};
modal.querySelector('#ban-member-btn').onclick = async () => {
if(!confirm(`Are you sure you want to ban ${username}?`)) return;
try {
const ipToBan = userData.ip || "unknown";
if(ipToBan !== "unknown") {
await fetch(`${FIREBASE_URL}/bans/${ipToBan.replace(/[.#$\/\[\]]/g, '_')}.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(true)});
}
await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`, {method:'DELETE'});
modal.remove();
fetchData();
} catch(e) { alert("Failed to ban user."); }
};
}
} catch(e) { alert("Error opening member profile."); }
}

function handleCreateChannelPrompt(catKey) {
const targetCat = catKey || currentChannelCatKey;
const name = prompt("Enter new channel name:");
if(!name) return;
const formattedName = name.trim().toLowerCase().replace(/\s+/g, '-');
if(!formattedName) return;
fetch(`${FIREBASE_URL}/structure/categories/${targetCat}/channels.json?auth=${FIREBASE_TOKEN}`, {
method:'POST',
body:JSON.stringify({name:formattedName, topic:"", cooldown:0, order:99, permissions:{}})
}).then(() => fetchData()).catch(() => alert("Failed to create channel."));
}

function handleCreateCategoryPrompt() {
const name = prompt("Enter new category name:");
if(!name) return;
const catKey = 'cat_' + Date.now();
fetch(`${FIREBASE_URL}/structure/categories/${catKey}.json?auth=${FIREBASE_TOKEN}`, {
method:'PUT',
body:JSON.stringify({name:name.trim().toUpperCase(), order:99, channels:{}})
}).then(() => fetchData()).catch(() => alert("Failed to create category."));
}

function handleCreateCommunityPrompt() {
const name = prompt("Enter new server name:", serverTitleDisplay.textContent);
if(!name) return;
fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(name.trim())})
.then(() => { serverTitleDisplay.textContent = name.trim(); }).catch(() => alert("Failed to update server name."));
}

chatForm.addEventListener('submit', async e => {
e.preventDefault();
let text = messageInput.value.trim();
if(!text && !mediaFileInput.files[0]) return;

let mediaUrl = "";
if(mediaFileInput.files && mediaFileInput.files[0]) {
const file = mediaFileInput.files[0];
if(file.size > 4*1024*1024) { alert("File is too large (max 4 MB)."); mediaFileInput.value=""; return; }
const reader = new FileReader();
reader.onload = async ev => {
mediaUrl = ev.target.result;
mediaFileInput.value="";
executeOptimisticSend(text, mediaUrl);
};
reader.readAsDataURL(file);
return;
}
messageInput.value = '';
executeOptimisticSend(text, "");
});

function executeOptimisticSend(text, mediaUrl) {
const time = Date.now();
const avatar = cachedAvatar || generateDefaultAvatar(currentUser);
const tempId = 'temp_' + time + '_' + Math.random().toString(36).substring(2, 7);

const date = new Date(time);
const timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div = document.createElement('div');
div.className = 'message';
div.dataset.msgid = tempId;
let mediaHtml = '';
if(mediaUrl) mediaHtml = (mediaUrl.startsWith('data:video') || mediaUrl.includes('video')) ? `<video src="${mediaUrl}" controls></video>` : `<img src="${mediaUrl}" alt="media">`;
div.innerHTML = `<img class="msg-avatar" src="${avatar}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(currentUser)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${escapeHtml(text)}</div>${mediaHtml}</div>`;

const emptyState = chatMessages.querySelector('.empty-state');
if(emptyState) emptyState.remove();
chatMessages.appendChild(div);
chatMessages.scrollTop = chatMessages.scrollHeight;

lastMessageTime = time;

fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`, {
method:'POST',
body:JSON.stringify({user:currentUser, avatar, text, media:mediaUrl, time})
}).then(() => {
lastMessagesHash = ""; 
}).catch(err => console.error("Background send failed:", err));
}

async function checkPermission(channelKey,action){
if(isAdmin)return true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const struct=await structRes.json();
let chanObj=null;
for(let catKey in struct.categories){if(struct.categories[catKey].channels&&struct.categories[catKey].channels[channelKey]){chanObj=struct.categories[catKey].channels[channelKey];break}}
if(!chanObj)return true;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const uData=await userRes.json();
const uRole=uData?.role||'member';
const perms=chanObj.permissions||{};
if(perms.users&&perms.users[currentUser]&&perms.users[currentUser][action]!==undefined)return perms.users[currentUser][action];
const rolePerm=perms[uRole];
if(rolePerm&&rolePerm[action]===false)return false;
return true;
}catch(e){return true}
}

async function openChannelSettingsModal(catKey, chKey) {
try {
const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const struct = await structRes.json();
const channel = struct.categories[catKey]?.channels[chKey];
if(!channel) return;

const modal = document.createElement('div');
modal.className = 'modal-overlay';
modal.innerHTML = `
<div class="modal-card" style="width:460px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3>CHANNEL SETTINGS: #${escapeHtml(channel.name)}</h3>
    <button id="close-ch-settings" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px">✕</button>
  </div>
  <div class="input-group">
    <label>CHANNEL NAME</label>
    <input type="text" id="ch-set-name" value="${escapeHtml(channel.name)}" maxlength="32">
  </div>
  <div class="input-group">
    <label>TOPIC / DESCRIPTION</label>
    <input type="text" id="ch-set-topic" value="${escapeHtml(channel.topic || '')}" maxlength="100">
  </div>
  <div class="input-group">
    <label>MESSAGE COOLDOWN (SECONDS, 0 = OFF)</label>
    <input type="number" id="ch-set-cooldown" value="${channel.cooldown || 0}" min="0" max="3600">
  </div>
  <div class="modal-buttons">
    <button class="admin-panel-btn" id="save-ch-settings-btn">SAVE SETTINGS</button>
  </div>
</div>`;
document.getElementById('modal-container').appendChild(modal);

modal.querySelector('#close-ch-settings').onclick = () => modal.remove();
modal.querySelector('#save-ch-settings-btn').onclick = async () => {
const newName = modal.querySelector('#ch-set-name').value.trim().toLowerCase().replace(/\s+/g, '-');
const newTopic = modal.querySelector('#ch-set-topic').value.trim();
const newCooldown = parseInt(modal.querySelector('#ch-set-cooldown').value) || 0;
if(!newName) { alert("Channel name cannot be empty."); return; }
try {
await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/name.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(newName)});
await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/topic.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(newTopic)});
await fetch(`${FIREBASE_URL}/structure/categories/${catKey}/channels/${chKey}/cooldown.json?auth=${FIREBASE_TOKEN}`, {method:'PUT', body:JSON.stringify(newCooldown)});
modal.remove();
fetchData();
} catch(e) { alert("Failed to save channel settings."); }
};
} catch(e) { alert("Error opening channel settings."); }
}

function showContextMenu(x,y,options){
contextMenu.innerHTML='';
options.forEach(opt=>{
const div=document.createElement('div');div.className='context-menu-item';
if(opt==='delete'){div.classList.add('danger');div.textContent='Delete';div.onclick=()=>handleDeleteTarget()}
else if(opt==='edit'){div.textContent='Edit Settings';div.onclick=()=>handleEditTarget()}
else if(opt==='permissions'){div.textContent='Permissions';div.onclick=()=>handlePermissionsTarget()}
else if(opt==='create-channel'){div.textContent='Create Channel';div.onclick=()=>handleCreateChannelPrompt(contextTarget&&contextTarget.type==='category'?contextTarget.id:null)}
else if(opt==='create-category'){div.textContent='Create Category';div.onclick=()=>handleCreateCategoryPrompt()}
else if(opt==='edit-roles'){div.textContent='Edit Roles';div.onclick=()=>openRolesModal()}
contextMenu.appendChild(div);
});
contextMenu.style.left=`${Math.min(x,window.innerWidth-200)}px`;contextMenu.style.top=`${Math.min(y,window.innerHeight-150)}px`;contextMenu.style.display='block';
}

function startPolling(){fetchData();setInterval(fetchData,2500)}

async function fetchData(){
if(isPolling)return;isPolling=true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
channelsContainer.innerHTML='';let channelExists=false;
const sortedCategories=Object.keys(structure.categories||{}).sort((a,b)=>(structure.categories[a].order||0)-(structure.categories[b].order||0));
sortedCategories.forEach(catKey=>{
const cat=structure.categories[catKey];
const catDiv=document.createElement('div');catDiv.className='category-group';catDiv.draggable=isAdmin;catDiv.dataset.catKey=catKey;
catDiv.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({type:'category',key:catKey}));catDiv.classList.add('dragging')});
catDiv.addEventListener('dragend',()=>catDiv.classList.remove('dragging'));
catDiv.addEventListener('dragover',e=>e.preventDefault());
catDiv.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();const data=JSON.parse(e.dataTransfer.getData('text/plain')||'{}');if(data.type==='category'&&data.key!==catKey)await reorderCategories(data.key,catKey,sortedCategories)});
const catHeader=document.createElement('div');catHeader.className='category-header';catHeader.innerHTML=`<span>▼ ${escapeHtml(cat.name)}</span>`;
catHeader.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();if(!isAdmin)return;contextTarget={type:'category',id:catKey,name:cat.name};showContextMenu(e.clientX,e.clientY,['create-channel','edit','delete'])};
catDiv.appendChild(catHeader);
const chansContainer=document.createElement('div');chansContainer.className='category-channels';
chansContainer.addEventListener('dragover',e=>e.preventDefault());
chansContainer.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();const data=JSON.parse(e.dataTransfer.getData('text/plain')||'{}');if(data.type==='channel'&&data.catKey!==catKey)await reorderChannels(data.key,data.catKey,null,catKey,[])});
if(cat.channels){
const sortedChans=Object.keys(cat.channels).sort((a,b)=>(cat.channels[a].order||0)-(cat.channels[b].order||0));
sortedChans.forEach(chKey=>{
const ch=cat.channels[chKey];
if(chKey===currentChannel){channelExists=true;currentChannelCatKey=catKey}
const chDiv=document.createElement('div');chDiv.className=`channel-item ${currentChannel===chKey?'active':''}`;chDiv.draggable=isAdmin;
chDiv.innerHTML=`<span># ${escapeHtml(ch.name)}</span><div class="channel-actions">${isAdmin?`<button class="channel-action-btn" title="Settings" onclick="event.stopPropagation();openChannelSettingsModal('${catKey}','${chKey}')">⚙</button>`:''}</div>`;
chDiv.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({type:'channel',key:chKey,catKey}));chDiv.classList.add('dragging')});
chDiv.addEventListener('dragend',()=>chDiv.classList.remove('dragging'));
chDiv.addEventListener('dragover',e=>e.preventDefault());
chDiv.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();const data=JSON.parse(e.dataTransfer.getData('text/plain')||'{}');if(data.type==='channel')await reorderChannels(data.key,data.catKey,chKey,catKey,sortedChans)});
chDiv.onclick=async()=>{const canRead=await checkPermission(chKey,'read');if(!canRead){alert("You do not have permission to view this channel.");return}currentChannel=chKey;currentChannelCatKey=catKey;activeChannelTitle.textContent=`# ${ch.name}`;lastMessagesHash="";fetchData()};
chDiv.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();if(!isAdmin)return;contextTarget={type:'channel',id:chKey,catId:catKey,name:ch.name};showContextMenu(e.clientX,e.clientY,['edit','permissions','delete'])};
chansContainer.appendChild(chDiv);
});
}
catDiv.appendChild(chansContainer);channelsContainer.appendChild(catDiv);
});
if(!channelExists&&sortedCategories.length>0)currentChannel="general";
const canReadActive=await checkPermission(currentChannel,'read');
if(!canReadActive){chatMessages.innerHTML='<div class="access-denied">[ ACCESS DENIED ]<br>You do not have permission to read this channel.</div>';chatInputContainer.style.display='none'}
else{
chatInputContainer.style.display='block';
const msgRes=await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
const messages=await msgRes.json()||{};
const msgEntries=Object.entries(messages).sort((a,b)=>a[0].localeCompare(b[0]));
const newHash=JSON.stringify(msgEntries.map(e=>e[0]));
if(newHash!==lastMessagesHash){
lastMessagesHash=newHash;chatMessages.innerHTML='';
if(msgEntries.length===0)chatMessages.innerHTML='<div class="empty-state">No messages yet. Start the conversation!</div>';
else{
msgEntries.forEach(([msgId,msg])=>{
const date=new Date(msg.time||Date.now());const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div=document.createElement('div');div.className='message';div.dataset.msgid=msgId;
let mediaHtml='';
if(msg.media)mediaHtml=(msg.media.startsWith('data:video')||msg.media.includes('video'))?`<video src="${msg.media}" controls></video>`:`<img src="${msg.media}" alt="media">`;
const canDelete=isAdmin||msg.user===currentUser;
div.innerHTML=`<img class="msg-avatar" src="${msg.avatar||generateDefaultAvatar(msg.user)}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(msg.user)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${escapeHtml(msg.text||'')}</div>${mediaHtml}</div>${canDelete?`<div class="msg-actions"><button class="msg-action-btn" data-del="${msgId}">✕</button></div>`:''}`;
if(canDelete)div.querySelector('[data-del]').onclick=async ev=>{ev.stopPropagation();if(!confirm("Delete this message?"))return;await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});lastMessagesHash="";fetchData()};
chatMessages.appendChild(div);
});
chatMessages.scrollTop=chatMessages.scrollHeight;
}
}
}
const userRes=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await userRes.json()||{};
const rolesRes=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles=await rolesRes.json()||{member:{name:"Member",color:"#ffffff"}};
sidebarMembersContainer.innerHTML='';
const grouped={};Object.keys(roles).forEach(rKey=>grouped[rKey]=[]);if(!grouped.member)grouped.member=[];
Object.keys(users).forEach(uname=>{const uData=users[uname];const uRole=uData.role&&roles[uData.role]?uData.role:'member';if(!grouped[uRole])grouped[uRole]=[];grouped[uRole].push({name:uname,...uData})});
Object.keys(roles).forEach(rKey=>{
const rList=grouped[rKey]||[];if(rList.length===0)return;
const sec=document.createElement('div');sec.className='members-section';
const rColor=roles[rKey].color||'#ffffff';
sec.innerHTML=`<h3 style="color:${rColor}">${roles[rKey].name.toUpperCase()} — ${rList.length}</h3>`;
rList.forEach(user=>{
const mDiv=document.createElement('div');mDiv.className='member-item';
mDiv.innerHTML=`<img class="member-avatar-sm" src="${user.avatar||generateDefaultAvatar(user.name)}" alt=""><span style="color:${rColor}">${escapeHtml(user.name)}</span>`;
mDiv.onclick=()=>openMemberProfileModal(user.name,user);sec.appendChild(mDiv);
});
sidebarMembersContainer.appendChild(sec);
});
}catch(err){console.error(err)}finally{isPolling=false}
}

async function reorderCategories(draggedKey,targetKey,sortedKeys){const dragIdx=sortedKeys.indexOf(draggedKey),targetIdx=sortedKeys.indexOf(targetKey);sortedKeys.splice(dragIdx,1);sortedKeys.splice(targetIdx,0,draggedKey);const updates={};sortedKeys.forEach((key,idx)=>updates[`${key}/order`]=idx);await fetch(`${FIREBASE_URL}/structure/categories.json?auth=${FIREBASE_TOKEN}`,{method:'PATCH',body:JSON.stringify(updates)});fetchData()}

async function reorderChannels(draggedKey,sourceCatKey,targetKey,targetCatKey,sortedChans){
if(sourceCatKey!==targetCatKey){const structRes=await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`);const chanData=await structRes.json();await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(chanData)});await fetch(`${FIREBASE_URL}/structure/categories/${sourceCatKey}/channels/${draggedKey}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'})}
else if(targetKey){const dragIdx=sortedChans.indexOf(draggedKey),targetIdx=sortedChans.indexOf(targetKey);sortedChans.splice(dragIdx,1);sortedChans.splice(targetIdx,0,draggedKey);const updates={};sortedChans.forEach((key,idx)=>updates[`${key}/order`]=idx);await fetch(`${FIREBASE_URL}/structure/categories/${targetCatKey}/channels.json?auth=${FIREBASE_TOKEN}`,{method:'PATCH',body:JSON.stringify(updates)})}
fetchData();
}

function escapeHtml(str){return(str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function generateDefaultAvatar(name){const canvas=document.createElement('canvas');canvas.width=40;canvas.height=40;const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,40,40);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(0.5,0.5,39,39);ctx.fillStyle='#fff';ctx.font='bold 16px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((name||'U').charAt(0).toUpperCase(),20,20);return canvas.toDataURL()}
</script>
