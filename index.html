<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.R.I.E.N.D.S</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;color:#e0e0e0}
body{background:#0a0a0a;color:#e0e0e0;height:100vh;overflow:hidden}
.hidden{display:none!important}
#auth-screen{display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;position:fixed;top:0;left:0;background:#0a0a0a;z-index:3000}
.auth-card{border:1px solid #3a3a3a;padding:48px 42px;width:400px;background:#111;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 20px 60px rgba(0,0,0,.6)}
.auth-card h1{margin-bottom:4px;text-align:center;letter-spacing:6px;font-size:24px;font-weight:700;color:#fff}
.auth-card .subtitle{margin-bottom:28px;text-align:center;letter-spacing:2px;font-size:11px;color:#666;text-transform:uppercase}
.auth-card h2{margin-bottom:22px;text-align:center;letter-spacing:2px;font-size:13px;color:#999;font-weight:500}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:1px;color:#888;text-transform:uppercase}
.input-group input,.input-group select,.input-group textarea{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#fff;padding:12px 14px;font-size:14px;outline:none;border-radius:10px;transition:border-color .15s}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:#555;background:#121212}
.auth-btn{width:100%;background:#161616;border:1px solid #3a3a3a;color:#eee;padding:13px;cursor:pointer;font-size:13px;letter-spacing:2px;margin-top:8px;transition:all .15s;border-radius:10px;font-weight:600}
.auth-btn:hover{background:#fff;color:#000;border-color:#fff}
.switch-auth{margin-top:20px;text-align:center;font-size:12px;cursor:pointer;color:#666;transition:color .15s}
.switch-auth:hover{color:#aaa}
#app-screen{display:flex;height:100vh;width:100vw}
.sidebar-channels{width:250px;border-right:1px solid #1f1f1f;display:flex;flex-direction:column;background:#0d0d0d;flex-shrink:0}
.server-header{padding:14px 16px;border-bottom:1px solid #1f1f1f;font-weight:600;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;cursor:default;font-size:14px;color:#fff}
.channels-list{padding:10px 8px;flex-grow:1;overflow-y:auto}
.category-group{margin-bottom:12px}
.category-header{font-size:10px;letter-spacing:1.5px;color:#555;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;cursor:default;font-weight:600;border-radius:6px;transition:background .12s,border-color .12s;border:1px solid transparent}
.category-header.draggable-item{cursor:grab}
.category-header.draggable-item:active{cursor:grabbing}
.category-channels{padding-left:2px;display:flex;flex-direction:column;gap:2px;min-height:8px}
.channel-item{padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:8px;color:#888;transition:all .12s;border:1px solid transparent}
.channel-item.draggable-item{cursor:grab}
.channel-item.draggable-item:active{cursor:grabbing}
.channel-item:hover{background:#161616;color:#ddd;border-color:#2a2a2a}
.channel-item.active{background:#1a1a1a;color:#fff;border-color:#3a3a3a}
.channel-item .symbol{margin-right:8px;opacity:.6;font-size:12px;font-weight:700}
.user-profile{padding:12px 14px;border-top:1px solid #1f1f1f;font-size:12px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#0a0a0a}
.user-profile:hover{background:#121212}
.user-avatar-sm{width:34px;height:34px;border-radius:50%;border:1px solid #333;object-fit:cover;background:#1a1a1a;flex-shrink:0}
.user-info-text{flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.user-info-text .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee}
.user-info-text .status{font-size:10px;color:#666;letter-spacing:.5px}
.logout-btn{background:none;border:1px solid #2a2a2a;color:#777;padding:5px 10px;font-size:10px;cursor:pointer;border-radius:8px;letter-spacing:1px}
.logout-btn:hover{border-color:#555;color:#ccc}
.chat-area{flex-grow:1;display:flex;flex-direction:column;background:#0a0a0a;min-width:0}
.chat-header{padding:12px 20px;border-bottom:1px solid #1f1f1f;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:50px}
.chat-header .topic{font-size:12px;color:#555;font-weight:400;margin-left:12px}
.channel-settings-gear{cursor:pointer;font-size:14px;background:none;border:1px solid transparent;color:#555;padding:5px 9px;border-radius:8px}
.channel-settings-gear:hover{background:#161616;color:#aaa;border-color:#2a2a2a}
.chat-messages{flex-grow:1;padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.message{font-size:14px;line-height:1.45;display:flex;gap:14px;align-items:flex-start;position:relative;padding:8px 10px;border-radius:10px;transition:background .1s}
.message:hover{background:#111}
.msg-avatar{width:40px;height:40px;border-radius:50%;border:1px solid #2a2a2a;object-fit:cover;background:#1a1a1a;flex-shrink:0;cursor:pointer}
.msg-content{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.msg-header-row{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.message .msg-user{font-weight:600;font-size:13px;cursor:pointer;color:#eee}
.message .msg-user:hover{text-decoration:underline}
.message .msg-time{font-size:11px;color:#555}
.message .msg-text{word-break:break-word;white-space:pre-wrap;color:#ccc}
.message img,.message video{max-width:340px;max-height:260px;border:1px solid #2a2a2a;margin-top:8px;display:block;object-fit:contain;border-radius:12px}
.msg-actions{display:none;position:absolute;right:10px;top:6px;gap:2px;background:#151515;border:1px solid #2a2a2a;border-radius:8px;padding:2px}
.message:hover .msg-actions{display:flex}
.msg-action-btn{background:none;border:none;color:#666;font-size:12px;padding:4px 7px;cursor:pointer;border-radius:6px}
.msg-action-btn:hover{background:#222;color:#ddd}
.chat-input-area{padding:12px 20px 18px;border-top:1px solid #1a1a1a}
.chat-input-form{display:flex;border:1px solid #2a2a2a;border-radius:12px;align-items:stretch;background:#111;overflow:hidden}
.file-upload-label{padding:0 14px;cursor:pointer;border-right:1px solid #2a2a2a;font-size:18px;display:flex;align-items:center;color:#666;background:transparent}
.file-upload-label:hover{color:#aaa;background:#181818}
.chat-input-form input[type=text]{flex-grow:1;background:transparent;border:none;color:#ddd;padding:13px 14px;font-size:14px;outline:none}
.chat-input-form button[type=submit]{background:transparent;border-left:1px solid #2a2a2a;color:#777;padding:0 18px;cursor:pointer;font-size:12px;letter-spacing:1px;font-weight:600;transition:all .12s}
.chat-input-form button[type=submit]:hover{background:#fff;color:#000}
.chat-input-form button[type=submit]:disabled{opacity:.4;cursor:not-allowed}
.cooldown-bar{height:3px;background:#1a1a1a;border-radius:2px;margin-top:6px;overflow:hidden;display:none}
.cooldown-fill{height:100%;background:#555;width:0%;transition:width .1s linear}
.cooldown-text{font-size:11px;color:#666;margin-top:4px;display:none;letter-spacing:.5px}
.sidebar-members{width:230px;border-left:1px solid #1f1f1f;padding:14px 10px;background:#0d0d0d;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.members-section h3{font-size:10px;letter-spacing:1.5px;margin-bottom:6px;color:#555;text-transform:uppercase;font-weight:600}
.member-item{font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 8px;border-radius:8px;transition:background .12s;border:1px solid transparent}
.member-item:hover{background:#161616;border-color:#2a2a2a}
.member-avatar-sm{width:28px;height:28px;border-radius:50%;border:1px solid #2a2a2a;object-fit:cover;background:#1a1a1a}
.status-dot{width:9px;height:9px;border-radius:50%;border:2px solid #0d0d0d;position:absolute;bottom:-1px;right:-1px}
.status-online{background:#3ba55d}
.status-idle{background:#faa61a}
.status-dnd{background:#ed4245}
.status-offline{background:#555}
#context-menu{position:fixed;background:#151515;border:1px solid #2a2a2a;padding:6px 0;z-index:5000;min-width:190px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.7);border-radius:12px}
.context-menu-item{padding:9px 14px;font-size:12px;cursor:pointer;letter-spacing:.3px;color:#bbb}
.context-menu-item:hover{background:#fff;color:#000}
.context-menu-item.danger{color:#ed4245}
.context-menu-item.danger:hover{background:#ed4245;color:#fff}
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:4000}
.modal-card{background:#111;border:1px solid #2a2a2a;padding:26px;width:560px;max-height:88vh;overflow-y:auto;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal-card h3{margin-bottom:18px;font-size:15px;letter-spacing:1px;font-weight:600;color:#fff}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.admin-panel-btn{background:#161616;border:1px solid #2a2a2a;color:#ccc;padding:10px 14px;font-size:12px;cursor:pointer;letter-spacing:1px;flex-grow:1;text-align:center;border-radius:10px;font-weight:600;transition:all .12s}
.admin-panel-btn:hover{background:#fff;color:#000;border-color:#fff}
.admin-panel-btn.danger{border-color:#622;color:#ed4245}
.admin-panel-btn.danger:hover{background:#ed4245;color:#fff}
.empty-state{padding:50px 20px;text-align:center;color:#444;font-size:13px;letter-spacing:1px}
.access-denied{padding:40px 20px;text-align:center;color:#ed4245;font-size:14px;letter-spacing:2px}
.forum-container{flex-grow:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.forum-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid #2a2a2a;background:#111;border-radius:12px;margin-bottom:6px}
.forum-post-card{border:1px solid #2a2a2a;padding:14px;background:#111;cursor:pointer;transition:all .12s;border-radius:12px}
.forum-post-card:hover{background:#161616;border-color:#3a3a3a}
.forum-post-title{font-size:15px;font-weight:600;margin-bottom:5px;color:#eee}
.forum-post-snippet{font-size:12px;color:#777;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.forum-post-footer{font-size:11px;color:#555;display:flex;gap:14px}
.reaction-bar{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.reaction{background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.reaction:hover{border-color:#555}
.reaction.active{background:#1a1a1a;border-color:#666}
.typing-indicator{font-size:11px;color:#444;padding:2px 20px;height:16px}
.mention{background:#1f1f1f;padding:1px 5px;border-radius:4px;font-weight:600;color:#fff}
.markdown-code{background:#151515;padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px;border:1px solid #2a2a2a}
.markdown-bold{font-weight:700;color:#fff}
.markdown-italic{font-style:italic}
.markdown-spoiler{background:#222;color:#222;border-radius:3px;padding:0 4px;cursor:pointer}
.markdown-spoiler:hover{color:#ccc}
.role-row{border:1px solid #2a2a2a;padding:12px;margin-bottom:8px;border-radius:10px;background:#0d0d0d}
.role-row .role-name{font-weight:600;margin-bottom:8px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.perm-grid label{display:flex;align-items:center;gap:6px;cursor:pointer;color:#aaa}
.perm-grid input[type=checkbox]{accent-color:#fff}
.load-more{text-align:center;padding:12px;color:#666;font-size:12px;cursor:pointer;letter-spacing:1px}
.load-more:hover{color:#aaa}
.settings-section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1f1f1f}
.settings-section:last-child{border-bottom:none}
.settings-section h4{font-size:12px;letter-spacing:1px;color:#888;margin-bottom:12px;text-transform:uppercase}
.dragging{opacity:0.4;transform:scale(0.98)}
.drag-over{background:#1a1a1a!important;border-color:#555!important}
.category-header.drag-over{background:#1f1f1f;border-color:#555}
.channel-item.drag-over{background:#222;border-color:#666}
.drop-indicator{height:3px;background:#fff;margin:2px 8px;border-radius:2px;opacity:0;transition:opacity .1s}
.drop-indicator.active{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
</style>
</head>
<body>
<div id="context-menu"></div>
<div id="auth-screen">
<div class="auth-card">
<h1>F.R.I.E.N.D.S</h1>
<div class="subtitle">secure terminal</div>
<h2 id="auth-title">AUTHORIZATION</h2>
<form id="auth-form">
<div class="input-group"><label>USERNAME</label><input type="text" id="username-input" required autocomplete="off" maxlength="24"></div>
<div class="input-group"><label>PASSWORD</label><input type="password" id="password-input" required maxlength="64"></div>
<button type="submit" class="auth-btn" id="auth-submit-btn">LOGIN</button>
</form>
<div class="switch-auth" id="switch-auth-mode">Need an account? Register</div>
</div>
</div>
<div id="app-screen" class="hidden">
<div class="sidebar-channels" id="sidebar-channels-panel">
<div class="server-header" id="server-header-main">
<span id="server-title-display">F.R.I.E.N.D.S</span>
<span style="font-size:14px;cursor:pointer;color:#555" id="server-gear-btn" title="Server Settings">⚙</span>
</div>
<div class="channels-list" id="channels-container"></div>
<div class="user-profile" id="user-profile-bar">
<div style="position:relative">
<img id="my-avatar-display" class="user-avatar-sm" src="" alt="" loading="eager">
<div class="status-dot status-online" id="my-status-dot"></div>
</div>
<div class="user-info-text">
<div class="name" id="current-username-display">User</div>
<div class="status" id="current-user-desc">ONLINE</div>
</div>
<button class="logout-btn" id="logout-btn">LOGOUT</button>
</div>
</div>
<div class="chat-area" id="main-display-area">
<div class="chat-header">
<div style="display:flex;align-items:center">
<span id="active-channel-title"># general</span>
<span class="topic" id="channel-topic"></span>
</div>
<button class="channel-settings-gear" id="channel-gear-btn" title="Channel Settings">⚙</button>
</div>
<div class="chat-messages" id="chat-messages"></div>
<div class="typing-indicator" id="typing-indicator"></div>
<div class="chat-input-area" id="chat-input-container">
<form class="chat-input-form" id="chat-form">
<label class="file-upload-label" title="Upload">+</label>
<input type="file" id="media-file-input" accept="image/*,video/*" style="display:none">
<input type="text" id="message-input" placeholder="Message #general" autocomplete="off" maxlength="2000">
<button type="submit" id="send-btn">SEND</button>
</form>
<div class="cooldown-bar" id="cooldown-bar"><div class="cooldown-fill" id="cooldown-fill"></div></div>
<div class="cooldown-text" id="cooldown-text"></div>
</div>
</div>
<div class="sidebar-members" id="sidebar-members-container"></div>
</div>
<div id="modal-container"></div>
<script>
const FIREBASE_URL="https://hgjghjgjhjdf-default-rtdb.firebaseio.com/";
const FIREBASE_TOKEN="87skG4p2wFrEKahKAcCKdig9ouJuD1V1szanWP87";
const OWNER="SStwendRT";
const MSG_PAGE_SIZE=20;
let isRegistering=false,currentUser=localStorage.getItem('chat_user')||null,userIp="unknown",currentChannel="general",currentChannelCatKey="general_cat",currentChannelType="text",isAdmin=false,contextTarget=null,lastMessagesHash="",isPolling=false;
let cachedAvatar="",cachedBio="",lastMessageTime=0,activeForumPostId=null,userStatus="online",replyToMsg=null,editingMsgId=null,channelCooldown=0,cooldownTimer=null,avatarCache={};
let allMessagesCache={},displayedCount=MSG_PAGE_SIZE,isLoadingMore=false;
let dragData=null;
const userIpPromise=fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{userIp=d.ip||"unknown";return userIp}).catch(()=>{userIp="unknown";return"unknown"});
const authScreen=document.getElementById('auth-screen'),appScreen=document.getElementById('app-screen'),authTitle=document.getElementById('auth-title'),authSubmitBtn=document.getElementById('auth-submit-btn'),switchAuthMode=document.getElementById('switch-auth-mode'),authForm=document.getElementById('auth-form'),usernameInput=document.getElementById('username-input'),passwordInput=document.getElementById('password-input'),currentUsernameDisplay=document.getElementById('current-username-display'),currentUserDesc=document.getElementById('current-user-desc'),myAvatarDisplay=document.getElementById('my-avatar-display'),userProfileBar=document.getElementById('user-profile-bar'),logoutBtn=document.getElementById('logout-btn'),serverGearBtn=document.getElementById('server-gear-btn'),channelGearBtn=document.getElementById('channel-gear-btn'),serverTitleDisplay=document.getElementById('server-title-display'),chatForm=document.getElementById('chat-form'),messageInput=document.getElementById('message-input'),chatMessages=document.getElementById('chat-messages'),channelsContainer=document.getElementById('channels-container'),sidebarChannelsPanel=document.getElementById('sidebar-channels-panel'),sidebarMembersContainer=document.getElementById('sidebar-members-container'),activeChannelTitle=document.getElementById('active-channel-title'),mediaFileInput=document.getElementById('media-file-input'),fileUploadLabel=document.querySelector('.file-upload-label'),contextMenu=document.getElementById('context-menu'),chatInputContainer=document.getElementById('chat-input-container'),mainDisplayArea=document.getElementById('main-display-area'),channelTopic=document.getElementById('channel-topic'),sendBtn=document.getElementById('send-btn'),cooldownBar=document.getElementById('cooldown-bar'),cooldownFill=document.getElementById('cooldown-fill'),cooldownText=document.getElementById('cooldown-text');

fileUploadLabel.addEventListener('click',()=>mediaFileInput.click());
document.addEventListener('click',()=>{contextMenu.style.display='none'});
sidebarChannelsPanel.addEventListener('contextmenu',e=>{
e.preventDefault();e.stopPropagation();
if(!isAdmin)return;
contextTarget={type:'sidebar'};
showContextMenu(e.clientX,e.clientY,['create-channel','create-forum','create-category','edit-roles']);
});
serverGearBtn.addEventListener('click',e=>{
e.stopPropagation();
if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}
openServerSettingsModal();
});
channelGearBtn.addEventListener('click',e=>{
e.stopPropagation();
if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}
openChannelSettingsModal(currentChannelCatKey,currentChannel);
});
if(currentUser)checkBanAndInitialize();

switchAuthMode.addEventListener('click',()=>{
isRegistering=!isRegistering;
authTitle.textContent=isRegistering?"REGISTRATION":"AUTHORIZATION";
authSubmitBtn.textContent=isRegistering?"REGISTER":"LOGIN";
switchAuthMode.textContent=isRegistering?"Already have an account? Login":"Need an account? Register";
});

authForm.addEventListener('submit',async e=>{
e.preventDefault();
const username=usernameInput.value.trim(),password=passwordInput.value.trim();
if(!username||!password)return false;
if(username.length<2){alert("Username must be at least 2 characters.");return false;}
try{
await userIpPromise;
if(isRegistering&&userIp&&userIp!=="unknown"){
try{
const banRes=await fetch(`${FIREBASE_URL}/bans/${userIp.replace(/[.#$\/\[\]]/g,'_')}.json?auth=${FIREBASE_TOKEN}`);
const banData=await banRes.json();
if(banData===true||(banData&&banData.banned)){alert("ACCESS DENIED — IP BANNED");return false;}
}catch(err){}
}
const res=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await res.json()||{};
if(isRegistering){
if(users[username]){alert("Username already exists.");return false;}
const isFirstUser=Object.keys(users).length===0;
const role=isFirstUser||username===OWNER?"admin":"member";
await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({password,ip:userIp,avatar:"",bio:isFirstUser?"Server Owner":"Member",role,joined:Date.now(),status:"online"})});
if(isFirstUser){
await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({
admin:{name:"Admin",color:"#ffffff",hoist:true,permissions:{view_channels:true,send_messages:true,manage_channels:true,manage_roles:true,administrator:true}},
member:{name:"Member",color:"#aaaaaa",hoist:false,permissions:{view_channels:true,send_messages:true,manage_channels:false,manage_roles:false,administrator:false}}
})});
await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("F.R.I.E.N.D.S")});
}
}else{
if(!users[username]||users[username].password!==password){alert("Invalid username or password.");return false;}
await fetch(`${FIREBASE_URL}/users/${username}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
await fetch(`${FIREBASE_URL}/users/${username}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("online")});
}
currentUser=username;localStorage.setItem('chat_user',currentUser);checkBanAndInitialize();
}catch(err){alert("Connection error. Please try again.");console.error(err);}
return false;
});

logoutBtn.addEventListener('click',async e=>{
e.stopPropagation();
try{await fetch(`${FIREBASE_URL}/users/${currentUser}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("offline")});}catch(e){}
localStorage.removeItem('chat_user');currentUser=null;isAdmin=false;appScreen.classList.add('hidden');authScreen.classList.remove('hidden');usernameInput.value='';passwordInput.value='';
});

async function checkBanAndInitialize(){
try{
await userIpPromise;

const userData=await userRes.json();

function getStableAvatar(name,url){
const key=name+(url||'');
if(avatarCache[key])return avatarCache[key];
const src=url&&url.length>5?url:generateDefaultAvatar(name);
avatarCache[key]=src;
return src;
}

function startCooldown(seconds){
if(seconds<=0)return;
clearInterval(cooldownTimer);
let remaining=seconds;
const btn=document.getElementById('send-btn');
const inp=document.getElementById('message-input');
if(btn)btn.disabled=true;
if(inp)inp.disabled=true;
const bar=document.getElementById('cooldown-bar');
const fill=document.getElementById('cooldown-fill');
const txt=document.getElementById('cooldown-text');
if(bar)bar.style.display='block';
if(txt){txt.style.display='block';txt.textContent=`Cooldown: ${remaining}s`;}
if(fill)fill.style.width='100%';
const start=Date.now();
cooldownTimer=setInterval(()=>{
const elapsed=(Date.now()-start)/1000;
remaining=Math.max(0,seconds-elapsed);
const pct=(remaining/seconds)*100;
if(fill)fill.style.width=pct+'%';
if(txt)txt.textContent=`Cooldown: ${Math.ceil(remaining)}s`;
if(remaining<=0){
clearInterval(cooldownTimer);
if(btn)btn.disabled=false;
if(inp)inp.disabled=false;
if(bar)bar.style.display='none';
if(txt){txt.style.display='none';txt.textContent='';}
}
},50);
}

function bindChatForm(){
const form=document.getElementById('chat-form');
if(!form)return;
form.onsubmit=async e=>{
e.preventDefault();
e.stopPropagation();
const btn=document.getElementById('send-btn');
if(btn&&btn.disabled)return;
const inp=document.getElementById('message-input');
const fileInp=document.getElementById('media-file-input');
let text=(inp?inp.value:'').trim();
if(!text&&!(fileInp&&fileInp.files[0]))return;
if(editingMsgId){
await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${editingMsgId}/text.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(text)});
editingMsgId=null;if(inp)inp.value='';if(inp)inp.placeholder=`Message #${currentChannel}`;lastMessagesHash="";fetchData();return;
}
const now=Date.now();
if(channelCooldown>0&&(now-lastMessageTime)<channelCooldown*1000){
const left=Math.ceil((channelCooldown*1000-(now-lastMessageTime))/1000);
alert(`Cooldown active. Wait ${left}s.`);
return;
}
if(fileInp&&fileInp.files&&fileInp.files[0]){
const file=fileInp.files[0];
if(file.size>4*1024*1024){alert("File too large (max 4 MB).");fileInp.value="";return;}
const reader=new FileReader();
reader.onload=async ev=>{
const mediaUrl=ev.target.result;fileInp.value="";
if(currentChannelType==='forum'&&activeForumPostId)executeOptimisticForumComment(text,mediaUrl);
else executeOptimisticSend(text,mediaUrl);
if(channelCooldown>0)startCooldown(channelCooldown);
};
reader.readAsDataURL(file);return;
}
if(inp)inp.value='';
if(currentChannelType==='forum'&&activeForumPostId)executeOptimisticForumComment(text,"");
else executeOptimisticSend(text,"");
if(channelCooldown>0)startCooldown(channelCooldown);
};
const label=document.querySelector('.file-upload-label');
if(label)label.onclick=()=>{const fi=document.getElementById('media-file-input');if(fi)fi.click();};
}

function executeOptimisticSend(text,mediaUrl){
const time=Date.now();
lastMessageTime=time;
const avatar=getStableAvatar(currentUser,cachedAvatar);
const date=new Date(time);
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const div=document.createElement('div');div.className='message';
let mediaHtml='';
if(mediaUrl)mediaHtml=(mediaUrl.startsWith('data:video')||mediaUrl.includes('video'))?`<video src="${mediaUrl}" controls></video>`:`<img src="${mediaUrl}" alt="media">`;
let replyHtml='';
if(replyToMsg)replyHtml=`<div style="font-size:11px;color:#555;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">Reply to ${escapeHtml(replyToMsg.user)}: ${escapeHtml((replyToMsg.text||'').substring(0,50))}</div>`;
div.innerHTML=`<img class="msg-avatar" src="${avatar}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(currentUser)}</span><span class="msg-time">${timeStr}</span></div>${replyHtml}<div class="msg-text">${parseMarkdown(escapeHtml(text))}</div>${mediaHtml}</div>`;
const emptyState=chatMsgs.querySelector('.empty-state');if(emptyState)emptyState.remove();
chatMsgs.appendChild(div);chatMsgs.scrollTop=chatMsgs.scrollHeight;
const payload={user:currentUser,avatar,text,media:mediaUrl,time,reactions:{}};
if(replyToMsg){payload.replyTo={id:replyToMsg.id,user:replyToMsg.user,text:replyToMsg.text};replyToMsg=null;}
fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify(payload)}).then(()=>{lastMessagesHash="";}).catch(err=>console.error("Send failed:",err));
}

function executeOptimisticForumComment(text,mediaUrl){

const time=Date.now();
const avatar=getStableAvatar(currentUser,cachedAvatar);
const date=new Date(time);
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const div=document.createElement('div');div.className='message';
let mediaHtml='';

async function checkPermission(channelKey,action){
if(isAdmin)return true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const struct=await structRes.json();
let chanObj=null;
for(let catKey in struct.categories){if(struct.categories[catKey].channels&&struct.categories[catKey].channels[channelKey]){chanObj=struct.categories[catKey].channels[channelKey];break}}
if(!chanObj)return true;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const uData=await userRes.json();
const uRole=uData?.role||'member';
const rolesRes=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles=await rolesRes.json()||{};
const rolePerms=roles[uRole]?.permissions||{};
if(rolePerms.administrator)return true;
if(action==='read'||action==='view'){if(rolePerms.view_channels===false)return false;}
if(action==='write'||action==='send'){if(rolePerms.send_messages===false)return false;}
const perms=chanObj.permissions||{};
if(perms.users&&perms.users[currentUser]&&perms.users[currentUser][action]!==undefined)return perms.users[currentUser][action];
const rolePerm=perms[uRole];
if(rolePerm&&rolePerm[action]===false)return false;
if(rolePerm&&rolePerm[action]===true)return true;
return true;
}catch(e){return true}
}

async function reorderCategories(dragCatKey,targetCatKey,insertBefore){
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
const cats=structure.categories||{};
const sorted=Object.keys(cats).sort((a,b)=>(cats[a].order||0)-(cats[b].order||0));
const fromIdx=sorted.indexOf(dragCatKey);
const toIdx=sorted.indexOf(targetCatKey);
if(fromIdx===-1||toIdx===-1||fromIdx===toIdx)return;
sorted.splice(fromIdx,1);
const newToIdx=sorted.indexOf(targetCatKey);
const insertIdx=insertBefore?newToIdx:newToIdx+1;
sorted.splice(insertIdx,0,dragCatKey);
const updates={};
sorted.forEach((key,i)=>{updates[`categories/${key}/order`]=i;});
await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PATCH',body:JSON.stringify(updates)});
fetchData();
}catch(e){console.error(e);alert("Failed to reorder categories.");}
}

async function moveChannel(dragChKey,fromCatKey,toCatKey,targetChKey,insertBefore){
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
const fromCat=structure.categories[fromCatKey];
const toCat=structure.categories[toCatKey];
if(!fromCat||!toCat||!fromCat.channels||!fromCat.channels[dragChKey])return;
const channelData=fromCat.channels[dragChKey];
const fromChannels=Object.keys(fromCat.channels).filter(k=>k!==dragChKey).sort((a,b)=>(fromCat.channels[a].order||0)-(fromCat.channels[b].order||0));
let toChannels=Object.keys(toCat.channels||{}).filter(k=>k!==dragChKey).sort((a,b)=>(toCat.channels[a].order||0)-(toCat.channels[b].order||0));
if(targetChKey&&toChannels.includes(targetChKey)){
const tIdx=toChannels.indexOf(targetChKey);
toChannels.splice(insertBefore?tIdx:tIdx+1,0,dragChKey);
}else{
toChannels.push(dragChKey);
}
const updates={};
fromChannels.forEach((k,i)=>{updates[`categories/${fromCatKey}/channels/${k}/order`]=i;});
if(fromCatKey!==toCatKey){
updates[`categories/${fromCatKey}/channels/${dragChKey}`]=null;
updates[`categories/${toCatKey}/channels/${dragChKey}`]=channelData;
}
toChannels.forEach((k,i)=>{updates[`categories/${toCatKey}/channels/${k}/order`]=i;});
await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PATCH',body:JSON.stringify(updates)});
if(currentChannel===dragChKey)currentChannelCatKey=toCatKey;
fetchData();
}catch(e){console.error(e);alert("Failed to move channel.");}
}

function clearDragStyles(){
document.querySelectorAll('.dragging,.drag-over').forEach(el=>{
el.classList.remove('dragging','drag-over');
});
dragData=null;
}

function setupDragEvents(el,type,id,catId){
if(!isAdmin)return;
el.classList.add('draggable-item');
el.draggable=true;
el.addEventListener('dragstart',e=>{
e.stopPropagation();
dragData={type,id,catId};
el.classList.add('dragging');
e.dataTransfer.effectAllowed='move';
e.dataTransfer.setData('text/plain',JSON.stringify(dragData));
});
el.addEventListener('dragend',()=>{
clearDragStyles();
});
el.addEventListener('dragover',e=>{
e.preventDefault();
e.stopPropagation();
if(!dragData)return;
if(type==='category'&&dragData.type==='category'&&dragData.id!==id){
el.classList.add('drag-over');
}else if(type==='channel'&&dragData.type==='channel'){
el.classList.add('drag-over');
}else if(type==='category'&&dragData.type==='channel'){
el.classList.add('drag-over');
}
});
el.addEventListener('dragleave',e=>{
el.classList.remove('drag-over');
});
el.addEventListener('drop',async e=>{
e.preventDefault();
e.stopPropagation();
el.classList.remove('drag-over');
if(!dragData||!isAdmin)return;
const rect=el.getBoundingClientRect();
const midY=rect.top+rect.height/2;
const insertBefore=e.clientY<midY;
if(dragData.type==='category'&&type==='category'&&dragData.id!==id){
await reorderCategories(dragData.id,id,insertBefore);
}else if(dragData.type==='channel'){
if(type==='channel'){
await moveChannel(dragData.id,dragData.catId,catId,id,insertBefore);
}else if(type==='category'){
await moveChannel(dragData.id,dragData.catId,id,null,false);
}
}
clearDragStyles();
});
}

async function fetchData(){
if(isPolling)return;isPolling=true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
channelsContainer.innerHTML='';
let channelExists=false;
const sortedCategories=Object.keys(structure.categories||{}).sort((a,b)=>(structure.categories[a].order||0)-(structure.categories[b].order||0));
sortedCategories.forEach(catKey=>{
const cat=structure.categories[catKey];
const catDiv=document.createElement('div');catDiv.className='category-group';
const catHeader=document.createElement('div');catHeader.className='category-header';
catHeader.innerHTML=`<span>${escapeHtml(cat.name)}</span>`;
if(isAdmin){
catHeader.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'category',id:catKey,name:cat.name};showContextMenu(e.clientX,e.clientY,['create-channel','create-forum','edit','delete']);};
setupDragEvents(catHeader,'category',catKey,null);
}
catDiv.appendChild(catHeader);
const chansContainer=document.createElement('div');chansContainer.className='category-channels';
if(isAdmin){
setupDragEvents(chansContainer,'category',catKey,null);
}
if(cat.channels){
const sortedChans=Object.keys(cat.channels).sort((a,b)=>(cat.channels[a].order||0)-(cat.channels[b].order||0));
sortedChans.forEach(chKey=>{
const ch=cat.channels[chKey];
if(chKey===currentChannel){channelExists=true;currentChannelCatKey=catKey;currentChannelType=ch.type||'text';channelCooldown=ch.cooldown||0}
const symbol=ch.type==='forum'?'F':'#';
const chDiv=document.createElement('div');chDiv.className=`channel-item ${currentChannel===chKey?'active':''}`;
chDiv.innerHTML=`<span><span class="symbol">${symbol}</span>${escapeHtml(ch.name)}</span>${isAdmin?`<button style="background:none;border:none;color:#444;cursor:pointer;font-size:11px" title="Settings" onclick="event.stopPropagation();openChannelSettingsModal('${catKey}','${chKey}')">⚙</button>`:''}`;
chDiv.onclick=async()=>{
const canRead=await checkPermission(chKey,'read');
if(!canRead){alert("ACCESS DENIED — NO VIEW PERMISSION");return}
currentChannel=chKey;currentChannelCatKey=catKey;currentChannelType=ch.type||'text';
channelCooldown=ch.cooldown||0;
activeForumPostId=null;replyToMsg=null;editingMsgId=null;
displayedCount=MSG_PAGE_SIZE;allMessagesCache={};
activeChannelTitle.textContent=`${symbol} ${ch.name}`;
channelTopic.textContent=ch.topic||'';
const inp=document.getElementById('message-input');
if(inp)inp.placeholder=`Message ${symbol}${ch.name}`;
lastMessagesHash="";fetchData();
};
if(isAdmin){
chDiv.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'channel',id:chKey,catId:catKey,name:ch.name};showContextMenu(e.clientX,e.clientY,['edit','permissions','delete']);};
setupDragEvents(chDiv,'channel',chKey,catKey);
}
chansContainer.appendChild(chDiv);
});
}
catDiv.appendChild(chansContainer);channelsContainer.appendChild(catDiv);
});
if(!channelExists&&sortedCategories.length>0)currentChannel="general";
const canReadActive=await checkPermission(currentChannel,'read');
if(!canReadActive){
mainDisplayArea.innerHTML=`<div class="chat-header"><span># restricted</span></div><div class="chat-messages"><div class="access-denied">ACCESS DENIED<br>NO VIEW PERMISSION</div></div>`;
}else{
if(currentChannelType==='forum')renderForumView();
else renderTextView();
}
const userRes=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await userRes.json()||{};
const rolesRes=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles=await rolesRes.json()||{member:{name:"Member",color:"#aaaaaa",hoist:false}};
sidebarMembersContainer.innerHTML='';
const grouped={};Object.keys(roles).forEach(rKey=>grouped[rKey]=[]);if(!grouped.member)grouped.member=[];
Object.keys(users).forEach(uname=>{const uData=users[uname];const uRole=uData.role&&roles[uData.role]?uData.role:'member';if(!grouped[uRole])grouped[uRole]=[];grouped[uRole].push({name:uname,...uData})});
const sortedRoleKeys=Object.keys(roles).sort((a,b)=>{
const ha=roles[a].hoist?0:1;const hb=roles[b].hoist?0:1;
return ha-hb||(roles[a].name||'').localeCompare(roles[b].name||'');
});
sortedRoleKeys.forEach(rKey=>{
const rList=grouped[rKey]||[];if(rList.length===0)return;
const r=roles[rKey];
if(!r.hoist&&rKey!=='member'&&rKey!=='admin')return;
const sec=document.createElement('div');sec.className='members-section';
const rColor=r.color||'#aaaaaa';
sec.innerHTML=`<h3 style="color:${rColor}">${(r.name||rKey).toUpperCase()} — ${rList.length}</h3>`;
rList.forEach(user=>{

mDiv.innerHTML=`<div style="position:relative"><img class="member-avatar-sm" src="${avSrc}" alt="" loading="eager"><div class="status-dot status-${status}"></div></div><span style="color:${rColor}">${escapeHtml(user.name)}</span>`;
mDiv.onclick=()=>openMemberProfileModal(user.name,user);sec.appendChild(mDiv);
});
sidebarMembersContainer.appendChild(sec);
});
}catch(err){console.error(err)}finally{isPolling=false}
}

bindChatForm();
}
const canWrite=await checkPermission(currentChannel,'write');
const inputContainer=document.getElementById('chat-input-container');
if(inputContainer)inputContainer.style.display=canWrite?'block':'none';
const msgRes=await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
const messages=await msgRes.json()||{};
allMessagesCache=messages;
const msgEntries=Object.entries(messages).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
const newHash=JSON.stringify(msgEntries.map(e=>e[0]+JSON.stringify(e[1].reactions||{})));
if(newHash!==lastMessagesHash){
lastMessagesHash=newHash;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const isScrolledToBottom=chatMsgs.scrollHeight-chatMsgs.scrollTop<=chatMsgs.clientHeight+80;
const total=msgEntries.length;
const startIdx=Math.max(0,total-displayedCount);
const visible=msgEntries.slice(startIdx);
chatMsgs.innerHTML='';
if(total===0){
chatMsgs.innerHTML='<div class="empty-state">No messages yet. Start the conversation.</div>';
}else{
if(startIdx>0){
const loadMore=document.createElement('div');
loadMore.className='load-more';
loadMore.textContent=`Load older messages (${startIdx} remaining)`;
loadMore.onclick=()=>{
displayedCount+=MSG_PAGE_SIZE;
lastMessagesHash="";
renderTextView();
};
chatMsgs.appendChild(loadMore);
}
visible.forEach(([msgId,msg])=>{
const date=new Date(msg.time||Date.now());
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div=document.createElement('div');div.className='message';div.dataset.msgid=msgId;
let mediaHtml='';
if(msg.media)mediaHtml=(msg.media.startsWith('data:video')||msg.media.includes('video'))?`<video src="${msg.media}" controls></video>`:`<img src="${msg.media}" alt="media">`;
let replyHtml='';
if(msg.replyTo)replyHtml=`<div style="font-size:11px;color:#555;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">Reply to ${escapeHtml(msg.replyTo.user)}: ${escapeHtml((msg.replyTo.text||'').substring(0,50))}</div>`;
let reactionsHtml='';
if(msg.reactions&&Object.keys(msg.reactions).length){
reactionsHtml='<div class="reaction-bar">';
Object.entries(msg.reactions).forEach(([emoji,users])=>{
const active=users.includes(currentUser)?'active':'';
reactionsHtml+=`<div class="reaction ${active}" data-emoji="${escapeHtml(emoji)}" data-msgid="${msgId}">${escapeHtml(emoji)} ${users.length}</div>`;
});
reactionsHtml+='</div>';
}
const canDelete=isAdmin||msg.user===currentUser;
const canEdit=msg.user===currentUser;
const avSrc=getStableAvatar(msg.user,msg.avatar);
div.innerHTML=`<img class="msg-avatar" src="${avSrc}" alt="" data-user="${escapeHtml(msg.user)}" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user" data-user="${escapeHtml(msg.user)}">${escapeHtml(msg.user)}</span><span class="msg-time">${timeStr}</span></div>${replyHtml}<div class="msg-text">${parseMarkdown(escapeHtml(msg.text||''))}</div>${mediaHtml}${reactionsHtml}</div><div class="msg-actions">${canEdit?`<button class="msg-action-btn" data-edit="${msgId}">Edit</button>`:''}${canDelete?`<button class="msg-action-btn" data-del="${msgId}">Del</button>`:''}<button class="msg-action-btn" data-reply="${msgId}">Reply</button><button class="msg-action-btn" data-react="${msgId}">React</button></div>`;
if(canDelete)div.querySelector('[data-del]').onclick=async ev=>{ev.stopPropagation();if(!confirm("Delete this message?"))return;await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});lastMessagesHash="";fetchData();};
if(canEdit)div.querySelector('[data-edit]').onclick=ev=>{ev.stopPropagation();editingMsgId=msgId;const inp=document.getElementById('message-input');if(inp){inp.value=msg.text||'';inp.placeholder='Editing message...';inp.focus();}};
div.querySelector('[data-reply]').onclick=ev=>{ev.stopPropagation();replyToMsg={id:msgId,user:msg.user,text:msg.text};const inp=document.getElementById('message-input');if(inp){inp.placeholder=`Replying to ${msg.user}...`;inp.focus();}};
div.querySelector('[data-react]').onclick=ev=>{ev.stopPropagation();const emoji=prompt("Enter reaction:");if(emoji)addReaction(msgId,emoji.trim());};
div.querySelectorAll('.reaction').forEach(r=>{r.onclick=()=>addReaction(r.dataset.msgid,r.dataset.emoji);});
div.querySelectorAll('[data-user]').forEach(el=>{el.onclick=async()=>{const uname=el.dataset.user;const uRes=await fetch(`${FIREBASE_URL}/users/${uname}.json?auth=${FIREBASE_TOKEN}`);const uData=await uRes.json();if(uData)openMemberProfileModal(uname,uData);};});
div.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'message',msg:{id:msgId,...msg}};const opts=['reply','react'];if(msg.user===currentUser)opts.push('edit-msg');if(isAdmin||msg.user===currentUser)opts.push('delete');showContextMenu(e.clientX,e.clientY,opts);};
chatMsgs.appendChild(div);
});
if(isScrolledToBottom)chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
bindChatForm();
}
}

async function renderForumView(){
const canCreatePost=await checkPermission(currentChannel,'create_post');
const canWrite=await checkPermission(currentChannel,'write');
if(!activeForumPostId){
const postsRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
const posts=await postsRes.json()||{};
const postEntries=Object.entries(posts).sort((a,b)=>(b[1].time||0)-(a[1].time||0));
let postsHtml='';
postEntries.forEach(([postId,post])=>{
const dateStr=new Date(post.time||Date.now()).toLocaleDateString();
postsHtml+=`<div class="forum-post-card" data-postid="${postId}"><div class="forum-post-title">${escapeHtml(post.title)}</div><div class="forum-post-snippet">${escapeHtml(post.text)}</div><div class="forum-post-footer"><span>By: ${escapeHtml(post.user)}</span><span>Date: ${dateStr}</span></div></div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><span>F Forum</span><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="forum-container"><div class="forum-toolbar"><span style="font-size:12px;letter-spacing:1px;font-weight:600">PUBLICATIONS</span>${canCreatePost?`<button class="admin-panel-btn" id="create-forum-post-btn" style="flex-grow:0;padding:8px 14px">+ CREATE</button>`:''}</div>${postEntries.length===0?'<div class="empty-state">No publications yet.</div>':postsHtml}</div>`;
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
if(canCreatePost){
const btn=document.getElementById('create-forum-post-btn');
if(btn)btn.onclick=()=>openCreateForumPostModal();
}
mainDisplayArea.querySelectorAll('.forum-post-card').forEach(card=>{
card.onclick=()=>{activeForumPostId=card.dataset.postid;renderForumView();};
});
}else{
const postRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
const post=await postRes.json();
if(!post){activeForumPostId=null;renderForumView();return;}
const commentsRes=await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
const comments=await commentsRes.json()||{};
const commentEntries=Object.entries(comments).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
let commentsHtml='';
commentEntries.forEach(([cId,c])=>{
const timeStr=new Date(c.time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let mediaHtml='';
if(c.media)mediaHtml=(c.media.startsWith('data:video')||c.media.includes('video'))?`<video src="${c.media}" controls></video>`:`<img src="${c.media}" alt="media">`;
const canDel=isAdmin||c.user===currentUser;
const avSrc=getStableAvatar(c.user,c.avatar);
commentsHtml+=`<div class="message"><img class="msg-avatar" src="${avSrc}" alt="" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(c.user)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${parseMarkdown(escapeHtml(c.text||''))}</div>${mediaHtml}</div>${canDel?`<div class="msg-actions"><button class="msg-action-btn" data-delc="${cId}">Del</button></div>`:''}</div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><div style="display:flex;align-items:center;gap:12px"><button id="back-to-forum-list" style="background:none;border:none;color:#888;cursor:pointer;font-size:13px">← Back</button><span>F ${escapeHtml(post.title)}</span></div><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="chat-messages" id="chat-messages"><div class="message" style="border-bottom:1px solid #1f1f1f;padding-bottom:12px;margin-bottom:8px"><img class="msg-avatar" src="${getStableAvatar(post.user,post.avatar)}" alt="" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(post.user)}</span><span class="msg-time">${new Date(post.time).toLocaleDateString()}</span></div><div style="font-weight:600;margin-bottom:4px;color:#eee">${escapeHtml(post.title)}</div><div class="msg-text">${parseMarkdown(escapeHtml(post.text))}</div></div></div>${commentsHtml}</div><div class="chat-input-area" id="chat-input-container" style="${canWrite?'':'display:none'}"><form class="chat-input-form" id="chat-form"><label class="file-upload-label" title="Upload">+</label><input type="file" id="media-file-input" accept="image/*,video/*" style="display:none"><input type="text" id="message-input" placeholder="Reply..." autocomplete="off" maxlength="2000"><button type="submit" id="send-btn">SEND</button></form></div>`;
document.getElementById('back-to-forum-list').onclick=()=>{activeForumPostId=null;renderForumView();};
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
document.querySelectorAll('[data-delc]').forEach(btn=>{
btn.onclick=async()=>{
if(!confirm("Delete this comment?"))return;
await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}/${btn.dataset.delc}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});
renderForumView();
};
});
bindChatForm();
const msgContainer=document.getElementById('chat-messages');
if(msgContainer)msgContainer.scrollTop=msgContainer.scrollHeight;
}
}

function openCreateForumPostModal(){
const modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML=`<div class="modal-card" style="width:460px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>CREATE PUBLICATION</h3><button id="close-forum-modal" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px">X</button></div><div class="input-group"><label>TITLE</label><input type="text" id="forum-post-title-input" placeholder="Title..." maxlength="100"></div><div class="input-group"><label>CONTENT</label><textarea id="forum-post-content-input" rows="5" placeholder="Content..." maxlength="2000"></textarea></div><div class="modal-buttons"><button class="admin-panel-btn" id="submit-forum-post-btn">PUBLISH</button></div></div>`;
document.getElementById('modal-container').appendChild(modal);
modal.querySelector('#close-forum-modal').onclick=()=>modal.remove();
modal.querySelector('#submit-forum-post-btn').onclick=async()=>{
const title=modal.querySelector('#forum-post-title-input').value.trim();
const text=modal.querySelector('#forum-post-content-input').value.trim();
if(!title||!text){alert("Fill title and content.");return;}
try{
await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify({title,text,user:currentUser,avatar:getStableAvatar(currentUser,cachedAvatar),time:Date.now()})});
modal.remove();renderForumView();
}catch(e){alert("Failed to create publication.")}
};
}

async function openDM(targetUser){
currentChannel='dm_'+[currentUser,targetUser].sort().join('_');
currentChannelType='text';
channelCooldown=0;
activeForumPostId=null;
displayedCount=MSG_PAGE_SIZE;
activeChannelTitle.textContent=`@ ${targetUser}`;
channelTopic.textContent='Direct Message';
const inp=document.getElementById('message-input');
if(inp)inp.placeholder=`Message @${targetUser}`;
lastMessagesHash="";
renderTextView();
}

function parseMarkdown(text){
return text
.replace(/\*\*(.+?)\*\*/g,'<span class="markdown-bold">$1</span>')
.replace(/\*(.+?)\*/g,'<span class="markdown-italic">$1</span>')
.replace(/`(.+?)`/g,'<span class="markdown-code">$1</span>')
.replace(/\|\|(.+?)\|\|/g,'<span class="markdown-spoiler">$1</span>')
.replace(/@(\w+)/g,'<span class="mention">@$1</span>');
}

function escapeHtml(str){return(str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function generateDefaultAvatar(name){
const canvas=document.createElement('canvas');canvas.width=80;canvas.height=80;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(40,40,40,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ccc';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText((name||'U').charAt(0).toUpperCase(),40,42);
return canvas.toDataURL();
}
