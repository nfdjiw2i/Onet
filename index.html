authForm.addEventListener('submit',async e=>{
e.preventDefault();
const username=usernameInput.value.trim(),password=passwordInput.value.trim();
if(!username||!password)return false;
if(username.length<2){alert("Username must be at least 2 characters.");return false;}
try{
await userIpPromise;
if(isRegistering&&userIp&&userIp!=="unknown"){
try{
const banRes=await fetch(`${FIREBASE_URL}/bans/${userIp.replace(/[.#$\/\[\]]/g,'_')}.json?auth=${FIREBASE_TOKEN}`);
const banData=await banRes.json();
if(banData===true||(banData&&banData.banned)){alert("ACCESS DENIED — IP BANNED");return false;}
}catch(err){}
}
const res=await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
const users=await res.json()||{};
if(isRegistering){
if(users[username]){alert("Username already exists.");return false;}
const isFirstUser=Object.keys(users).length===0;
let role="member";
if(isFirstUser||username===OWNER){
role="admin";
}else{
try{
const defRes=await fetch(`${FIREBASE_URL}/server/defaultRole.json?auth=${FIREBASE_TOKEN}`);
const defRole=await defRes.json();
if(defRole&&typeof defRole==="string")role=defRole;
}catch(e){}
}
await fetch(`${FIREBASE_URL}/users/${username}.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({password,ip:userIp,avatar:"",bio:isFirstUser?"Server Owner":"Member",role,joined:Date.now(),status:"online",mutedUntil:0,banReason:""})});
if(isFirstUser){
await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({
admin:{name:"Admin",color:"#ffffff",hoist:true,permissions:{view_channels:true,send_messages:true,manage_channels:true,manage_roles:true,administrator:true,send_links:true}},
member:{name:"Member",color:"#aaaaaa",hoist:false,permissions:{view_channels:true,send_messages:true,manage_channels:false,manage_roles:false,administrator:false,send_links:true}}
})});
await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("F.R.I.E.N.D.S")});
await fetch(`${FIREBASE_URL}/server/defaultRole.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("member")});
await fetch(`${FIREBASE_URL}/server/blacklist.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify([])});
}
currentUser=username;localStorage.setItem('chat_user',currentUser);
showWelcomeIntro(username,role);
checkBanAndInitialize();
}else{
if(!users[username]||users[username].password!==password){alert("Invalid username or password.");return false;}
if(users[username].banReason){
showBanScreen(users[username].banReason);
return false;
}
await fetch(`${FIREBASE_URL}/users/${username}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
await fetch(`${FIREBASE_URL}/users/${username}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("online")});
currentUser=username;localStorage.setItem('chat_user',currentUser);checkBanAndInitialize();
}
}catch(err){alert("Connection error. Please try again.");console.error(err);}
return false;
});

async function checkBanAndInitialize(){
try{
await userIpPromise;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const userData=await userRes.json();
if(!userData){localStorage.removeItem('chat_user');currentUser=null;return}
if(userData.banReason){showBanScreen(userData.banReason);localStorage.removeItem('chat_user');currentUser=null;return}
userMutedUntil=userData.mutedUntil||0;
await fetch(`${FIREBASE_URL}/users/${currentUser}/ip.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(userIp)});
await fetch(`${FIREBASE_URL}/users/${currentUser}/status.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("online")});
isAdmin=(userData.role==="admin"||currentUser===OWNER);
authScreen.classList.add('hidden');appScreen.classList.remove('hidden');currentUsernameDisplay.textContent=currentUser;
const sNameRes=await fetch(`${FIREBASE_URL}/server/name.json?auth=${FIREBASE_TOKEN}`);
serverTitleDisplay.textContent=(await sNameRes.json())||"F.R.I.E.N.D.S";
const rootRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
if(!await rootRes.json()){
await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({categories:{general_cat:{name:"TEXT CHANNELS",order:0,channels:{general:{name:"general",topic:"Welcome to F.R.I.E.N.D.S",type:"text",order:0,cooldown:0,nsfw:false,permissions:{}},announcements:{name:"announcements",topic:"Official announcements",type:"text",order:1,cooldown:0,nsfw:false,permissions:{}}}}}})});
}
const rolesCheck=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
if(!await rolesCheck.json()){
await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify({
admin:{name:"Admin",color:"#ffffff",hoist:true,permissions:{view_channels:true,send_messages:true,manage_channels:true,manage_roles:true,administrator:true,send_links:true}},
member:{name:"Member",color:"#aaaaaa",hoist:false,permissions:{view_channels:true,send_messages:true,manage_channels:false,manage_roles:false,administrator:false,send_links:true}}
})});
}
try{
const blRes=await fetch(`${FIREBASE_URL}/server/blacklist.json?auth=${FIREBASE_TOKEN}`);
serverBlacklist=await blRes.json()||[];
if(!Array.isArray(serverBlacklist))serverBlacklist=[];
}catch(e){serverBlacklist=[];}
fetchUserDataAndAvatar();startPolling();
}catch(err){console.error(err);alert("Failed to initialize.")}
}

function getStableAvatar(name,url){
const key=name+(url||'');
if(avatarCache[key])return avatarCache[key];
const src=url&&url.length>5?url:generateDefaultAvatar(name);
avatarCache[key]=src;
return src;
}

});

attachBlDel();

function startCooldown(seconds){
if(seconds<=0)return;
clearInterval(cooldownTimer);
let remaining=seconds;
const btn=document.getElementById('send-btn');
const inp=document.getElementById('message-input');
if(btn)btn.disabled=true;
if(inp)inp.disabled=true;
const bar=document.getElementById('cooldown-bar');
const fill=document.getElementById('cooldown-fill');
const txt=document.getElementById('cooldown-text');
if(bar)bar.style.display='block';
if(txt){txt.style.display='block';txt.textContent=`Cooldown: ${remaining}s`;}
if(fill)fill.style.width='100%';
const start=Date.now();
cooldownTimer=setInterval(()=>{
const elapsed=(Date.now()-start)/1000;
remaining=Math.max(0,seconds-elapsed);
const pct=(remaining/seconds)*100;
if(fill)fill.style.width=pct+'%';
if(txt)txt.textContent=`Cooldown: ${Math.ceil(remaining)}s`;
if(remaining<=0){
clearInterval(cooldownTimer);
if(btn)btn.disabled=false;
if(inp)inp.disabled=false;
if(bar)bar.style.display='none';
if(txt){txt.style.display='none';txt.textContent='';}
}
},50);
}

function autoResizeTextarea(ta){
if(!ta)return;
ta.style.height='auto';
ta.style.height=Math.min(ta.scrollHeight,160)+'px';
}

function bindChatForm(){
const form=document.getElementById('chat-form');
if(!form)return;
const ta=document.getElementById('message-input');
if(ta){
ta.addEventListener('input',()=>autoResizeTextarea(ta));
ta.addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
form.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));
}
});
}
form.onsubmit=async e=>{
e.preventDefault();
e.stopPropagation();
const btn=document.getElementById('send-btn');
if(btn&&btn.disabled)return;
const inp=document.getElementById('message-input');
const fileInp=document.getElementById('media-file-input');
let text=(inp?inp.value:'').trim();
if(!text&&!(fileInp&&fileInp.files[0]))return;

if(userMutedUntil&&userMutedUntil>Date.now()){
alert("You are muted until "+new Date(userMutedUntil).toLocaleString());
return;
}

// Blacklist check
const lower=text.toLowerCase();
for(const item of serverBlacklist){
if(lower.includes(item.word)){
if(item.action==='delete'){alert("Message contains forbidden word.");return;}
if(item.action==='mute'){
const until=Date.now()+(item.duration||10)*60*1000;
await fetch(`${FIREBASE_URL}/users/${currentUser}/mutedUntil.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(until)});
userMutedUntil=until;
alert("You have been muted for using a forbidden word.");
return;
}
if(item.action==='ban'){
await fetch(`${FIREBASE_URL}/users/${currentUser}/banReason.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify("Automatic ban: forbidden word")});
alert("You have been banned for using a forbidden word.");
localStorage.removeItem('chat_user');currentUser=null;location.reload();
return;
}
}
}

if(editingMsgId){
await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${editingMsgId}/text.json?auth=${FIREBASE_TOKEN}`,{method:'PUT',body:JSON.stringify(text)});
editingMsgId=null;if(inp){inp.value='';autoResizeTextarea(inp);inp.placeholder=`Message #${currentChannel}`;}lastMessagesHash="";fetchData();return;
}
const now=Date.now();
if(channelCooldown>0&&(now-lastMessageTime)<channelCooldown*1000){
const left=Math.ceil((channelCooldown*1000-(now-lastMessageTime))/1000);
alert(`Cooldown active. Wait ${left}s.`);
return;
}
if(fileInp&&fileInp.files&&fileInp.files[0]){
const file=fileInp.files[0];
if(file.size>4*1024*1024){alert("File too large (max 4 MB).");fileInp.value="";return;}
const reader=new FileReader();
reader.onload=async ev=>{
const mediaUrl=ev.target.result;fileInp.value="";
if(currentChannelType==='forum'&&activeForumPostId)executeOptimisticForumComment(text,mediaUrl);
else executeOptimisticSend(text,mediaUrl);
if(channelCooldown>0)startCooldown(channelCooldown);
};
reader.readAsDataURL(file);return;
}
if(inp){inp.value='';autoResizeTextarea(inp);}
if(currentChannelType==='forum'&&activeForumPostId)executeOptimisticForumComment(text,"");
else executeOptimisticSend(text,"");
if(channelCooldown>0)startCooldown(channelCooldown);
};
const label=document.querySelector('.file-upload-label');
if(label)label.onclick=()=>{const fi=document.getElementById('media-file-input');if(fi)fi.click();};
}

chatForm.addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();});

function executeOptimisticSend(text,mediaUrl){
const time=Date.now();
lastMessageTime=time;
const avatar=getStableAvatar(currentUser,cachedAvatar);
const date=new Date(time);
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const div=document.createElement('div');div.className='message';
let mediaHtml='';
if(mediaUrl)mediaHtml=(mediaUrl.startsWith('data:video')||mediaUrl.includes('video'))?`<video src="${mediaUrl}" controls></video>`:`<img src="${mediaUrl}" alt="media">`;
let replyHtml='';
if(replyToMsg)replyHtml=`<div style="font-size:11px;color:#555;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">Reply to ${escapeHtml(replyToMsg.user)}: ${escapeHtml((replyToMsg.text||'').substring(0,50))}</div>`;
div.innerHTML=`<img class="msg-avatar" src="${avatar}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(currentUser)}</span><span class="msg-time">${timeStr}</span></div>${replyHtml}<div class="msg-text">${parseMarkdown(escapeHtml(text))}</div>${mediaHtml}</div>`;
const emptyState=chatMsgs.querySelector('.empty-state');if(emptyState)emptyState.remove();
chatMsgs.appendChild(div);chatMsgs.scrollTop=chatMsgs.scrollHeight;
const payload={user:currentUser,avatar,text,media:mediaUrl,time,reactions:{}};
if(replyToMsg){payload.replyTo={id:replyToMsg.id,user:replyToMsg.user,text:replyToMsg.text};replyToMsg=null;}
fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify(payload)}).then(()=>{lastMessagesHash="";}).catch(err=>console.error("Send failed:",err));
}

function executeOptimisticForumComment(text,mediaUrl){
if(!activeForumPostId)return;
const time=Date.now();
const avatar=getStableAvatar(currentUser,cachedAvatar);
const date=new Date(time);
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs)return;
const div=document.createElement('div');div.className='message';
let mediaHtml='';
if(mediaUrl)mediaHtml=(mediaUrl.startsWith('data:video')||mediaUrl.includes('video'))?`<video src="${mediaUrl}" controls></video>`:`<img src="${mediaUrl}" alt="media">`;
div.innerHTML=`<img class="msg-avatar" src="${avatar}" alt=""><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(currentUser)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${parseMarkdown(escapeHtml(text))}</div>${mediaHtml}</div>`;
const emptyState=chatMsgs.querySelector('.empty-state');if(emptyState)emptyState.remove();
chatMsgs.appendChild(div);chatMsgs.scrollTop=chatMsgs.scrollHeight;
fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify({user:currentUser,avatar,text,media:mediaUrl,time})}).then(()=>{lastMessagesHash="";}).catch(err=>console.error("Forum comment failed:",err));
}

async function checkPermission(channelKey,action){
if(isAdmin)return true;
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const struct=await structRes.json();
let chanObj=null,catObj=null;
for(let catKey in struct.categories){
if(struct.categories[catKey].channels&&struct.categories[catKey].channels[channelKey]){
chanObj=struct.categories[catKey].channels[channelKey];
catObj=struct.categories[catKey];
break;
}
}
if(!chanObj)return true;
const userRes=await fetch(`${FIREBASE_URL}/users/${currentUser}.json?auth=${FIREBASE_TOKEN}`);
const uData=await userRes.json();
const uRole=uData?.role||'member';
const rolesRes=await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
const roles=await rolesRes.json()||{};
const rolePerms=roles[uRole]?.permissions||{};
if(rolePerms.administrator)return true;

// Category permissions first
if(catObj&&catObj.permissions){
const catRolePerm=catObj.permissions[uRole];
if(catRolePerm&&catRolePerm[action]===false)return false;
if(catRolePerm&&catRolePerm[action]===true)return true;
}

if(action==='read'||action==='view'){if(rolePerms.view_channels===false)return false;}
if(action==='write'||action==='send'){if(rolePerms.send_messages===false)return false;}
if(action==='send_links'){if(rolePerms.send_links===false)return false;}

const perms=chanObj.permissions||{};
if(perms.users&&perms.users[currentUser]&&perms.users[currentUser][action]!==undefined)return perms.users[currentUser][action];
const rolePerm=perms[uRole];
if(rolePerm&&rolePerm[action]===false)return false;
if(rolePerm&&rolePerm[action]===true)return true;
return true;
}catch(e){return true}
}

async function reorderCategories(dragCatKey,targetCatKey,insertBefore){
try{
const structRes=await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
const structure=await structRes.json()||{categories:{}};
const cats=structure.categories||{};
const sorted=Object.keys(cats).sort((a,b)=>(cats[a].order||0)-(cats[b].order||0));
const fromIdx=sorted.indexOf(dragCatKey);
const toIdx=sorted.indexOf(targetCatKey);
if(fromIdx===-1||toIdx===-1||fromIdx===toIdx)return;
sorted.splice(fromIdx,1);
const newToIdx=sorted.indexOf(targetCatKey);
const insertIdx=insertBefore?newToIdx:newToIdx+1;
sorted.splice(insertIdx,0,dragCatKey);
const updates={};
sorted.forEach((key,i)=>{updates[`categories/${key}/order`]=i;});
await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`,{method:'PATCH',body:JSON.stringify(updates)});
fetchData();
}catch(e){console.error(e);alert("Failed to reorder categories.");}
}

async function moveChannel(dragChKey, fromCatKey, toCatKey, targetChKey, insertBefore){
  try{
    const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
    const structure = await structRes.json() || {categories:{}};
    const fromCat = structure.categories[fromCatKey];
    const toCat = structure.categories[toCatKey];
    if(!fromCat || !toCat || !fromCat.channels || !fromCat.channels[dragChKey]) return;
    const channelData = {...fromCat.channels[dragChKey]};
    let fromChannels = Object.keys(fromCat.channels).filter(k => k !== dragChKey).sort((a,b) => (fromCat.channels[a].order||0) - (fromCat.channels[b].order||0));
    let toChannels = Object.keys(toCat.channels || {}).filter(k => k !== dragChKey).sort((a,b) => (toCat.channels[a].order||0) - (toCat.channels[b].order||0));
    if(targetChKey && toChannels.includes(targetChKey)){
      const tIdx = toChannels.indexOf(targetChKey);
      toChannels.splice(insertBefore ? tIdx : tIdx + 1, 0, dragChKey);
    } else {
      toChannels.push(dragChKey);
    }
    if(fromCatKey !== toCatKey){
      await fetch(`${FIREBASE_URL}/structure/categories/${fromCatKey}/channels/${dragChKey}.json?auth=${FIREBASE_TOKEN}`, {method: 'DELETE'});
    }
    channelData.order = toChannels.indexOf(dragChKey);
    await fetch(`${FIREBASE_URL}/structure/categories/${toCatKey}/channels/${dragChKey}.json?auth=${FIREBASE_TOKEN}`, {method: 'PUT', body: JSON.stringify(channelData)});
    const orderUpdates = {};
    toChannels.forEach((k, i) => {orderUpdates[`categories/${toCatKey}/channels/${k}/order`] = i;});
    if(fromCatKey !== toCatKey){
      fromChannels.forEach((k, i) => {orderUpdates[`categories/${fromCatKey}/channels/${k}/order`] = i;});
    }
    if(Object.keys(orderUpdates).length > 0){
      await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`, {method: 'PATCH', body: JSON.stringify(orderUpdates)});
    }
    if(currentChannel === dragChKey) currentChannelCatKey = toCatKey;
    fetchData();
  }catch(e){console.error(e);alert("Failed to move channel.");}
}

function clearDragStyles(){
  document.querySelectorAll('.dragging, .dragging-cat, .drag-over, .drag-over-cat, .drag-over-list').forEach(el=>{
    el.classList.remove('dragging','dragging-cat','drag-over','drag-over-cat','drag-over-list');
  });
  dragData = null;
  isDragging = false;
}

function setupDragEvents(el, type, id, catId){
  if(!isAdmin) return;
  el.classList.add('draggable-item');
  el.draggable = true;
  el.addEventListener('dragstart', e=>{
    e.stopPropagation();
    isDragging = true;
    dragData = {type, id, catId};
    el.classList.add('dragging');
    if(type==='category'){
      const group=el.closest('.category-group');
      if(group)group.classList.add('dragging-cat');
    }
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', JSON.stringify(dragData)); }catch(err){}
  });
  el.addEventListener('dragend', ()=>{clearDragStyles();});
  el.addEventListener('dragover', e=>{
    e.preventDefault();e.stopPropagation();
    if(!dragData) return;
    if(type === 'category' && dragData.type === 'category' && dragData.id !== id) el.classList.add('drag-over');
    else if(type === 'channel' && dragData.type === 'channel') el.classList.add('drag-over');
    else if((type === 'category' || type === 'channellist') && dragData.type === 'channel'){
      if(type === 'category') el.classList.add('drag-over');
      if(type === 'channellist') el.classList.add('drag-over-list');
    }
  });
  el.addEventListener('dragleave', e=>{el.classList.remove('drag-over','drag-over-list');});
  el.addEventListener('drop', async e=>{
    e.preventDefault();e.stopPropagation();
    el.classList.remove('drag-over','drag-over-list');
    if(!dragData || !isAdmin) return;
    if(dragData.type === 'category' && type === 'category' && dragData.id !== id){
      const rect = el.getBoundingClientRect();
      const insertBefore = e.clientY < (rect.top + rect.height / 2);
      await reorderCategories(dragData.id, id, insertBefore);
    } else if(dragData.type === 'channel'){
      if(type === 'channel'){
        const rect = el.getBoundingClientRect();
        const insertBefore = e.clientY < (rect.top + rect.height / 2);
        await moveChannel(dragData.id, dragData.catId, catId, id, insertBefore);
      } else if(type === 'category' || type === 'channellist'){
        await moveChannel(dragData.id, dragData.catId, id, null, false);
      }
    }
    clearDragStyles();
  });
}

function setupCategoryGroupDrop(catGroup, catKey){
  if(!isAdmin) return;
  catGroup.addEventListener('dragover', e=>{
    e.preventDefault();
    if(dragData && (dragData.type === 'channel' || (dragData.type === 'category' && dragData.id !== catKey))){
      catGroup.classList.add('drag-over-cat');
    }
  });
  catGroup.addEventListener('dragleave', e=>{
    if(!catGroup.contains(e.relatedTarget)) catGroup.classList.remove('drag-over-cat');
  });
  catGroup.addEventListener('drop', async e=>{
    e.preventDefault();e.stopPropagation();
    catGroup.classList.remove('drag-over-cat');
    if(!dragData || !isAdmin) return;
    if(dragData.type === 'channel') await moveChannel(dragData.id, dragData.catId, catKey, null, false);
    else if(dragData.type === 'category' && dragData.id !== catKey){
      const rect = catGroup.getBoundingClientRect();
      const insertBefore = e.clientY < (rect.top + rect.height / 2);
      await reorderCategories(dragData.id, catKey, insertBefore);
    }
    clearDragStyles();
  });
}

function extractYoutubeId(url){
  const reg=/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
  const m=url.match(reg);
  return m?m[1]:null;
}

async function fetchData(){
  if(isPolling || isDragging) return;
  isPolling = true;
  try{
    const structRes = await fetch(`${FIREBASE_URL}/structure.json?auth=${FIREBASE_TOKEN}`);
    const structure = await structRes.json() || {categories:{}};
    channelsContainer.innerHTML = '';
    let channelExists = false;
    const sortedCategories = Object.keys(structure.categories || {}).sort((a,b)=>(structure.categories[a].order||0)-(structure.categories[b].order||0));
    
    sortedCategories.forEach(catKey=>{
      const cat = structure.categories[catKey];
      const catDiv = document.createElement('div');
      catDiv.className = 'category-group';
      const catHeader = document.createElement('div');
      catHeader.className = 'category-header';
      catHeader.innerHTML = `<span>${escapeHtml(cat.name)}</span>`;
      if(isAdmin){
        catHeader.oncontextmenu = e=>{
          e.preventDefault(); e.stopPropagation();
          contextTarget = {type:'category', id:catKey, name:cat.name};
          showContextMenu(e.clientX, e.clientY, ['create-channel','create-forum','cat-permissions','edit','delete']);
        };
        setupDragEvents(catHeader, 'category', catKey, null);
      }
      catDiv.appendChild(catHeader);
      const chansContainer = document.createElement('div');
      chansContainer.className = 'category-channels';
      if(isAdmin) setupDragEvents(chansContainer, 'channellist', catKey, null);

      if(cat.channels){
        const sortedChans = Object.keys(cat.channels).sort((a,b)=>(cat.channels[a].order||0)-(cat.channels[b].order||0));
        sortedChans.forEach(chKey=>{
          const ch = cat.channels[chKey];
          if(chKey === currentChannel){
            channelExists = true;
            currentChannelCatKey = catKey;
            currentChannelType = ch.type || 'text';
            channelCooldown = ch.cooldown || 0;
          }
          const symbol = ch.type === 'forum' ? 'F' : '#';
          const chDiv = document.createElement('div');
          chDiv.className = `channel-item ${currentChannel===chKey?'active':''}`;
          chDiv.innerHTML = `<span><span class="symbol">${symbol}</span>${escapeHtml(ch.name)}</span>${isAdmin?`<button style="background:none;border:none;color:#444;cursor:pointer;font-size:11px" title="Settings" onclick="event.stopPropagation();openChannelSettingsModal('${catKey}','${chKey}')">⚙</button>`:''}`;
          
          chDiv.onclick = async ()=>{
            // Instant clear to prevent flash of old messages
            currentRenderToken++;
            const myToken=currentRenderToken;
            const chatMsgs=document.getElementById('chat-messages');
            if(chatMsgs) chatMsgs.innerHTML='<div class="empty-state">Loading...</div>';
            
            const canRead = await checkPermission(chKey,'read');
            if(!canRead){alert("ACCESS DENIED — NO VIEW PERMISSION");return}
            if(myToken!==currentRenderToken)return;
            currentChannel = chKey;
            currentChannelCatKey = catKey;
            currentChannelType = ch.type || 'text';
            channelCooldown = ch.cooldown || 0;
            activeForumPostId = null;
            replyToMsg = null;
            editingMsgId = null;
            displayedCount = MSG_PAGE_SIZE;
            allMessagesCache = {};
            lastMessagesHash = "";
            activeChannelTitle.textContent = `${symbol} ${ch.name}`;
            channelTopic.textContent = ch.topic || '';
            const inp = document.getElementById('message-input');
            if(inp) inp.placeholder = `Message ${symbol}${ch.name}`;
            fetchData();
          };

          if(isAdmin){
            chDiv.oncontextmenu = e=>{
              e.preventDefault(); e.stopPropagation();
              contextTarget = {type:'channel', id:chKey, catId:catKey, name:ch.name};
              showContextMenu(e.clientX, e.clientY, ['edit','permissions','delete']);
            };
            setupDragEvents(chDiv, 'channel', chKey, catKey);
          }
          chansContainer.appendChild(chDiv);
        });
      }
      catDiv.appendChild(chansContainer);
      if(isAdmin) setupCategoryGroupDrop(catDiv, catKey);
      channelsContainer.appendChild(catDiv);
    });

    if(!channelExists && sortedCategories.length > 0) currentChannel = "general";
    
    const canReadActive = await checkPermission(currentChannel,'read');
    if(!canReadActive){
      mainDisplayArea.innerHTML = `<div class="chat-header"><span># restricted</span></div><div class="chat-messages"><div class="access-denied">ACCESS DENIED<br>NO VIEW PERMISSION</div></div>`;
    }else{
      if(currentChannelType==='forum') renderForumView();
      else renderTextView();
    }

    const userRes = await fetch(`${FIREBASE_URL}/users.json?auth=${FIREBASE_TOKEN}`);
    const users = await userRes.json() || {};
    const rolesRes = await fetch(`${FIREBASE_URL}/roles.json?auth=${FIREBASE_TOKEN}`);
    const roles = await rolesRes.json() || {member:{name:"Member",color:"#aaaaaa",hoist:false}};
    sidebarMembersContainer.innerHTML = '';
    const grouped = {};
    Object.keys(roles).forEach(rKey => grouped[rKey] = []);
    if(!grouped.member) grouped.member = [];
    Object.keys(users).forEach(uname=>{
      const uData = users[uname];
      if(uData.banReason) return;
      const uRole = uData.role && roles[uData.role] ? uData.role : 'member';
      if(!grouped[uRole]) grouped[uRole] = [];
      grouped[uRole].push({name:uname, ...uData});
    });
    const sortedRoleKeys = Object.keys(roles).sort((a,b)=>{
      const ha = roles[a].hoist ? 0 : 1;
      const hb = roles[b].hoist ? 0 : 1;
      return ha - hb || (roles[a].name||'').localeCompare(roles[b].name||'');
    });
    sortedRoleKeys.forEach(rKey=>{
      const rList = grouped[rKey] || [];
      if(rList.length === 0) return;
      const r = roles[rKey];
      if(!r.hoist && rKey !== 'member' && rKey !== 'admin') return;
      const sec = document.createElement('div');
      sec.className = 'members-section';
      const rColor = r.color || '#aaaaaa';
      sec.innerHTML = `<h3 style="color:${rColor}">${(r.name||rKey).toUpperCase()} — ${rList.length}</h3>`;
      rList.forEach(user=>{
        const status = user.status || 'offline';
        const mDiv = document.createElement('div');
        mDiv.className = 'member-item';
        const avSrc = getStableAvatar(user.name, user.avatar);
        mDiv.innerHTML = `<div style="position:relative"><img class="member-avatar-sm" src="${avSrc}" alt="" loading="eager"><div class="status-dot status-${status}"></div></div><span style="color:${rColor}">${escapeHtml(user.name)}</span>`;
        mDiv.onclick = () => openMemberProfileModal(user.name, user);
        sec.appendChild(mDiv);
      });
      sidebarMembersContainer.appendChild(sec);
    });
  }catch(err){console.error(err)}
  finally{isPolling=false}
}

async function renderTextView(){
const myToken=++currentRenderToken;
if(!document.getElementById('chat-messages')){
mainDisplayArea.innerHTML=`<div class="chat-header"><div style="display:flex;align-items:center"><span id="active-channel-title"># general</span><span class="topic" id="channel-topic"></span></div><button class="channel-settings-gear" id="channel-gear-btn" title="Channel Settings">⚙</button></div><div class="chat-messages" id="chat-messages"></div><div class="typing-indicator" id="typing-indicator"></div><div class="chat-input-area" id="chat-input-container"><form class="chat-input-form" id="chat-form"><label class="file-upload-label" title="Upload">+</label><input type="file" id="media-file-input" accept="image/*,video/*" style="display:none"><textarea id="message-input" placeholder="Message channel..." autocomplete="off" maxlength="2000" rows="1"></textarea><button type="submit" id="send-btn">SEND</button></form><div class="cooldown-bar" id="cooldown-bar"><div class="cooldown-fill" id="cooldown-fill"></div></div><div class="cooldown-text" id="cooldown-text"></div></div>`;
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
bindChatForm();
}
const canWrite=await checkPermission(currentChannel,'write');
const inputContainer=document.getElementById('chat-input-container');
if(inputContainer)inputContainer.style.display=canWrite?'block':'none';
const msgRes=await fetch(`${FIREBASE_URL}/messages/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
if(myToken!==currentRenderToken)return;
const messages=await msgRes.json()||{};
allMessagesCache=messages;
const msgEntries=Object.entries(messages).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
const newHash=JSON.stringify(msgEntries.map(e=>e[0]+JSON.stringify(e[1].reactions||{})));
if(newHash!==lastMessagesHash){
lastMessagesHash=newHash;
const chatMsgs=document.getElementById('chat-messages');
if(!chatMsgs||myToken!==currentRenderToken)return;
const isScrolledToBottom=chatMsgs.scrollHeight-chatMsgs.scrollTop<=chatMsgs.clientHeight+80;
const total=msgEntries.length;
const startIdx=Math.max(0,total-displayedCount);
const visible=msgEntries.slice(startIdx);
chatMsgs.innerHTML='';
if(total===0){
chatMsgs.innerHTML='<div class="empty-state">No messages yet. Start the conversation.</div>';
}else{
if(startIdx>0){
const loadMore=document.createElement('div');
loadMore.className='load-more';
loadMore.textContent=`Load older messages (${startIdx} remaining)`;
loadMore.onclick=()=>{displayedCount+=MSG_PAGE_SIZE;lastMessagesHash="";renderTextView();};
chatMsgs.appendChild(loadMore);
}
visible.forEach(([msgId,msg])=>{
const date=new Date(msg.time||Date.now());
const timeStr=`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
const div=document.createElement('div');div.className='message';div.dataset.msgid=msgId;
let mediaHtml='';
if(msg.media)mediaHtml=(msg.media.startsWith('data:video')||msg.media.includes('video'))?`<video src="${msg.media}" controls></video>`:`<img src="${msg.media}" alt="media">`;
let replyHtml='';
if(msg.replyTo)replyHtml=`<div style="font-size:11px;color:#555;margin-bottom:4px;border-left:2px solid #333;padding-left:8px">Reply to ${escapeHtml(msg.replyTo.user)}: ${escapeHtml((msg.replyTo.text||'').substring(0,50))}</div>`;
let reactionsHtml='';
if(msg.reactions&&Object.keys(msg.reactions).length){
reactionsHtml='<div class="reaction-bar">';
Object.entries(msg.reactions).forEach(([emoji,users])=>{
const active=users.includes(currentUser)?'active':'';
reactionsHtml+=`<div class="reaction ${active}" data-emoji="${escapeHtml(emoji)}" data-msgid="${msgId}">${escapeHtml(emoji)} ${users.length}</div>`;
});
reactionsHtml+='</div>';
}
// YouTube detection
let ytHtml='';
const ytMatch=(msg.text||'').match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
if(ytMatch){
const vid=ytMatch[1];
ytHtml=`<div class="yt-embed" data-ytid="${vid}"><div class="yt-thumb-wrap"><img src="https://img.youtube.com/vi/${vid}/hqdefault.jpg" alt="YouTube"><div class="yt-play">▶</div></div><div class="yt-info">YouTube Video • Click to watch</div></div>`;
}
const canDelete=isAdmin||msg.user===currentUser;
const canEdit=msg.user===currentUser;
const avSrc=getStableAvatar(msg.user,msg.avatar);
div.innerHTML=`<img class="msg-avatar" src="${avSrc}" alt="" data-user="${escapeHtml(msg.user)}" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user" data-user="${escapeHtml(msg.user)}">${escapeHtml(msg.user)}</span><span class="msg-time">${timeStr}</span></div>${replyHtml}<div class="msg-text">${parseMarkdown(escapeHtml(msg.text||''))}</div>${mediaHtml}${ytHtml}${reactionsHtml}</div><div class="msg-actions">${canEdit?`<button class="msg-action-btn" data-edit="${msgId}">Edit</button>`:''}${canDelete?`<button class="msg-action-btn" data-del="${msgId}">Del</button>`:''}<button class="msg-action-btn" data-reply="${msgId}">Reply</button><button class="msg-action-btn" data-react="${msgId}">React</button></div>`;
if(canDelete)div.querySelector('[data-del]').onclick=async ev=>{ev.stopPropagation();if(!confirm("Delete this message?"))return;await fetch(`${FIREBASE_URL}/messages/${currentChannel}/${msgId}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});lastMessagesHash="";fetchData();};
if(canEdit)div.querySelector('[data-edit]').onclick=ev=>{ev.stopPropagation();editingMsgId=msgId;const inp=document.getElementById('message-input');if(inp){inp.value=msg.text||'';autoResizeTextarea(inp);inp.placeholder='Editing message...';inp.focus();}};
div.querySelector('[data-reply]').onclick=ev=>{ev.stopPropagation();replyToMsg={id:msgId,user:msg.user,text:msg.text};const inp=document.getElementById('message-input');if(inp){inp.placeholder=`Replying to ${msg.user}...`;inp.focus();}};
div.querySelector('[data-react]').onclick=ev=>{ev.stopPropagation();const emoji=prompt("Enter reaction:");if(emoji)addReaction(msgId,emoji.trim());};
div.querySelectorAll('.reaction').forEach(r=>{r.onclick=()=>addReaction(r.dataset.msgid,r.dataset.emoji);});
div.querySelectorAll('[data-user]').forEach(el=>{el.onclick=async()=>{const uname=el.dataset.user;const uRes=await fetch(`${FIREBASE_URL}/users/${uname}.json?auth=${FIREBASE_TOKEN}`);const uData=await uRes.json();if(uData)openMemberProfileModal(uname,uData);};});
div.querySelectorAll('.yt-embed').forEach(emb=>{
emb.onclick=()=>openVideoOverlay(emb.dataset.ytid,"YouTube Video");
});
div.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();contextTarget={type:'message',msg:{id:msgId,...msg}};const opts=['reply','react'];if(msg.user===currentUser)opts.push('edit-msg');if(isAdmin||msg.user===currentUser)opts.push('delete');showContextMenu(e.clientX,e.clientY,opts);};
chatMsgs.appendChild(div);
});
if(isScrolledToBottom)chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
bindChatForm();
}
}

async function renderForumView(){
const myToken=++currentRenderToken;
const canCreatePost=await checkPermission(currentChannel,'create_post');
const canWrite=await checkPermission(currentChannel,'write');
if(!activeForumPostId){
const postsRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`);
if(myToken!==currentRenderToken)return;
const posts=await postsRes.json()||{};
const postEntries=Object.entries(posts).sort((a,b)=>(b[1].time||0)-(a[1].time||0));
let postsHtml='';
postEntries.forEach(([postId,post])=>{
const dateStr=new Date(post.time||Date.now()).toLocaleDateString();
postsHtml+=`<div class="forum-post-card" data-postid="${postId}"><div class="forum-post-title">${escapeHtml(post.title)}</div><div class="forum-post-snippet">${escapeHtml(post.text)}</div><div class="forum-post-footer"><span>By: ${escapeHtml(post.user)}</span><span>Date: ${dateStr}</span></div></div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><span>F Forum</span><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="forum-container"><div class="forum-toolbar"><span style="font-size:12px;letter-spacing:1px;font-weight:600">PUBLICATIONS</span>${canCreatePost?`<button class="admin-panel-btn" id="create-forum-post-btn" style="flex-grow:0;padding:8px 14px">+ CREATE</button>`:''}</div>${postEntries.length===0?'<div class="empty-state">No publications yet.</div>':postsHtml}</div>`;
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
if(canCreatePost){
const btn=document.getElementById('create-forum-post-btn');
if(btn)btn.onclick=()=>openCreateForumPostModal();
}
mainDisplayArea.querySelectorAll('.forum-post-card').forEach(card=>{
card.onclick=()=>{activeForumPostId=card.dataset.postid;renderForumView();};
});
}else{
const postRes=await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
if(myToken!==currentRenderToken)return;
const post=await postRes.json();
if(!post){activeForumPostId=null;renderForumView();return;}
const commentsRes=await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}.json?auth=${FIREBASE_TOKEN}`);
const comments=await commentsRes.json()||{};
const commentEntries=Object.entries(comments).sort((a,b)=>(a[1].time||0)-(b[1].time||0));
let commentsHtml='';
commentEntries.forEach(([cId,c])=>{
const timeStr=new Date(c.time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let mediaHtml='';
if(c.media)mediaHtml=(c.media.startsWith('data:video')||c.media.includes('video'))?`<video src="${c.media}" controls></video>`:`<img src="${c.media}" alt="media">`;
const canDel=isAdmin||c.user===currentUser;
const avSrc=getStableAvatar(c.user,c.avatar);
commentsHtml+=`<div class="message"><img class="msg-avatar" src="${avSrc}" alt="" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(c.user)}</span><span class="msg-time">${timeStr}</span></div><div class="msg-text">${parseMarkdown(escapeHtml(c.text||''))}</div>${mediaHtml}</div>${canDel?`<div class="msg-actions"><button class="msg-action-btn" data-delc="${cId}">Del</button></div>`:''}</div>`;
});
mainDisplayArea.innerHTML=`<div class="chat-header"><div style="display:flex;align-items:center;gap:12px"><button id="back-to-forum-list" style="background:none;border:none;color:#888;cursor:pointer;font-size:13px">← Back</button><span>F ${escapeHtml(post.title)}</span></div><button class="channel-settings-gear" id="channel-gear-btn">⚙</button></div><div class="chat-messages" id="chat-messages"><div class="message" style="border-bottom:1px solid #1f1f1f;padding-bottom:12px;margin-bottom:8px"><img class="msg-avatar" src="${getStableAvatar(post.user,post.avatar)}" alt="" loading="eager"><div class="msg-content"><div class="msg-header-row"><span class="msg-user">${escapeHtml(post.user)}</span><span class="msg-time">${new Date(post.time).toLocaleDateString()}</span></div><div style="font-weight:600;margin-bottom:4px;color:#eee">${escapeHtml(post.title)}</div><div class="msg-text">${parseMarkdown(escapeHtml(post.text))}</div></div></div>${commentsHtml}</div><div class="chat-input-area" id="chat-input-container" style="${canWrite?'':'display:none'}"><form class="chat-input-form" id="chat-form"><label class="file-upload-label" title="Upload">+</label><input type="file" id="media-file-input" accept="image/*,video/*" style="display:none"><textarea id="message-input" placeholder="Reply..." autocomplete="off" maxlength="2000" rows="1"></textarea><button type="submit" id="send-btn">SEND</button></form></div>`;
document.getElementById('back-to-forum-list').onclick=()=>{activeForumPostId=null;renderForumView();};
document.getElementById('channel-gear-btn').onclick=e=>{e.stopPropagation();if(!isAdmin){alert("ACCESS DENIED — ADMIN ONLY");return}openChannelSettingsModal(currentChannelCatKey,currentChannel);};
document.querySelectorAll('[data-delc]').forEach(btn=>{
btn.onclick=async()=>{
if(!confirm("Delete this comment?"))return;
await fetch(`${FIREBASE_URL}/forum_comments/${currentChannel}/${activeForumPostId}/${btn.dataset.delc}.json?auth=${FIREBASE_TOKEN}`,{method:'DELETE'});
renderForumView();
};
});
bindChatForm();
const msgContainer=document.getElementById('chat-messages');
if(msgContainer)msgContainer.scrollTop=msgContainer.scrollHeight;
}
}

function openCreateForumPostModal(){
const modal=document.createElement('div');modal.className='modal-overlay';
modal.innerHTML=`<div class="modal-card" style="width:480px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>CREATE PUBLICATION</h3><button id="close-forum-modal" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px">X</button></div><div class="input-group"><label>TITLE</label><input type="text" id="forum-post-title-inp" maxlength="100" autocomplete="off"></div><div class="input-group"><label>CONTENT</label><textarea id="forum-post-text-inp" rows="5" maxlength="2000"></textarea></div><div class="modal-buttons"><button class="admin-panel-btn" id="submit-forum-post-btn">PUBLISH</button></div></div>`;
document.getElementById('modal-container').appendChild(modal);
modal.querySelector('#close-forum-modal').onclick=()=>modal.remove();
modal.querySelector('#submit-forum-post-btn').onclick=async()=>{
const title=modal.querySelector('#forum-post-title-inp').value.trim();
const text=modal.querySelector('#forum-post-text-inp').value.trim();
if(!title||!text){alert("Fill in all fields.");return;}
const avatar=getStableAvatar(currentUser,cachedAvatar);
try{
await fetch(`${FIREBASE_URL}/forum_posts/${currentChannel}.json?auth=${FIREBASE_TOKEN}`,{method:'POST',body:JSON.stringify({user:currentUser,avatar,title,text,time:Date.now()})});
modal.remove();renderForumView();
}catch(e){alert("Failed to create publication.");}
};
}

currentChannelType='text';
channelCooldown=0;
activeForumPostId=null;
displayedCount=MSG_PAGE_SIZE;
activeChannelTitle.textContent=`@ ${targetUser}`;
channelTopic.textContent='Direct Message';
const inp=document.getElementById('message-input');
if(inp)inp.placeholder=`Message @${targetUser}`;
lastMessagesHash="";
currentRenderToken++;
renderTextView();
}

function escapeHtml(str){
return(str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function parseMarkdown(text){
let escaped=escapeHtml(text);
escaped=escaped.replace(/```([\s\S]*?)```/g,'<span class="markdown-code">$1</span>');
escaped=escaped.replace(/`([^`]+)`/g,'<span class="markdown-code">$1</span>');
escaped=escaped.replace(/\*\*([^*]+)\*\*/g,'<span class="markdown-bold">$1</span>');
escaped=escaped.replace(/\*([^*]+)\*/g,'<span class="markdown-italic">$1</span>');
escaped=escaped.replace(/\|\|([^|]+)\|\|/g,'<span class="markdown-spoiler" onclick="this.style.color=\'#ccc\'">$1</span>');
// Make links clickable
escaped=escaped.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:#5b9bd5;text-decoration:underline">$1</a>');
return escaped;
}

function generateDefaultAvatar(name){
const canvas=document.createElement('canvas');canvas.width=100;canvas.height=100;
const ctx=canvas.getContext('2d');
let hash=0;for(let i=0;i<name.length;i++)hash=name.charCodeAt(i)+((hash<<5)-hash);
let color='#';for(let i=0;i<3;i++){let value=(hash>>(i*8))&0xFF;color+=('00'+value.toString(16)).slice(-2);}
ctx.fillStyle=color;ctx.fillRect(0,0,100,100);
ctx.fillStyle='#ffffff';ctx.font='bold 45px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(name.charAt(0).toUpperCase(),50,50);
return canvas.toDataURL();
}
